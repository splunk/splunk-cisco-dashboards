name: Package Splunk App / Add-On and Run AppInspect

on:
  workflow_dispatch:

# Allow only 1 concurrent execution
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only. The release job elevates this when it creates a GitHub Release.
permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: [ 3.7, 3.9 ]
    # Avoid running on the template repo itself
    if: github.repository != 'splunk/fdse-template-app'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: pre-commit/action@v3.0.1

  build:
    name: Bundle the App
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: [ 3.7, 3.9 ]
    # Local app packages are produced with ./build.sh. This CI path is reserved
    # for manual checks and version-tag release builds, never pull requests.
    if: github.repository != 'splunk/fdse-template-app'
    needs: pre-commit
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade crudini splunk-packaging-toolkit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Get App Info
        id: app
        run: |
          APP_CONF="packages/splunk-cisco-dashboards/src/main/resources/splunk/default/app.conf"
          MANIFEST="packages/splunk-cisco-dashboards/src/main/resources/splunk/app.manifest"
          if [ -f "$MANIFEST" ]; then
            app_id=$(cat "$MANIFEST" | jq -r '.info.id.name')
            app_version=$(cat "$MANIFEST" | jq -r '.info.id.version')
            echo "name=${app_id}" >> $GITHUB_OUTPUT
            echo "version=${app_version}" >> $GITHUB_OUTPUT
          elif [ -f "$APP_CONF" ]; then
            app_pck_id=$(crudini --get "$APP_CONF" package id 2>/dev/null || echo "")
            app_id=$(crudini --get "$APP_CONF" id name 2>/dev/null || echo "")
            if [ -z "$app_pck_id" ] && [ -z "$app_id" ]; then
              echo "App Info Missing ❌ Please add 'package/app.manifest' or stanza [package] with id in 'package/default/app.conf' as per https://docs.splunk.com/Documentation/Splunk/latest/Admin/Appconf#.5Bpackage.5D"
              exit 1
            fi
            if [ -z "$app_id" ]; then
              app_id=$app_pck_id
            fi
            app_version=$(crudini --get "$APP_CONF" launcher version 2>/dev/null || echo "")
            echo "name=${app_id}" >> $GITHUB_OUTPUT
            echo "version=${app_version}" >> $GITHUB_OUTPUT
          else
            echo "Files Not Found ❌ Please add '${MANIFEST}' or '${APP_CONF}'"
            exit 1
          fi

      - name: Install workspace packages
        run: |
          yarn install --frozen-lockfile

      - name: Bundle App Source
        run: |
          yarn package:app
          ls -lh dist/${{ steps.app.outputs.name }}*.tar.gz
        shell: bash

      - id: artifact
        run: |
          echo "name=${{ steps.app.outputs.name }}-${{ steps.app.outputs.version }}-py${{ matrix.python-version }}" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/${{ steps.app.outputs.name }}*.tar.gz

  appinspect-cli:
    name: appinspect-cli ${{ matrix.tags }}
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build
    strategy:
      matrix:
        tags:
          - "cloud"
          - "private_app"
          - "private_classic"
          - "private_victoria"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist
      - uses: splunk/appinspect-cli-action@v2.10
        with:
          app_path: dist
          included_tags: ${{ matrix.tags }}
      - uses: actions/upload-artifact@v4
        with:
          name: appinspect_result_${{ matrix.tags }}
          path: appinspect_result.json

  release:
    name: Upload Release
    runs-on: ubuntu-latest
    needs:
      - build
      - appinspect-cli
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist
      # Release Notes to be added manually by editing the Release via UI!
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
