name: Evaluate README quality

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  readme-linting:
    runs-on: ubuntu-latest
    # Avoid running on the template repo itself
    if: github.repository != 'splunk/fdse-template-app'
    steps:
      - uses: actions/checkout@v4
      - name: Check for required sections in README
        run: |
          if [ ! -f README.md ]; then
            echo "README.md file is missing ❌ Please add documentation"
            exit 1
          fi

          patterns=(
            "#{1,3} License"
            "#{1,3} Usage"
            "#{1,3} Installation"
          )

          for pattern in "${patterns[@]}"; do
            if grep -Eq "$pattern" README.md; then
              echo "Section '${pattern:7}' found in README.md ✅"
            else
              echo "Section '${pattern:7}' not found in README.md ❌"
              exit 1
            fi
          done
      - name: Check for empty sections
        run: |
          if [ ! -f README.md ]; then
            echo "README.md file is missing ❌ Please add documentation"
            exit 1
          fi

          if grep -Eq "^#+ .+\\n(?:\\n[#+|$]|[#+|$])" README.md; then
            echo "Empty section found in README.md ❌ Please add content"
            exit 1
          fi
      - name: Check for incomplete sections
        run: |
          if [ ! -f README.md ]; then
            echo "README.md file is missing ❌ Please add documentation"
            exit 1
          fi

          if grep -Eq "TODO" README.md; then
            echo "Found 'TODO' in one or more paragraphs in README.md ❌ Please add proper content"
            exit 1
          fi
