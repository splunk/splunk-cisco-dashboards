[dc_networking_system_threshold_tenant_threshold_gauge]
search_name = DC Networking - System Threshold - Tenant Threshold Gauge
search_author = akhamis
updated_author = akhamis
version = 1.0.0
date_created = 2026-07-30 00:00:00
date_updated = 2026-08-07
category = Data Center Networking
sub_category = ACI Tenant & Policy
tags = Cisco ACI,Cisco DC Networking,Tenants,Capacity Planning,KPI
default_viz = splunk.markergauge
description = <p>Returns a <b>single number</b>, the count of distinct ACI tenants currently observed across all APIC clusters, and renders it on a marker gauge whose warning, critical, and maximum bands are read from a threshold lookup rather than hard-coded in the search.</p>
explanation = <p>Scopes with the <code>index="<<index>>"</code> macro, <code>sourcetype=&quot;cisco:dc:aci:health&quot;</code>, and <code>component=fvTenant</code>, the APIC managed-object class for a tenant. The <code>NOT &quot;code&quot;</code> clause excludes events carrying a fault code so that only the tenant health and inventory records are counted, not fault records about tenants. The aggregation, <code>stats dc(eval(coalesce(name,&quot;&quot;).&quot;|&quot;.coalesce(apic_host,&quot;&quot;))) AS TCOUNT</code>, counts distinct tenant-name and APIC-host pairs rather than distinct names, so a tenant of the same name defined on two clusters counts as two objects &mdash; the intent is a fabric-wide object population, not a unique-name list. The <code>coalesce</code> guards stop a null on either side from voiding the composite key, which would otherwise silently undercount. With no <code>BY</code> clause the result is exactly one row and one value. The <code>gauge</code> command then takes its band boundaries from a subsearch that reads <code>cisco_dc_tenantThreshold.csv</code>, folds <code>warningThreshold</code>, <code>criticalThreshold</code>, and <code>maxThreshold</code> into a single space-separated string beginning at 0, and hands it back through <code>return $range</code>. That subsearch assumes the lookup contains exactly one row: with more than one, <code>values()</code> would return multivalues and the assembled range string would be malformed.</p>
solution = <p>Produces a single value, <code>TCOUNT</code>, drawn on a marker gauge divided by four boundaries taken from the lookup &mdash; 0, the warning threshold, the critical threshold, and the maximum. This is a <b>capacity</b> measure rather than a health measure: it answers how close the fabric is to its supported tenant count, not whether those tenants are healthy. A needle in the warning band means tenant growth should be planned for; the critical band means new tenant onboarding should stop until the limit is raised or unused tenants are retired, because exceeding a verified scalability limit affects the whole fabric rather than just the newest tenant. Since the count keys on tenant name plus APIC host, the reading in a multi-cluster deployment is the sum across clusters, which is the figure the threshold is meant to be compared against. Changing the bands means editing the CSV lookup, not the search, so the same panel can carry different limits in different environments.</p>
related_info = <ul><li><b><a href="https://www.cisco.com/c/en/us/support/cloud-systems-management/application-policy-infrastructure-controller-apic/series.html">Cisco APIC support documentation</a></b><br>Publishes the verified scalability guides that give the supported tenant counts per APIC release and cluster size, which are the numbers the threshold CSV should be populated from.</li><li><b>Thresholds live in a lookup</b><br>The warning, critical, and maximum values come from <code>cisco_dc_tenantThreshold.csv</code>. The search assumes a single row in that file; adding a second row breaks the range string that the gauge depends on.</li><li><b><a href="https://help.splunk.com/en/splunk-enterprise/search/spl-search-reference/10.4/search-commands/inputlookup">Splunk inputlookup command reference</a></b><br>Covers the subsearch mechanics used to read the threshold file and return the band boundaries into the outer search.</li><li><b>Sibling object gauges</b><br>The same construction is used for bridge domains, contracts, EPGs, filters, and L3Out networks by swapping the <code>component</code> value and the matching threshold CSV, so each object class is gauged against its own documented limit.</li></ul>
search = index="<<index>>" sourcetype="cisco:dc:aci:health" (component=fvTenant) NOT "code"\
| stats dc(eval(coalesce(name,"")."|".coalesce(apic_host,""))) AS TCOUNT\
| gauge TCOUNT [inputlookup cisco_dc_tenantThreshold.csv | stats values(warningThreshold) AS TWarning, values(criticalThreshold) AS TCritical, values(maxThreshold) AS TMax | eval first=0 | eval warning=TWarning | eval critical=TCritical | eval max=TMax | eval range=first+" "+warning+" "+critical+" "+max | return $range]

