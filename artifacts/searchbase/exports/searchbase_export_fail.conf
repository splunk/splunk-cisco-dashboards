description = <p>Charts the <b>latest ACI site health score</b> over time with one column per site, taken from Nexus Dashboard Orchestrator's <code>siteHealth</code> collection.</p>
explanation = <p>Scopes with the <code>index="<<index>>"</code> macro, <code>sourcetype=&quot;cisco:dc:nd:mso&quot;</code>, and <code>mso_api_endpoint=siteHealth</code>. A <code>rex</code> against the multivalue <code>urls</code> field strips the scheme from each controller URL into a new <code>url</code> field, and <code>mvexpand url</code> fans the event out to one row per controller. Neither <code>url</code> nor <code>platform</code> is referenced after the <code>fields</code> clause, so both the extraction and the expansion are dead work whose only effect is to multiply the event count before aggregation. The transform is <code>chart latest(health_score) AS Health by _time,name</code>, which uses the two-field <code>by</code> form: the first field becomes the rows and the second becomes the columns, so the result is a matrix of timestamps against site names. Because <code>_time</code> is never bucketed with <code>bin</code> or <code>span</code>, rows land on raw sample timestamps rather than on regular intervals, and sites polled a few seconds apart produce separate rows with gaps in every other column. The column split also inherits the default limit on distinct split-by values, so a deployment with many sites will not chart all of them individually.</p>
solution = <p>Returns a matrix with <code>_time</code> as the row key and one column per site name, holding health scores on the ACI scale of 0&ndash;100 where higher is better. Because ACI computes health bottom-up, a site sitting below 100 has a concrete fault on some object underneath it rather than a vague degradation, so the score is a pointer into the fault tables rather than an answer in itself. Watch for two things: a step down that persists, which is a fault that was raised and has not cleared, and a column that goes blank, which means the site stopped reporting and is a collection problem distinct from a low score. The sparse, irregular rows are an artefact of the unbucketed time axis &mdash; inserting <code>bin _time span=5m</code> before the <code>chart</code> produces an evenly spaced series that is far easier to read as a trend.</p>
related_info = <ul><li><b><a href="https://www.cisco.com/c/en/us/support/cloud-systems-management/multi-site-orchestrator/series.html">Cisco Multi-Site Orchestrator support documentation</a></b><br>Describes how the Orchestrator aggregates per-site health from the fabrics it manages, which is what the <code>siteHealth</code> collection exposes.</li><li><b>ACI health is bottom-up</b><br>A score of 0&ndash;100 for a site is derived from faults on the objects beneath it, so every point below 100 traces to a specific fault. Treat a dip here as a prompt to open the fault view for that site, not as a metric to trend in isolation.</li><li><b><a href="https://help.splunk.com/en/splunk-enterprise/search/spl-search-reference/10.4/search-commands/chart">Splunk chart command reference</a></b><br>Explains the two-field <code>by</code> syntax that turns site names into columns, and the limit that governs how many columns are produced.</li><li><b>Dead extraction path</b><br>The <code>rex</code> on <code>urls</code> and the <code>mvexpand</code> that follows it produce a field the aggregation never uses, while multiplying the row count by the number of controller URLs per site. Removing both leaves the charted values unchanged.</li></ul>
search = index="<<index>>" sourcetype="cisco:dc:nd:mso" mso_api_endpoint=siteHealth\
| rex field=urls "https://(?<url>.*)$"\
| mvexpand url\
| fields name, platform, url, _time, health_score\
| chart latest(health_score) AS Health by _time,name

