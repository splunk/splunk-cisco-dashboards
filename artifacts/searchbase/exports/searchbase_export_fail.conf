explanation = <p>The base reads <code>index="<<index>>"</code> with <code>sourcetype=&quot;cisco:dc:nd:mso&quot;</code> and <code>mso_api_endpoint=tenantDetails</code>. Unlike the sibling site panel there is no initial aggregation, so every raw tenant snapshot in the window flows forward: <code>coalesce</code> substitutes <code>None</code> where a tenant has no user association, <code>rename</code> maps the field to <code>user_id</code>, and <code>mvexpand</code> fans multivalued user lists out to one row per tenant-user pair. An outer <code>join</code> on <code>user_id</code> against the <code>userDetails</code> endpoint resolves each identifier to a username, and a field-scoped <code>fillnull</code> labels unresolved identifiers <code>None</code>. The closing <code>stats dc(name) as Count by username</code> counts distinct tenant names per user, and it is that distinct count which keeps the result correct despite the duplicated snapshots feeding it.</p>
solution = <p>Returns one row per user account with columns <code>User Name</code> and <code>Count</code>, the number of distinct tenants that account is associated with. Despite the panel title, nothing in the SPL trims or ranks the set &mdash; every account is returned and the pie visualization surfaces the largest slices. This is an access-review artifact as much as an inventory one: an account associated with a large share of the tenant estate holds broad change authority over the Orchestrator and deserves scrutiny against the access policy, while a <code>None</code> row means tenants exist with no responsible account recorded. Re-check the counts after any staff change, since a departed administrator&rsquo;s account keeps its tenant associations until it is explicitly removed.</p>
related_info = <ul><li><b><a href="https://www.cisco.com/c/en/us/support/cloud-systems-management/multi-site-orchestrator/products-installation-and-configuration-guides-list.html">Nexus Dashboard Orchestrator configuration guides</a></b><br>Covers the user, role, and tenant association model that determines what an account is allowed to change.</li><li><b><a href="https://help.splunk.com/en/splunk-enterprise/search/spl-search-reference/10.4/search-commands/stats">stats command reference</a></b><br>Documents <code>dc()</code>, which is what keeps repeated tenant snapshots from inflating the per-user totals.</li><li><b>No pre-aggregation</b><br>Every raw tenant event is expanded and joined rather than being collapsed to current state first, so this panel does noticeably more work than the equivalent site panel on a busy index.</li><li><b>Association is not authentication</b><br>These are configured tenant ownerships, not login events. Pair them with Orchestrator audit records to see what an account actually did.</li></ul>
search = index="<<index>>" sourcetype="cisco:dc:nd:mso" mso_api_endpoint=tenantDetails\
| eval userAssociations_userId=coalesce(userAssociations_userId, "None")\
| rename userAssociations_userId as "user_id"\
| mvexpand user_id\
| join type=outer user_id [search index="<<index>>" sourcetype="cisco:dc:nd:mso" mso_api_endpoint=userDetails | stats latest(username) AS username by id | rename id as user_id]\
| fillnull value="None" username\
| stats dc(name) as Count by username\
| rename username as "User Name"

