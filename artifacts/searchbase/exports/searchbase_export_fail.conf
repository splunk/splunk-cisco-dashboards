[building_resilience_fit_occupancy_calendar_profile]
search_name = Building Resilience - Expected Occupancy by Time-of-Day and Day-of-Week (fit)
search_author = akhamis
updated_author = akhamis
version = 1.1.0
date_created = 2026-06-10
date_updated = 2026-08-07
category = Building
sub_category = Occupancy
tags = Cisco Spaces,Building Intelligence,Occupancy,Machine Learning,Forecast,Drilldown
default_viz = splunk.table
viz_options = {"seriesColors":["#16A34A","#0EA5E9","#F59E0B","#DC2626"],"legendDisplay":"off"}
description = <p>Trains a <b>RandomForest regression</b> with the Splunk Machine Learning Toolkit / AI Toolkit command to learn <b>expected room-occupancy %</b> from calendar features &mdash; <b>hour of day, day of week, week of month, and month of year</b> &mdash; then reports the learned occupancy profile per weekday and hour.</p>
explanation = <p>The base search reduces Cisco Spaces SPACE_OCCUPANCY ROOM events to one hourly occupancy_pct series (per-room snapshot &rarr; rooms_occupied / total_rooms * 100), exactly like the snapshot KPI. Two calendar features are derived from _time with strftime: day_of_week (%A) and hour (%H).</p>
solution = <p>Returns a <code>Day of Week</code> &times; <code>Hour</code> table of <code>Expected Occupancy %</code> &mdash; the model's answer to &ldquo;what occupancy do we normally expect at this time?&rdquo;. Render as a table or heat-map.</p>
related_info = <ul><li><b>Requires the Machine Learning Toolkit</b><br><code>fit</code>/<code>apply</code> ship with the Splunk AI/Machine Learning Toolkit, not core Splunk.</li><li><b>Categorical features</b><br>String calendar fields are one-hot encoded by the MLTK; keep them as strings, not numbers.</li><li><b>Persisted model</b><br><code>into spaces_occupancy_calendar_model</code> lets a later search <code>apply</code> the model to live data without re-fitting.</li><li><b><a href="https://www.cisco.com/c/en/us/td/docs/wireless/spaces/config-guide/ciscospaces-configuration-guide.html">Cisco Spaces Configuration Guide</a></b><br>Covers the location hierarchy and firehose event types behind Cisco Spaces telemetry.</li></ul>
search = index="<<index>>" sourcetype="cisco:spaces:firehose" eventType="SPACE_OCCUPANCY" "spaceOccupancy.space.type"=ROOM\
| bin _time span=1h\
| stats max(spaceOccupancy.peakPeopleCount) as peak, latest(spaceOccupancy.peoplePresence) as present by _time, spaceOccupancy.space.floorId, spaceOccupancy.space.name\
| eval occupied=if(present=="true" OR peak>0, 1, 0)\
| stats count as total_rooms, sum(occupied) as rooms_occupied by _time\
| eval occupancy_pct=if(total_rooms>0, round(rooms_occupied/total_rooms*100, 2), 0)\
| eval day_of_week=strftime(_time,"%A"), hour=strftime(_time,"%H")\
| fit RandomForestRegressor occupancy_pct from day_of_week hour into user:spaces_occupancy_calendar_model\
| eval expected_occupancy=round('predicted(occupancy_pct)', 1)\
| stats avg(expected_occupancy) as expected_occupancy by day_of_week, hour\
| eval day_order=case(day_of_week=="Sunday",0, day_of_week=="Monday",1, day_of_week=="Tuesday",2, day_of_week=="Wednesday",3, day_of_week=="Thursday",4, day_of_week=="Friday",5, day_of_week=="Saturday",6)\
| eval expected_occupancy=round(expected_occupancy, 1)\
| fields day_of_week hour expected_occupancy\
| rename day_of_week as "Day of Week", hour as "Hour", expected_occupancy as "Expected Occupancy %"

# EXPORT VALIDATION FAILED: [executive_dashboard_ds_security_trend_compare]
# 1. [spl_syntax] Unrecognized or misspelled SPL command: 'addinfo'.
#    Suggestion: Verify command spelling and pipe placement.

[executive_dashboard_ds_security_trend_compare]
search_name = Executive - Security Trend Comparison
search_author = akhamis
updated_author = akhamis
version = 1.0.0
date_created = 2026-04-21 18:27:45
date_updated = 2026-08-07
category = Security
sub_category = Trend Analysis
tags = Security,Trend,ISE,Active Directory,Executive,KPI
default_viz = splunk.singlevalue
viz_options = {"majorColor":"#3B82F6"}
description = <p>Security posture trend - current vs previous period unique failed auth users with percentage change for the trend indicator.</p>
explanation = <p>A single <code>tstats</code> pass on the accelerated <code>Authentication</code> data model returns one row per <code>(Authentication.user, _time)</code> hourly bucket where <code>action="failure"</code>. <code>| addinfo</code> injects <code>info_min_time</code> and <code>info_max_time</code> (epoch seconds) from the dispatched time range. <code>eval period</code> splits the window exactly in half: buckets in the upper half are labelled <code>current</code>, the lower half <code>previous</code>. <code>stats dc(Authentication.user)</code> per period then counts truly distinct failing users in each half, and the final <code>stats</code> pivots the two-row result into <code>current</code> and <code>previous</code> scalars for <code>delta</code> and <code>direction</code>.</p>
solution = <p>Rising <code>delta</code> implies more unique accounts failing authentication relative to the baseline slice&mdash;engage identity operations. Sharp negative swings may be positive (remediated attack) or bad (logging gap); verify.</p>
related_info = <ul><li><b>Identity trend analytics</b><br>Why unique-user metrics beat raw failure counts for executive clarity.</li><li><b>Authentication DM</b><br>Requirements for reliable <code>tstats</code> on identity events.</li><li><b>Percent change pitfalls</b><br>Small baselines exaggerate percentages&mdash;always show absolutes.</li><li><b><a href="https://help.splunk.com/en/splunk-cloud-platform/common-information-model">Splunk Common Information Model</a></b><br>Field definitions and node names for the CIM data model this search accelerates.</li></ul>
search = | tstats summariesonly=false allow_old_summaries=false fillnull_value=null count FROM DATAMODEL=Authentication where Authentication.action="failure" by Authentication.user _time span=1h\
| addinfo\
| eval period=if(_time >= info_min_time + floor((info_max_time - info_min_time) / 2), "current", "previous")\
| stats dc(Authentication.user) as count by period\
| stats sum(eval(if(period=="current",count,0))) as current, sum(eval(if(period=="previous",count,0))) as previous\
| eval delta=if(previous>0, round((current-previous)/previous*100, 1), 0), direction=case(delta>0, "+", delta<0, "-", 1==1, "-")

