description = <p>Builds a <b>schema to template to tenant map</b> out of the Nexus Dashboard Orchestrator <code>schemaDetails</code> collection, one row per schema, listing every template the schema contains and the tenant each of those templates is bound to.</p>
explanation = <p>Scopes with the <code>index="<<index>>"</code> macro, <code>sourcetype=&quot;cisco:dc:nd:mso&quot;</code>, and <code>mso_api_endpoint=schemaDetails</code>. Each event carries two parallel multivalue fields, <code>templates_name</code> and <code>templates_tenantId</code>, holding the schema's templates and the tenant identifier each one targets. <code>mvzip</code> pairs them positionally into a single combined field, <code>mvexpand</code> turns each pair into its own row, and <code>split</code> with <code>mvindex</code> unpacks the pair back into <code>template_name</code> and <code>tenant_id</code>. That zip-expand-split idiom exists specifically to keep the two arrays aligned: expanding them independently would produce a cross product of every template against every tenant identifier. A <code>join</code> on <code>tenant_id</code> with <code>max=0</code> then resolves the identifier to a readable name through a <code>tenantDetails</code> subsearch that reduces to <code>latest(name) by id</code>. Finally <code>stats values(template_name), values(name) by displayName</code> re-collapses the exploded rows to one row per schema, with the template and tenant names as deduplicated multivalue cells. Two fragilities are worth knowing: <code>mvzip</code> joins with a comma by default, so a template name containing a comma would be split in the wrong place; and the <code>join</code> defaults to an inner join, so a template pointing at a tenant identifier the <code>tenantDetails</code> collection has not seen removes that pairing from the output without any warning. Row order is not defined by the search.</p>
solution = <p>Returns three columns: <code>Schema Name</code>, <code>Template Name</code>, and <code>Tenant Name</code>, with the latter two as multivalue cells and one row per schema. Read it as a binding audit. In Nexus Dashboard Orchestrator a schema is the container, a template inside it is the unit that gets deployed to sites, and each template is associated with exactly one tenant &mdash; so a schema showing more tenant names than you expect is carrying cross-tenant templates, which is legal but is often unintentional and complicates change control. A schema whose template list is shorter than the number of templates you know it holds indicates the inner join dropped a template whose tenant could not be resolved. Row order is not defined by the search and the table visualization controls presentation.</p>
related_info = <ul><li><b><a href="https://www.cisco.com/c/en/us/support/cloud-systems-management/multi-site-orchestrator/products-installation-and-configuration-guides-list.html">Cisco Multi-Site Orchestrator configuration guides</a></b><br>Define the schema, template, and tenant relationship this table reconstructs, including how templates are associated with sites at deploy time.</li><li><b>Subsearch limits</b><br>The tenant resolution runs as a subsearch, which is subject to the default row and runtime caps. On a deployment with a very large tenant count the lookup set can be truncated, and because the join is inner, truncation shows up as missing rows rather than as an error.</li><li><b><a href="https://help.splunk.com/en/splunk-enterprise/search/spl-search-reference/10.4/search-commands/mvexpand">Splunk mvexpand command reference</a></b><br>Covers the multivalue expansion behaviour that makes the zip-expand-split pairing necessary.</li><li><b>Safer pairing delimiter</b><br>Passing an explicit uncommon delimiter to <code>mvzip</code> and the matching <code>split</code> removes the risk that a template name containing a comma is unpacked incorrectly.</li></ul>
search = index="<<index>>" sourcetype="cisco:dc:nd:mso" mso_api_endpoint=schemaDetails\
| eval templates_tenants=mvzip(templates_name,templates_tenantId)\
| mvexpand templates_tenants\
| eval temp_split=split(templates_tenants,",")\
| eval template_name=mvindex(temp_split,0), tenant_id=mvindex(temp_split,1)\
| join max=0 tenant_id [search index="<<index>>" sourcetype="cisco:dc:nd:mso" mso_api_endpoint=tenantDetails | stats latest(name) AS name by id | rename id as tenant_id | fields tenant_id, name]\
| stats values(template_name) as template_name, values(name) as name by displayName\
| rename displayName as "Schema Name", template_name as "Template Name", name as "Tenant Name"

