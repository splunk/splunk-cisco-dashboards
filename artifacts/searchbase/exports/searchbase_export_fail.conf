| eval event_type="Identity decision", reason=coalesce(reason,result,"Unknown"), identity=coalesce('user.name',username,user,email,"Unknown"), endpoint=coalesce('access_device.hostname',device,host,"Unknown"), application=coalesce('application.name',application,integration,"Unknown"), location=coalesce('access_device.location.city','access_device.location.country',location,"Unknown")\
