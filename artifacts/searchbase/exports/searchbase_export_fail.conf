solution = <p>When predicted latency trends upward before business hours, proactively engage ISPs or shift workload routing. Combine with the BGP anomaly search to distinguish routing-level causes from endpoint degradation. The training window is whatever the time-range picker supplies; two populated hourly buckets are the minimum viable window, and below that an <code>appendpipe</code> guard returns one explanatory row asking for a wider range.</p>
