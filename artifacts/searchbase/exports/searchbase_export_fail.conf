description = <p>Counts fabric interfaces by their <b>most recent operational status</b>, returning one row per distinct status value such as up or down.</p>
explanation = <p>The <code>tstats</code> command reads the <code>Cisco_DCN_nexus_dashboard.protocols</code> data model under the <code>scd_summariesonly</code> macro, taking <code>latest(protocols.operStatus)</code> per <code>protocols.interfaceUniqueId</code> so that each interface contributes only its current state rather than every historical sample &mdash; without that reduction an interface that flapped would be counted in both buckets. <code>latest(_time) as lastSeen</code> is collected but never referenced downstream. The subsequent <code>stats values(operStatus) by protocols.interfaceUniqueId</code> is redundant, because the <code>latest()</code> reduction already guarantees at most one value per interface, and the <code>mvexpand</code> that follows therefore flattens single-element multivalue fields. The final <code>stats count by</code> tallies interfaces per status. Note that the field name is written inside double quotes at both the <code>mvexpand</code> and the final <code>stats by</code>; <code>mvexpand</code> expects a bare field name, so this depends on the parser tolerating the quoting.</p>
solution = <p>Returns two columns, the operational status and its <code>count</code>, one row per distinct status value, rendered as a bar chart. Row order is not defined by the search and the visualization controls presentation. Every interface is represented exactly once because the pipeline reduces to a single latest state per <code>interfaceUniqueId</code>, so the bars sum to the interface population. A large down bucket is normal rather than alarming on lightly populated leaf switches, where most access ports are cabled to nothing; the number that matters is how it moves. A jump in the down count between two windows, or the appearance of an intermediate state, means links changed state and should be traced to specific ports through the interface inventory table.</p>
related_info = <ul><li><b><a href="https://www.cisco.com/c/en/us/support/data-center-analytics/nexus-dashboard/series.html">Cisco Nexus Dashboard support documentation</a></b><br>Defines the interface operational and administrative status values collected for fabric interfaces.</li><li><b><a href="https://help.splunk.com/en/splunk-enterprise/search/spl-search-reference/10.4/search-commands/mvexpand">Splunk <code>mvexpand</code> command reference</a></b><br>Documents multivalue expansion and the field-naming rules that apply to its argument.</li><li><b>Admin down and oper down are different</b><br>An interface deliberately shut is expected to be down. Pair this distribution with the admin status column in the inventory table to separate intent from failure.</li><li><b>Latest state, not sample count</b><br>The <code>latest()</code> reduction is what makes the bars a count of interfaces rather than a count of telemetry samples, which would scale with the polling interval.</li></ul>
search = | tstats summariesonly=false allow_old_summaries=false fillnull_value=null latest(_time) as lastSeen latest(protocols.operStatus) as operStatus from datamodel=Cisco_DCN_nexus_dashboard.protocols by protocols.interfaceUniqueId\
| stats values(operStatus) as "Operational Status" by protocols.interfaceUniqueId\
| mvexpand "Operational Status"\
| stats count by "Operational Status"

