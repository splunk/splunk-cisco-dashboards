search = | mstats latest("Cisco-IOS-XR-clns-isis-oper:isis/instances/instance/levels/level/adjacencies/adjacency.adjacency_uptime") AS uptime WHERE index="<<index>>" span=5m BY source\
| eval stable = if(uptime > 86400, 1, 0)\
