[spaces_fit_camera_headcount_anomaly]
search_name = Spaces - Camera - Headcount Anomaly Detection (DensityFunction)
search_author = akhamis
updated_author = akhamis
version = 1.0.0
date_created = 2026-06-14
date_updated = 2026-08-07
category = Cisco Spaces
sub_category = Camera Intelligence
tags = Cisco Spaces,Sensors,Occupancy,Machine Learning,Anomaly,Table
default_viz = splunk.table
viz_options = {"seriesColors":["#16A34A","#0EA5E9","#F59E0B","#DC2626"],"legendDisplay":"off"}
description = <p>Detects statistically anomalous camera headcount readings per location and hour-of-week using Gaussian density modelling. Flags readings that fall outside the learned distribution for each location and time slot.</p>
explanation = <p>Bins hourly peak headcounts from <code>CAMERA_COUNT</code> events, builds a <code>Weekday/Weekend x Hour</code> slot key per location, guards against sparse slots (>=3 samples required), and applies MLTK <code>DensityFunction</code>. Rows where <code>IsOutlier(camera_headcount)=1</code> are returned.</p>
solution = <p>Anomalous headcounts often indicate tailgating, after-hours intrusion, equipment misfire, or unusual events. Pipe results into a Notable Event or trigger a Cisco Spaces workflow.</p>
related_info = <ul><li><b>Event type</b>: CAMERA_COUNT</li><li><b>Algorithm</b>: DensityFunction (MLTK)</li><li><b>Model name</b>: spaces_camera_density_model</li><li><b>Min samples</b>: 3 per slot</li><li><b><a href="https://www.cisco.com/c/en/us/td/docs/wireless/spaces/config-guide/ciscospaces-configuration-guide.html">Cisco Spaces Configuration Guide</a></b><br>Covers the location hierarchy and firehose event types behind Cisco Spaces telemetry.</li></ul>
search = index="<<index>>" sourcetype="cisco:spaces:firehose" eventType="CAMERA_COUNT"\
| rename "cameraCounts.count" as camera_headcount "cameraCounts.location.name" as location\
| bin _time span=1h\
| stats max(camera_headcount) as camera_headcount by _time, location\
| eval day_type=if(tonumber(strftime(_time,"%u"))>=6,"Weekend","Weekday"), slot=location." ".day_type." ".strftime(_time,"%H").":00"\
| eventstats count as n_samples by slot\
| where n_samples >= 3\
| fit DensityFunction camera_headcount by slot into user:spaces_camera_density_model\
| eval is_anomaly='IsOutlier(camera_headcount)'\
| where is_anomaly=1\
| fields _time location slot camera_headcount is_anomaly\
| appendpipe [ stats count as _empty | where _empty=0 | eval _time=now(), data_status="No matching telemetry was found. The condition may not have occurred; confirm the data source is onboarded or widen the time range." | fields _time data_status ]

