[spaces_space_idle_cost_ranking]
search_name = Spaces - All Spaces - Idle Seat-Hour Waste Ranking (Lease ROI)
search_author = akhamis
updated_author = akhamis
version = 1.0.0
date_created = 2026-06-14
date_updated = 2026-08-07
category = Cisco Spaces
sub_category = Space Optimization
tags = Cisco Spaces,Capacity Planning,Occupancy,Table,Severity,Rooms
default_viz = splunk.table
viz_options = {"seriesColors":["#16A34A","#0EA5E9","#F59E0B","#DC2626"],"legendDisplay":"off"}
description = <p>Idle seat-hours for every space with a configured capacity &mdash; the hours of the <b>full dispatched search window</b> in which the space was not occupied, multiplied by its seat count &mdash; together with a window-normalised per-day figure, the occupancy rate, reporting coverage, and a three-tier waste classification.</p>
explanation = <p>Reads <code>index="<<index>>" sourcetype="cisco:spaces:firehose" eventType="SPACE_OCCUPANCY"</code>. As with the companion utilisation table, <code>bin _time span=1h</code> plus a first <code>stats by _time, space_name, space_type</code> reduces the event stream to one hourly snapshot per space, so the result reflects hours rather than sensor chattiness. An hour counts as occupied when <code>peoplePresence</code> is true or <code>peakPeopleCount</code> is above zero. The second <code>stats</code> produces <code>hours_reported</code>, <code>hours_occupied</code>, and the space&rsquo;s seat <code>capacity</code>, and <code>where capacity &gt; 0</code> immediately drops spaces with no configured seat count because the metric is meaningless without one.</p><p><b>Empty hours are measured against the dispatched search window, not against the hours in which the space reported.</b> <code>addinfo</code> exposes <code>info_min_time</code> and <code>info_max_time</code>; <code>window_span_hours</code> is their difference in hours and <code>empty_hours = window_span_hours - hours_occupied</code>, floored at zero. Nothing about the window length is hardcoded, so the metric follows the Searchbase time picker. Two boundary cases are guarded. An open-ended or real-time range makes Splunk set <code>info_max_time</code> to the string <code>+Infinity</code>, where <code>isnum(info_max_time)</code> is false and the window end falls back to <code>now()</code>. An All-time range sets <code>info_min_time</code> to <code>0</code>, so <code>eventstats min(_time) as data_start</code> captures the first hourly bucket carrying data and the window start falls back to it. Hours Reported is retained as a data-quality signal only.</p><p><code>idle_seat_hours = empty_hours &times; capacity</code> is the headline figure, and weighting by capacity is the point of the metric: a 20-seat boardroom empty for 200 hours wastes 4,000 seat-hours while a 4-seat phone booth empty for the same 200 hours wastes only 800, so a plain occupancy percentage would rank them identically while their cost impact differs fivefold. The tier, however, is assigned from <code>idle_seat_hours_per_day</code>, which divides that figure by the window length in days. This matters because idle hours now scale with the window: applying the previous absolute 5,000 and 1,000 thresholds to the corrected figure reclassifies the same 57 space rows as 0 High / 4 Medium / 43 Low at 24 hours, 7 / 30 / 20 at seven days, and 33 / 24 / 0 at thirty days &mdash; the same portfolio, relabelled purely by time range. The per-day figure removes that: High above 480 idle seat-hours per day (twenty seats idle around the clock, 20 &times; 24) and Medium above 120 (five seats, 5 &times; 24) yield an identical 10 High / 32 Medium / 15 Low split at seven days, thirty days, and all time, and those cuts sit near the 82nd and 27th percentiles of the measured distribution. One honest caveat: because a window-based denominator leaves almost every space empty for most of the window, idle seat-hours correlates with seat count at Spearman 0.99 in this deployment, so the tier is close to a ranking of room size and must be read together with Occupancy Rate %.</p>
solution = <p>Returns eleven columns: Space, Type, Seats, Hours Reported, Hours Active, Empty Hours, Window Hours, Occupancy Rate %, Idle Seat-Hours, Idle Seat-Hours per Day, and Waste Tier. The pipeline has no ordering stage, so the output is unordered and the table visualization controls presentation; reorder on Idle Seat-Hours per Day in the table to reach the most wasteful spaces.</p><p>Idle seat-hours is a relative measure, not a currency figure; multiply Idle Seat-Hours by your own cost per seat per hour &mdash; annual lease cost divided by seats divided by annual business hours &mdash; to convert a row into a dollar estimate. Read it with Occupancy Rate %, never alone: because the corrected denominator leaves nearly every space empty for most of the window, Idle Seat-Hours tracks seat count closely and on its own approximates a ranking of room size. The actionable combination is a High waste tier <i>and</i> a low Occupancy Rate %: that space is both big and genuinely unused. A large space with a high tier but an Occupancy Rate % in the upper bands is booked often and sits mostly empty between bookings, and the answer there is scheduling policy rather than lease reduction. Use Idle Seat-Hours per Day when comparing runs over different time ranges; Idle Seat-Hours itself grows with window length and is comparable only across equal windows. Check Hours Reported against Window Hours before acting: a space that reported in only a few of the window&rsquo;s hours may be idle or may have an offline sensor, and the two look identical in this table.</p>
related_info = <ul><li><b><a href="https://www.cisco.com/c/en/us/td/docs/wireless/spaces/config-guide/ciscospaces-configuration-guide.html">Cisco Spaces Configuration Guide</a></b><br>The <code>SPACE_OCCUPANCY</code> event and the space capacity attribute that makes the seat-hour weighting possible.</li><li><b><a href="https://help.splunk.com/en/splunk-enterprise/search/spl-search-reference/10.0/search-commands/addinfo">Splunk addinfo command reference</a></b><br>Defines <code>info_min_time</code> and <code>info_max_time</code> and documents that <code>info_max_time</code> becomes <code>+Infinity</code> for an all-time or open-ended range, which is the case this search guards with <code>isnum()</code>.</li><li><b>Converting to currency</b><br>Multiply Idle Seat-Hours by annual lease cost divided by seats divided by annual business hours to estimate wasted spend per space.</li><li><b>Why the tier uses a per-day figure</b><br>Idle Seat-Hours grows with the search window, so an absolute threshold relabels the same portfolio whenever the time range changes. Idle Seat-Hours per Day is window-invariant and is what the High (&gt;480) and Medium (&gt;120) tiers are measured against.</li><li><b>Companion view</b><br><code>spaces_room_utilization_league_table</code> expresses the same window-based occupancy as a percentage with five utilisation bands.</li></ul>
search = index="<<index>>" sourcetype="cisco:spaces:firehose" eventType="SPACE_OCCUPANCY"\
| rename "spaceOccupancy.space.name" as space_name "spaceOccupancy.space.type" as space_type "spaceOccupancy.space.capacity" as capacity "spaceOccupancy.peakPeopleCount" as peak_count "spaceOccupancy.peoplePresence" as people_present\
| bin _time span=1h\
| stats max(capacity) as capacity max(peak_count) as peak_count latest(people_present) as people_present by _time, space_name, space_type\
| eventstats min(_time) as data_start\
| eval occupied=if(people_present=="true" OR peak_count>0, 1, 0)\
| stats count as hours_reported sum(occupied) as hours_occupied max(capacity) as capacity min(data_start) as data_start by space_name, space_type\
| where capacity > 0\
| addinfo\
| eval window_start=if(isnum(info_min_time) AND info_min_time>0, info_min_time, data_start), window_span_hours=(if(isnum(info_max_time), info_max_time, now())-window_start)/3600\
| eval empty_hours=round(max(window_span_hours-hours_occupied, 0), 1), occupancy_rate=if(window_span_hours>0, round(min(hours_occupied/window_span_hours*100, 100), 1), null()), window_hours=round(window_span_hours, 1)\
| eval idle_seat_hours=round(empty_hours*capacity, 0), idle_seat_hours_per_day=if(window_span_hours>0, round(empty_hours*capacity/(window_span_hours/24), 0), null())\
| eval waste_tier=case(isnull(idle_seat_hours_per_day),"Unrated - Zero-Length Window", idle_seat_hours_per_day>480,"High - Priority Review", idle_seat_hours_per_day>120,"Medium - Monitor", 1==1,"Low")\
| fields - info_* data_start window_start window_span_hours\
| rename space_name as "Space" space_type as "Type" capacity as "Seats" hours_reported as "Hours Reported" hours_occupied as "Hours Active" empty_hours as "Empty Hours" window_hours as "Window Hours" occupancy_rate as "Occupancy Rate %" idle_seat_hours as "Idle Seat-Hours" idle_seat_hours_per_day as "Idle Seat-Hours per Day" waste_tier as "Waste Tier"

