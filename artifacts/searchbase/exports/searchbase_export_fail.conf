description = <p>Counts how many <b>distinct tenants</b> each Nexus Dashboard Orchestrator schema carries, resolving schema identifiers to schema names and returning a two-column schema-and-count set for the pie tile.</p>
explanation = <p>The base reads <code>index="<<index>>"</code> with <code>sourcetype=&quot;cisco:dc:nd:mso&quot;</code> and <code>mso_api_endpoint=schemaTenants</code>. <code>coalesce</code> replaces a missing <code>mso_schema_id</code> with the literal <code>None</code> and <code>mvexpand</code> fans multivalued schema identifiers out to one row each, so a tenant referenced by several schemas contributes to each of them. An outer <code>join</code> on <code>mso_schema_id</code> against the <code>schemaDetails</code> endpoint resolves each identifier to a schema <code>displayName</code>, and a field-scoped <code>fillnull</code> labels anything still unresolved <code>None</code>. The closing <code>stats dc(name) as Count by displayName</code> counts distinct tenant names per schema; the distinct count is what stops repeated API polls from inflating the figure.</p>
solution = <p>Returns one row per schema with columns <code>Schema Name</code> and <code>Count</code>, the number of distinct tenants that schema references. Despite the panel title, no trimming or ranking happens in the SPL &mdash; every schema in the window is returned and the pie visualization surfaces the largest slices. A schema spanning many tenants concentrates blast radius: a bad template push against it affects every tenant in the count, and change windows have to be negotiated with every owner. Be aware that the joined schema name lands in a field the outer search already populates, so a schema identifier that fails to resolve can carry a tenant display name instead of <code>None</code>; treat any unfamiliar value in <code>Schema Name</code> as an unresolved identifier rather than a real schema.</p>
related_info = <ul><li><b><a href="https://www.cisco.com/c/en/us/support/cloud-systems-management/multi-site-orchestrator/products-installation-and-configuration-guides-list.html">Nexus Dashboard Orchestrator configuration guides</a></b><br>Covers schema creation, template association, and how one schema can span multiple tenants and sites.</li><li><b><a href="https://help.splunk.com/en/splunk-enterprise/search/spl-search-reference/10.4/search-commands/mvexpand">mvexpand command reference</a></b><br>Explains the row expansion applied to the schema identifier list before the join.</li><li><b>Field name collision</b><br>The outer search and the joined subsearch both produce a field called <code>displayName</code>. On matched rows the schema name wins; on unmatched rows the tenant name survives and the <code>fillnull</code> never fires.</li><li><b>Blast radius, not health</b><br>The count says nothing about whether the schema deployed successfully. Pair it with template deployment status before treating a large schema as a live risk.</li></ul>
search = index="<<index>>" sourcetype="cisco:dc:nd:mso" mso_api_endpoint=schemaTenants\
| eval mso_schema_id=coalesce(mso_schema_id, "None")\
| mvexpand mso_schema_id\
| join type=outer mso_schema_id [search index="<<index>>" sourcetype="cisco:dc:nd:mso" mso_api_endpoint=schemaDetails | stats latest(displayName) AS displayName by id | rename id as mso_schema_id]\
| fillnull value="None" displayName\
| stats dc(name) as Count by displayName\
| rename displayName as "Schema Name"

