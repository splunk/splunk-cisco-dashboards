default_viz = splunk.singlevalue
viz_options = {"overview":[{"workspace":"secure_networking","tileId":"hmf_ftd_feed_health","section":"hybrid_mesh_firewalling","label":"FTD feed health","subLabel":"Minutes since last FTD firewall event","valueField":"age_minutes","unit":"min","color":"#0ea5e9","thresholds":{"warning":30,"critical":90,"direction":"lower_is_better","enabled":true},"thresholdNote":"Matches this search's own readiness logic exactly. Any production firewall sees continuous traffic \u2014 silence beyond 30 minutes means the feed is broken, not that the network is quiet."}]}
description = <p>Staleness monitor for Cisco FTD firewall feeds covering syslog, advanced JSON connection events, and DNS logs. Any production firewall sees continuous traffic - silence beyond 30 minutes means the feed is broken, not the network is quiet.</p>
explanation = <p>Checks legacy <code>cisco:ftd</code> data and all routed <code>cisco:ftd:*</code> sourcetypes in aggregate. WARNING at &gt;30 min; CRITICAL at &gt;90 min stale.</p>
solution = <p><b>CRITICAL / WARNING:</b> Most likely causes in order - (1) HEC token rotated on Splunk side but not updated in FMC eStreamer client or syslog forwarder config; (2) Syslog server IP changed after a Splunk HF migration; (3) FMC underwent upgrade and eStreamer client needs restart; (4) TCP syslog session dropped and not re-established - check <code>netstat</code> on the UF/HF. For HEC: verify token in FMC Administration --> Logging --> Security Analytics and Logging.<br><b>NOT ONBOARDED:</b> Configure FMC eStreamer or syslog forwarding to Splunk.</p>
related_info = <ul><li><b>Sourcetypes</b>: legacy cisco:ftd plus all routed cisco:ftd:* event families</li><li><b>Stale threshold</b>: 30 min WARNING / 90 min CRITICAL</li><li><b>Common failure</b>: HEC token rotation - update in FMC SAL configuration</li><li><b><a href="https://www.cisco.com/c/en/us/support/security/firepower-ngfw/series.html">Cisco Secure Firewall support documentation</a></b><br>Configuration guides for the firewall policy, connection, and intrusion events used here.</li></ul>
search = index="<<index>>" (sourcetype="cisco:ftd" OR sourcetype="cisco:ftd:*")\
| eval event_ts=_time\
| timechart latest(event_ts) as last_ts count as event_count\
| filldown last_ts\
| eval age_minutes=if(last_ts>0,round(((_time+_span)-last_ts)/60,0),9999)\
| eval readiness=case(isnull(last_ts),"NOT ONBOARDED - configure FTD syslog or HEC forwarding", age_minutes<=30,"Active - last event ".tostring(age_minutes)." min ago", age_minutes<=90,"WARNING - stale ".tostring(age_minutes)." min - check HEC token and syslog connectivity", 1==1,"CRITICAL - STALE ".tostring(age_minutes)." min - verify HEC token and FMC eStreamer client status")\
| eval last_seen=if(last_ts>0, strftime(last_ts,"%Y-%m-%d %H:%M:%S"), "Never")\
| fields _time age_minutes event_count readiness last_seen\
| appendpipe [ stats count as _empty | where _empty=0 | eval _time=now(), age_minutes=9999, event_count=0, readiness="NOT ONBOARDED - configure FTD syslog or HEC forwarding", last_seen="Never" | fields _time age_minutes event_count readiness last_seen ]

