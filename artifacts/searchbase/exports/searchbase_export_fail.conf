description = <p>Rogue BSSID threat-intelligence detail from <b>Cisco Meraki Air Marshal</b>: SSID, containment status, maximum observed RSSI, wired-MAC honeypot evidence, and last-seen time per rogue BSSID.</p>
explanation = <p>Reads <code>meraki:airmarshal</code>, expands each JSON <code>bssids</code> object with native JSON evaluation functions, and rolls up maximum detector RSSI plus top-level wired-MAC evidence per BSSID. Object-level extraction preserves the relationship between each BSSID and its detector readings.</p>
solution = <p>Treat any rogue with non-empty <code>wired_evidence</code> as high priority regardless of RSSI &mdash; it indicates the rogue device has a physical bridge onto your wired LAN. Among purely wireless rogues, prioritize by <code>max_rssi</code> (closer/stronger signal) and whether <code>contained</code> is still <code>false</code>.</p>
related_info = <ul><li><b>Containment summary</b><br><code>secure_networking_meraki_rogue_ap_containment</code> provides the SSID-level containment rollup that this detail table supports.</li><li><b>Rule 3c note</b><br>The source panel's <code>result ranking</code> preceding <code>head 50</code> was removed because this pipeline contains <code>stats</code>, per house style rule 3c. The resulting 50 rows are no longer guaranteed to be the most recently seen; ranking the table by "Last Seen" in the viewer if recency ordering is required.</li><li><b><a href="https://documentation.meraki.com/">Cisco Meraki documentation</a></b><br>Reference for the Meraki dashboard, API, and device telemetry consumed here.</li></ul>
search = index="<<index>>" sourcetype="meraki:airmarshal"\
| eval bssids_array=json_array_to_mv(json_extract(_raw, "bssids"), true()), wired_evidence=mvjoin(json_array_to_mv(json_extract(_raw, "wiredMacs"), false()), ", ")\
| mvexpand bssids_array\
| eval bssid=json_extract_exact(bssids_array, "bssid"), contained=lower(tostring(json_extract_exact(bssids_array, "contained"))), detectors=json_array_to_mv(json_extract(bssids_array, "detectedBy"), true()), ssid=if(ssid=="" OR isnull(ssid), "Hidden/No SSID", ssid)\
| mvexpand detectors\
| eval rssi=tonumber(json_extract_exact(detectors, "rssi"))\
| stats latest(ssid) as ssid, latest(contained) as contained, max(rssi) as max_rssi, values(wired_evidence) as wired_evidence, latest(lastSeen) as lastSeen_unix by bssid\
| head 50\
| eval "Last Seen" = strftime(tonumber(lastSeen_unix), "%Y-%m-%d %H:%M:%S")\
| table bssid, ssid, contained, max_rssi, wired_evidence, "Last Seen"

