search_name = Network - Endpoint Telemetry - Cisco NVM Top Users by Egress Volume
search_author = akhamis
updated_author = akhamis
version = 1.0.0
date_created = 2026-05-29
date_updated = 2026-08-07
category = Network
sub_category = Endpoint Telemetry
tags = Secure Client,Endpoints,Users,Leaderboard,Table,Traffic
default_viz = splunk.table
viz_options = {"seriesColors":["#38BDF8","#2DD4BF","#FBBF24","#FB7185"],"legendDisplay":"off","overview":[{"workspace":"secure_networking","tileId":"network_nvm_top_users_by_egress","section":"secure_infrastructure","label":"NVM user egress volume","subLabel":"Endpoint Telemetry · bytes out","color":"#38BDF8","valueField":"WindowBytesOut","thresholdNote":"A user with unusually high egress across many destinations can indicate data movement or credential misuse."}]}
description = <p>Per-logged-in-user egress leaderboard from Cisco NVM flowdata - bytes out, bytes in, flow count, distinct destination hosts, distinct processes. Identifies users with abnormally high data movement for IR triage.</p>
explanation = <p>Reads <code>cisco:nvm:flowdata:v2</code> with the logged-in-user identifier (<code>liuid</code>) populated. Strips the synthetic <code>-LID</code> suffix Cisco appends to the demo data so the user shows cleanly. Then aggregates byte/flow/distinct-host/distinct-process counts per user.</p>
solution = <p><b>Suggested Actions</b><br><b>1.</b> A single user with materially higher egress to many distinct external hosts is the classic data exfiltration shape - investigate immediately.<br><b>2.</b> Out-of-office users with non-trivial egress over a window warrant credential-misuse follow-up.</p>
related_info = <ul><li><b>Identity source</b><br><code>liuid</code> is the OS-level logged-in user as reported by the NVM agent (Windows / macOS / Linux).</li><li><b><a href="https://www.cisco.com/c/en/us/support/security/anyconnect-secure-mobility-client/series.html">Cisco Secure Client support documentation</a></b><br>Deployment guides covering Network Visibility Module flow records and VPN session data.</li></ul>
search = index="<<index>>" sourcetype="cisco:nvm:flowdata:v2"\
| eval user=replace(liuid,"-LID$","")\
| stats sum(obc) as bytes_out sum(ibc) as bytes_in count as flows dc(dh) as distinct_hosts dc(pn) as distinct_processes by user\
| rename user as User, bytes_out as "Bytes Out", bytes_in as "Bytes In", flows as Flows, distinct_hosts as "Distinct Destinations", distinct_processes as "Distinct Processes"\
| eventstats sum('Bytes Out') as WindowBytesOut\
| table User "Bytes Out" "Bytes In" Flows "Distinct Destinations" "Distinct Processes" WindowBytesOut\
| appendpipe [ stats count as _empty | where _empty=0 | eval User="No data", "Bytes Out"=0, "Bytes In"=0, Flows=0, "Distinct Destinations"=0, "Distinct Processes"=0, WindowBytesOut=0 | fields User "Bytes Out" "Bytes In" Flows "Distinct Destinations" "Distinct Processes" WindowBytesOut ]

