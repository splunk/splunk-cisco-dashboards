[teuc_5_9_54_mttr_reduction_via_network_vs_application_isolation]
search_name = TEUC-5.9.54 - MTTR Reduction via Network vs Application Isolation
search_author = use-case-library
updated_author = akhamis
version = 1.0.1
date_created = 2026-04-21 11:24:21
date_updated = 2026-08-07
category = Monitoring
sub_category = Correlation
tags = Comparison,ThousandEyes,Alerts,Events,Trend,Intrusion Prevention
default_viz = splunk.column
viz_options = {"seriesColors":["#38BDF8"],"stackMode":"unstacked"}
description = <p>Compares how long ThousandEyes alerts stay open when they can be paired with an Internet Insights event against when they cannot, charting an <b>average time-to-isolate in minutes</b> for each of the two workflows over time. Intended as an operational-efficiency measure rather than a fault-finding tile.</p>
explanation = <p>The leading <code>tstats</code> reads <code>DATAMODEL=Cisco_ThousandEyes.Alerts</code>, taking <code>earliest(_time)</code> and <code>latest(_time)</code> per <b>one-hour bucket per rule signature and test name</b>, and an <code>eval</code> turns that span into <code>mtti_minutes</code>. A <code>join type=outer max=1</code> then attaches a subsearch over <code>DATAMODEL=Cisco_ThousandEyes.Events</code>, which supplies the earliest event time for the matching Internet Insights title; <code>type=outer</code> is what keeps alerts with no matching event in the result rather than dropping them. Both sides rename their identifier to the plain field <code>test_key</code> before the join, because <code>join</code> takes its key as a bare token and a dotted name such as <code>alert.test.name</code> is not reliably parsed as a single field there. An <code>eval</code> labels each row <code>ThousandEyes Event + Alert</code> when the subsearch matched and <code>ThousandEyes Alert Only</code> when it did not, and the closing <code>timechart</code> splits the average by that label. Acceleration behaviour on both legs comes from the app-owned <code>scd_summariesonly</code> macro rather than a hardcoded value.</p><p>The final aggregate is <code>avg(mtti_minutes)</code> alone. It previously carried a trailing <code>count</code> as well, which combined with the <code>BY</code> split produced a cross product of columns named <code>avg_mtti: &lt;method&gt;</code> and <code>count: &lt;method&gt;</code> &mdash; four series on one axis mixing minutes with a record count, on a chart configured for a single colour. Dropping the <code>count</code> leaves exactly the two named series the panel describes.</p>
solution = <p>Returns <code>_time</code> plus at most two columns, <code>ThousandEyes Event + Alert</code> and <code>ThousandEyes Alert Only</code>, each an average in minutes. A method with no matching rows produces no column at all, so seeing only one series is normal when correlation coverage is zero. The intended reading is that the correlated series should sit below the alert-only series, because an operator who already has provider-scale context spends less time working out whether the problem is theirs. Treat the absolute values with care and use the chart for the gap between the two lines rather than for either line on its own: the alert span is measured inside a one-hour bucket, so the figure is bounded by that bucket and is a proxy for isolation effort rather than a true incident duration. Two lines that stay on top of each other, or a single line where you expected two, mean the correlation is not adding information &mdash; usually because Internet Insights event titles are not matching your test names &mdash; and the join key is the first thing to check. In the reference dataset shipped with this app there is no overlap at all between <code>Events.title</code> and <code>Alerts.testName</code>, so only the alert-only series appears; that is a naming-coverage condition in the source tenant, not a fault in the search.</p>
related_info = <ul><li><b><a href="https://docs.thousandeyes.com/">Cisco ThousandEyes documentation</a></b><br>Reference for alerts, Internet Insights events, and the relationship between a test-level threshold breach and a provider-scale disruption.</li><li><b>What the join matches on</b><br>Both sides rename their identifier to the plain field <code>test_key</code> &mdash; the Internet Insights event <code>title</code> on one side, the alert <code>testName</code> on the other &mdash; and the join runs on that. A dotted name cannot be used directly as a <code>join</code> key. The match itself is exact text between two independently authored strings, so correlation coverage depends entirely on naming discipline in the ThousandEyes tenant.</li><li><b>Reading the metric</b><br>The value is derived from the first and last alert record inside each hourly bucket, so it measures alert activity span rather than a ticket-to-resolution time, and it is structurally capped at 60 minutes. It is comparable between the two series because both are computed the same way; it is not comparable to an ITSM mean time to resolve. Removing the cap would require an incident boundary the Alerts dataset does not provide &mdash; <code>alertId</code> is not unique per occurrence in this feed and there is no trigger/clear lifecycle in <code>eventType</code> &mdash; so the bucket stands until an alert-state field is available.</li><li><b><a href="https://help.splunk.com/en/splunk-enterprise/search/spl-search-reference/10.4/search-commands/timechart">Splunk timechart command reference</a></b><br>Reference for the <code>BY</code> split that produces the two named series.</li></ul>
search = | tstats summariesonly=false allow_old_summaries=false fillnull_value=null earliest(_time) as alert_start, latest(_time) as alert_end FROM DATAMODEL=Cisco_ThousandEyes.Alerts BY _time span=1h, Alerts.signature, Alerts.testName\
| rename "Alerts.signature" as "alert.rule.name" "Alerts.testName" as test_key\
| eval mtti_minutes=round((alert_end-alert_start)/60,1)\
| join type=outer max=1 test_key [ | tstats summariesonly=false allow_old_summaries=false fillnull_value=null earliest(_time) as event_start FROM DATAMODEL=Cisco_ThousandEyes.Events BY Events.title\
  | rename "Events.title" as test_key ]\
| eval isolation_method=if(isnotnull(event_start), "ThousandEyes Event + Alert", "ThousandEyes Alert Only")\
| timechart avg(mtti_minutes) as avg_mtti by isolation_method

