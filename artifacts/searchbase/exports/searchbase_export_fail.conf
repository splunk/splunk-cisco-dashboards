description = <p>Detects hours with anomalously high or low ThousandEyes alert volumes compared to the learned baseline for that Weekday/Weekend x hour slot. Distinguishes genuine network incidents from normal background alert noise.</p>
explanation = <p>Counts ThousandEyes alerts per hour from the <code>Cisco_ThousandEyes.Alerts</code> data model, builds a Weekday/Weekend x hour slot key, requires >=3 samples per slot for statistical validity, and fits a Gaussian density model using MLTK <code>DensityFunction</code>. Only hours where alert count is a true outlier relative to historical patterns are returned.</p>
solution = <p>An alert volume anomaly during a normally quiet window (e.g., Saturday at 03:00) almost certainly indicates a real incident rather than a flapping sensor. Route these directly to on-call NOC with elevated priority. A lower-than-usual volume may indicate a monitoring gap caused by test configuration issues.</p>
related_info = <ul><li><b>Data model</b>: Cisco_ThousandEyes.Alerts</li><li><b>Algorithm</b>: DensityFunction (MLTK)</li><li><b>Model</b>: teuc_alert_volume_density_model</li><li><b>Min samples</b>: 3 per slot</li><li><b><a href="https://docs.thousandeyes.com/">Cisco ThousandEyes documentation</a></b><br>Reference for test types, metrics, and alerting semantics behind ThousandEyes data.</li></ul>
search = | tstats summariesonly=false allow_old_summaries=false fillnull_value=null count FROM DATAMODEL=Cisco_ThousandEyes.Alerts BY _time span=1h\
