explanation = <p>The base reads <code>index="<<index>>"</code> with <code>sourcetype=&quot;cisco:dc:nd:mso&quot;</code> and <code>mso_api_endpoint=tenantDetails</code>. A first <code>stats</code> takes the latest site association list per tenant <code>name</code>, collapsing repeated polls to current state, and <code>coalesce</code> turns a tenant with no site association into the literal <code>None</code> so it is not silently lost. The tenant field is deliberately renamed to <code>tenant_name</code> before the join &mdash; the site lookup also returns a field called <code>name</code>, and renaming first is what stops the two from colliding. <code>mvexpand id</code> then produces one row per tenant-site pair, an outer <code>join</code> on <code>id</code> against the <code>siteHealth</code> endpoint resolves each identifier to a site name, and a field-scoped <code>fillnull</code> labels anything unresolved <code>None</code>. The final <code>stats dc(tenant_name) as Count by name</code> counts distinct tenants per site.</p>
solution = <p>Returns one row per site with columns <code>Site Name</code> and <code>Count</code>, the number of distinct tenants associated with that fabric. Despite the panel title, the SPL neither trims to ten rows nor ranks them &mdash; every site is returned and the pie visualization surfaces the largest slices. A row labeled <code>None</code> collects tenants with no site association plus tenants whose identifier no longer resolves to a live site, and that row is the one to check first: those tenants exist in the Orchestrator but are not deployed anywhere. Comparing site counts shows how evenly tenancy is spread across fabrics, which matters for capacity and for judging the impact of taking one site out of service for maintenance.</p>
related_info = <ul><li><b><a href="https://www.cisco.com/c/en/us/support/cloud-systems-management/multi-site-orchestrator/series.html">Cisco Nexus Dashboard Orchestrator support documentation</a></b><br>Explains site onboarding and how a tenant is stretched across fabrics in a Multi-Site deployment.</li><li><b><a href="https://help.splunk.com/en/splunk-enterprise/search/spl-search-reference/10.4/search-commands/fillnull">fillnull command reference</a></b><br>Documents the field-scoped form used to label unresolved site names without touching other fields.</li><li><b>Rename before join</b><br>Renaming the tenant field to <code>tenant_name</code> ahead of the join is what lets the joined site <code>name</code> land cleanly. The equivalent tenants-per-schema panel omits this step and suffers a collision as a result.</li><li><b>Site health as the name source</b><br>Site names come from the <code>siteHealth</code> API response, so a site that has never reported health has no name and its tenants fall into the <code>None</code> bucket.</li></ul>
