description = <p>Builds a <b>four-column tenant inventory</b> from Nexus Dashboard Orchestrator, resolving each tenant&rsquo;s site association identifiers into site names and its user association identifier into a username, alongside the tenant description.</p>
explanation = <p>The base reads <code>index="<<index>>"</code> with <code>sourcetype=&quot;cisco:dc:nd:mso&quot;</code> and <code>mso_api_endpoint=tenantDetails</code>. An initial <code>stats</code> with <code>latest()</code> aggregations grouped by tenant <code>name</code> collapses repeated API snapshots to the current state of each tenant. Because a tenant can be associated with several sites, <code>coalesce</code> substitutes the literal <code>None</code> for tenants with no site at all, and <code>mvexpand id</code> then fans the multivalue site list out to one row per tenant-site pair so each identifier can be joined individually. Two outer joins follow: one against the <code>siteHealth</code> endpoint to turn a site identifier into a site name, one against the <code>userDetails</code> endpoint to turn a user identifier into a username. A further <code>coalesce</code> pair labels unresolved identifiers <code>None</code>. The closing <code>eval</code> converts any remaining empty cell to a dash; note that its field names contain spaces, so the assignment targets are written in double quotes while the values being read are written in single quotes &mdash; that quoting distinction is what makes the statement parse.</p>
solution = <p>Returns one row per tenant-and-site pair with columns <code>Tenant Name</code>, <code>Username</code>, <code>Site Name</code>, and <code>Description</code>. Row order is not defined by the search and the table visualization controls presentation. A tenant stretched across two sites produces two rows, which is the intended shape for a Multi-Site deployment: the same policy tenant is instantiated on each fabric it is associated with. A cell reading <code>None</code> means the association identifier was present but could not be resolved against the site or user inventory, usually because that site or account has been removed; a cell reading a dash means the field was absent from the API response altogether. Use the table to confirm that every production tenant is bound to the sites it is supposed to span and owned by a current account, particularly before an Orchestrator upgrade or a site decommission.</p>
related_info = <ul><li><b><a href="https://www.cisco.com/c/en/us/support/cloud-systems-management/multi-site-orchestrator/products-installation-and-configuration-guides-list.html">Nexus Dashboard Orchestrator configuration guides</a></b><br>Describes tenant site associations, user associations, and the role-based access model behind the account names resolved here.</li><li><b><a href="https://help.splunk.com/en/splunk-enterprise/search/spl-search-reference/10.4/search-commands/mvexpand">mvexpand command reference</a></b><br>Explains the row multiplication that turns one tenant holding several site identifiers into several rows, and the memory limit that applies to it.</li><li><b>Only the site list is expanded</b><br>The user association list is joined without being expanded first, so a tenant owned by several accounts resolves at most one username.</li><li><b>Dash versus None</b><br>The two placeholders mean different things: a dash is a missing field, <code>None</code> is a present but unresolvable identifier. Treating them as equivalent hides stale references.</li></ul>
search = index="<<index>>" sourcetype="cisco:dc:nd:mso" mso_api_endpoint=tenantDetails\
| stats latest(siteAssociations_siteId) AS siteAssociations_siteId latest(userAssociations_userId) AS userAssociations_userId latest(description) AS description by name\
| eval siteAssociations_siteId=coalesce(siteAssociations_siteId, "None")\
| rename name as "tenant_name",siteAssociations_siteId as "id"\
| mvexpand id\
| join type=outer id [search index="<<index>>" sourcetype="cisco:dc:nd:mso" mso_api_endpoint=siteHealth | stats latest(name) AS name by id]\
| join type=outer userAssociations_userId [search index="<<index>>" sourcetype="cisco:dc:nd:mso" mso_api_endpoint=userDetails | stats latest(username) AS username by id | rename id as userAssociations_userId]\
| eval username=coalesce(username, "None"), name=coalesce(name, "None")\
| table tenant_name, username,name, description\
| rename tenant_name as "Tenant Name", username as Username, description as Description, name as "Site Name"\
| eval "Tenant Name"=coalesce('Tenant Name', "-"), Username=coalesce(Username, "-"), Description=coalesce(Description, "-"), "Site Name"=coalesce('Site Name', "-")

