category = Asset
sub_category = OT Asset Intelligence
tags = Cyber Vision,OT Security,Assets,Protocols,Leaderboard
default_viz = splunk.bar
viz_options = {"seriesColors":["#0D9488","#2563EB","#F59E0B","#DC2626"],"legendDisplay":"off"}
description = <p>Ranks the ten protocol tags most frequently observed in Cisco Cyber Vision activity records.</p>
explanation = <p>The source dashboard stores tag identifiers and tag-category labels as parallel multivalue arrays. This search zips and expands those arrays, keeps tags whose category is <code>Protocol</code>, then counts distinct activity records by protocol.</p>
solution = <p>Use the ranking to establish the expected industrial-protocol mix. Investigate unfamiliar protocols or abrupt changes that may indicate a new asset, an unintended route, or unsanctioned engineering access.</p>
related_info = <ul><li><b>Provenance</b><br>Harvested from the Top 10 Protocols panel in Cisco Cyber Vision App for Splunk 2.2.0.</li><li><b>Dependency</b><br>Requires <code>cisco:cybervision:activities</code> data and the JSON field extractions shipped by TA-cisco_cybervision.</li><li><b><a href="https://www.cisco.com/c/en/us/support/security/cyber-vision/series.html">Cisco Cyber Vision support documentation</a></b><br>Product documentation for the telemetry and operational concepts used by this search.</li></ul>
search = index="<<index>>" sourcetype="cisco:cybervision:activities" "tags{}.category.label"="Protocol"\
| eval tag_pair=mvzip('tags{}.id','tags{}.category.label',"#")\
| mvexpand tag_pair\
| eval tag_parts=split(tag_pair,"#"), Protocol=mvindex(tag_parts,0), tag_category=mvindex(tag_parts,1)\
| where tag_category="Protocol" AND isnotnull(Protocol)\
| chart dc(id) as Activities over Protocol\
| sort 0 - Activities Protocol\
| head 10
