[dc_networking_anomalies_top_10_nodes_contributing_to_anomalies]
search_name = DC Networking - Anomalies - Top 10 nodes contributing to Anomalies
search_author = akhamis
updated_author = akhamis
version = 1.0.1
date_created = 2026-07-30 00:00:00
date_updated = 2026-08-07
category = Data Center Networking
sub_category = Advisories & Anomalies
tags = Nexus Dashboard,Cisco DC Networking,Table,Anomaly,Anomaly Records
default_viz = splunk.table
description = <p>Builds a <b>per-node table</b> of Nexus Dashboard anomalies, keeping for each fabric node the single anomaly carrying that node&rsquo;s largest anomaly score and reporting its severity, the Nexus Dashboard host that raised it, and the fabric it belongs to.</p>
explanation = <p>The base <code>tstats</code> reads the <code>anomalies</code> node of <code>Cisco_DCN_nexus_dashboard</code> under the <code>scd_summariesonly</code> acceleration macro, grouping by <code>anomalies.anomalyId</code>, <code>anomalies.nd_host</code> and <code>anomalies.fabricName</code> so that one row exists per anomaly. <code>anomalies.node_names</code> is multivalue because a single anomaly can implicate several switches, so <code>mvexpand</code> fans each anomaly out into one row per affected node. Two <code>eventstats</code> passes then reduce that back to one row per node: the first keeps only rows matching <code>max(anomalyScore)</code> for the node, and the second breaks any remaining tie by comparing a synthetic <code>tie_break</code> string assembled with <code>coalesce</code> from the anomaly id, Nexus Dashboard host, fabric name and severity. The <code>coalesce</code> wrappers matter because a null in any component would otherwise null the entire concatenation and collapse every tie into one indistinguishable value. Note that the dotted data-model fields are wrapped in single quotes inside <code>eval</code>, which is how Splunk tells a dotted field name apart from a literal string. The final <code>stats</code> collapses to one row per node and <code>table</code> selects the four presentation columns.</p>
solution = <p>Returns a four-column table &mdash; <code>Node</code>, <code>Severity</code>, <code>Host</code>, <code>Site</code> &mdash; with one row per fabric node named in at least one anomaly. Row order is not defined by the search and the visualization controls presentation, so despite the historical panel name nothing here selects a leading ten; read the severity column and the row count to pick out the nodes carrying the worst conditions. The <code>anomalyScore</code> that decided which anomaly won for each node is computed but never emitted, so a reader cannot tell how close a node was to its peers. A node appearing here at <code>critical</code> or <code>major</code> severity across several refreshes is a durable fabric problem rather than a momentary blip.</p>
related_info = <ul><li><b><a href="https://www.cisco.com/c/en/us/support/data-center-analytics/nexus-dashboard/series.html">Cisco Nexus Dashboard support documentation</a></b><br>Describes how Nexus Dashboard raises anomalies against fabric nodes and what its severity and category values mean.</li><li><b><a href="https://help.splunk.com/en/splunk-enterprise/search/spl-search-reference/10.4/search-commands/mvexpand">Splunk <code>mvexpand</code> reference</a></b><br>Explains the row multiplication applied to <code>anomalies.node_names</code> and the memory limit that silently truncates very wide multivalue fields.</li><li><b>The deciding score is dropped</b><br>The pipeline selects each node&rsquo;s highest-scoring anomaly and then omits <code>anomalyScore</code> from the final <code>table</code>. Emitting it would cost one column and would make the result far easier to triage.</li><li><b>Severity and score are independent</b><br>Nexus Dashboard carries both a categorical severity and a numeric anomaly score, and they are set separately. A node can show <code>major</code> severity with a modest score, or the reverse, so neither field substitutes for the other.</li></ul>
search = | tstats summariesonly=false allow_old_summaries=false fillnull_value=null latest(anomalies.anomalyScore) as anomalyScore values(anomalies.node_names) as "Node" latest(anomalies.severity) as "Severity" from datamodel=Cisco_DCN_nexus_dashboard.anomalies by anomalies.anomalyId, anomalies.nd_host, anomalies.fabricName\
| mvexpand "Node"\
| eventstats max(anomalyScore) AS winning_score by "Node"\
| where anomalyScore=winning_score\
| eval tie_break=coalesce('anomalies.anomalyId',"")."|".coalesce('anomalies.nd_host',"")."|".coalesce('anomalies.fabricName',"")."|".coalesce(Severity,"")\
| eventstats max(tie_break) AS winning_tie by "Node"\
| where tie_break=winning_tie\
| stats max(anomalyScore) AS anomalyScore values(Severity) AS "Severity" values(anomalies.nd_host) AS "Host" values(anomalies.fabricName) AS "Site" by "Node"\
| table "Node", "Severity", "Host", "Site"

