[spaces_room_utilization_league_table]
search_name = Spaces - All Spaces - Utilization League Table (Lease Optimization)
search_author = akhamis
updated_author = akhamis
version = 1.0.0
date_created = 2026-06-14
date_updated = 2026-08-07
category = Cisco Spaces
sub_category = Space Optimization
tags = Cisco Spaces,Capacity Planning,Occupancy,Table,Distribution,Rooms
default_viz = splunk.table
viz_options = {"seriesColors":["#16A34A","#0EA5E9","#F59E0B","#DC2626"],"legendDisplay":"off"}
description = <p>Occupancy rate for every room, area, and desk cluster in Cisco Spaces occupancy telemetry, measured against the <b>full dispatched search window</b> rather than only the hours in which a space happened to report, alongside average and peak capacity fill, seat capacity, reporting coverage, and a five-band utilisation rating.</p>
explanation = <p>Reads <code>index="<<index>>" sourcetype="cisco:spaces:firehose" eventType="SPACE_OCCUPANCY"</code> and works in two aggregation stages. <code>bin _time span=1h</code> followed by <code>stats ... by _time, space_name, space_type</code> reduces the raw event stream to one hourly snapshot per space, which normalises away the fact that a busy space emits far more events than a quiet one &mdash; without this step the occupancy rate would simply track sensor chattiness. A space counts as occupied in an hour if either <code>peoplePresence</code> is true or <code>peakPeopleCount</code> exceeds zero, so a room registers even when the people-count sensor is unreliable. <code>fill_pct</code> is guarded with <code>if(capacity&gt;0, ...)</code> so spaces with no configured capacity yield <code>null()</code> rather than a divide-by-zero, and those nulls are excluded from the average automatically. The second <code>stats</code> produces <code>hours_reported</code>, <code>hours_occupied</code>, and the fill aggregates for each space and space type.</p><p><b>The denominator is the dispatched search window, not the hours in which the space reported.</b> <code>addinfo</code> exposes <code>info_min_time</code> and <code>info_max_time</code>, and <code>window_span_hours</code> is their difference expressed in hours, so the metric stays correct at whatever range the Searchbase time picker supplies and no window length is hardcoded. Two boundary cases are handled explicitly. When the picker requests an open-ended or real-time range, Splunk sets <code>info_max_time</code> to the string <code>+Infinity</code>; <code>isnum(info_max_time)</code> is false there, so the window end falls back to <code>now()</code>. When the picker requests All time, <code>info_min_time</code> is <code>0</code>, which would stretch the window back to the epoch and drive every rate to zero; the <code>eventstats min(_time) as data_start</code> stage captures the first hourly bucket that actually carries data and the window start falls back to it, so an All-time run measures first-observation-to-now. <code>occupancy_rate</code> is clamped at 100 because <code>bin</code> can floor an event into an hourly bucket beginning marginally before an unsnapped window start. Hours Reported survives as a separate column because it is now a pure data-quality signal rather than the denominator.</p><p>Because every hour of the window is in the denominator, <b>overnight, weekend, and holiday hours count as unused capacity</b>. That is the intended behaviour and it is why the bands moved. The Fair Labor Standards Act defines a workweek as a recurring 168-hour period and sets its overtime threshold at 40 hours worked within it, so a space occupied during every business hour of a full week reads only about 23.8% here, and a band above 80% is not physically reachable for a normal office. The five bands are therefore expressed as fractions of that 23.8% ceiling: Dead Zone below 2.4% (under a tenth of a full business week), Underutilized below 6% (under a quarter), Moderate Use below 11.9% (under half), Well Used below 17.9% (under three quarters), and High Demand at or above that. Measured across 57 space rows on a seven-day window in this deployment those bands hold 11, 17, 23, 5, and 1 row respectively. The ceiling is only stable over windows of a week or more: a 24-hour window landing on a weekday has a business-hours ceiling near 33% and one landing on a weekend has a ceiling of zero, so read the rating over seven days or longer.</p>
solution = <p>Returns ten columns: Space, Type, Capacity, Occupancy Rate %, Avg Fill %, Peak Fill %, Hours Active, Hours Reported, Window Hours, and Utilization Rating. The pipeline ends in <code>stats</code>-derived fields with no ordering stage, so the output is unordered and the table visualization controls presentation; reorder on Occupancy Rate % in the table to bring the smallest values to the front. Hours Active, Hours Reported, and Window Hours appear together deliberately: Window Hours is the denominator, Hours Active is the numerator, and Hours Reported says how much of the window the sensor spoke at all.</p><p>Occupancy Rate and Avg Fill answer different questions and should drive different decisions. Occupancy Rate tells you whether the space is used at all and drives the lease decision; Avg Fill tells you whether it is the right size and drives the reconfiguration decision. A boardroom in the Well Used band with 20% average fill is being booked constantly for two-person meetings and should be subdivided, not eliminated. Dead Zone spaces sustained below 2.4% across four or more weeks are genuine lease-termination candidates, while anything consistently in High Demand at or above 17.9% &mdash; three quarters of a full business week &mdash; needs either expansion or a booking cap before it becomes a daily friction point. Check Hours Reported against Window Hours before acting on any row: a space may be genuinely idle or its sensor may simply be offline, and the two are indistinguishable in Occupancy Rate %. Coverage in this deployment runs between 2% and 25% of window hours, so treat a low Hours Reported as an instrumentation question first. A 30 to 90 day window is the minimum for a statistically meaningful rating.</p>
related_info = <ul><li><b><a href="https://www.cisco.com/c/en/us/td/docs/wireless/spaces/config-guide/ciscospaces-configuration-guide.html">Cisco Spaces Configuration Guide</a></b><br>The <code>SPACE_OCCUPANCY</code> firehose event, space capacity configuration, and the ROOM, AREA, and DESK space types included here.</li><li><b><a href="https://www.dol.gov/agencies/whd/overtime">US Department of Labor &mdash; Overtime Pay</a></b><br>Source of the 168-hour workweek and the 40-hour full-time reference behind the band boundaries: a space busy during every business hour of a full week reaches only about 23.8% of a window-based occupancy rate, and each band is a fraction of that ceiling.</li><li><b><a href="https://help.splunk.com/en/splunk-enterprise/search/spl-search-reference/10.0/search-commands/addinfo">Splunk addinfo command reference</a></b><br>Defines <code>info_min_time</code> and <code>info_max_time</code> and documents that <code>info_max_time</code> becomes <code>+Infinity</code> for an all-time or open-ended range, which is the case this search guards with <code>isnum()</code>.</li><li><b>Companion view</b><br><code>spaces_space_idle_cost_ranking</code> weights the same window-based empty hours by seat capacity to express under-use in lease-cost terms.</li></ul>
search = index="<<index>>" sourcetype="cisco:spaces:firehose" eventType="SPACE_OCCUPANCY"\
| rename "spaceOccupancy.space.name" as space_name "spaceOccupancy.space.type" as space_type "spaceOccupancy.space.capacity" as capacity "spaceOccupancy.peakPeopleCount" as peak_count "spaceOccupancy.peoplePresence" as people_present\
| bin _time span=1h\
| stats max(capacity) as capacity max(peak_count) as peak_count latest(people_present) as people_present by _time, space_name, space_type\
| eventstats min(_time) as data_start\
| eval occupied=if(people_present=="true" OR peak_count>0, 1, 0)\
| eval fill_pct=if(capacity>0, round(peak_count/capacity*100, 1), null())\
| stats count as hours_reported sum(occupied) as hours_occupied avg(fill_pct) as avg_fill_pct max(fill_pct) as peak_fill_pct max(capacity) as capacity min(data_start) as data_start by space_name, space_type\
| addinfo\
| eval window_start=if(isnum(info_min_time) AND info_min_time>0, info_min_time, data_start), window_span_hours=(if(isnum(info_max_time), info_max_time, now())-window_start)/3600\
| eval occupancy_rate=if(window_span_hours>0, round(min(hours_occupied/window_span_hours*100, 100), 1), null()), window_hours=round(window_span_hours, 1)\
| eval rating=case(isnull(occupancy_rate),"Unrated - Zero-Length Window", occupancy_rate<2.4,"Dead Zone - Lease Candidate", occupancy_rate<6,"Underutilized", occupancy_rate<11.9,"Moderate Use", occupancy_rate<17.9,"Well Used", 1==1,"High Demand")\
| eval avg_fill_pct=round(avg_fill_pct, 1), peak_fill_pct=round(peak_fill_pct, 1)\
| fields - info_* data_start window_start window_span_hours\
| rename space_name as "Space" space_type as "Type" capacity as "Capacity" occupancy_rate as "Occupancy Rate %" avg_fill_pct as "Avg Fill %" peak_fill_pct as "Peak Fill %" hours_occupied as "Hours Active" hours_reported as "Hours Reported" window_hours as "Window Hours" rating as "Utilization Rating"

