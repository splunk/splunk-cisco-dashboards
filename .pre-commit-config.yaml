# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.2.0
    hooks:
    -   id: trailing-whitespace
        files: ^package/bin/
        exclude: ^package/bin/[^/]+/aob_py3/
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-json
        types: [text]
        files: \.(json|manifest)$
    -   id: check-xml
    -   id: debug-statements
        files: ^package/bin/
        exclude: ^package/bin/[^/]+/aob_py3/

# Splunk SPL anti-pattern linter — catches gotchas like single-quoted
# dotted field names inside stats/chart/timechart aggregations, which
# Splunk silently treats as literal strings instead of field references.
# Pure stdlib Python; runs on every commit that touches searchbase.conf.
-   repo: local
    hooks:
    -   id: spl-antipatterns
        name: Splunk SPL anti-pattern linter
        entry: python3 scripts/lint_spl_antipatterns.py
        language: system
        files: ^packages/splunk-cisco-dashboards/src/main/resources/splunk/default/searchbase\.conf$
        pass_filenames: false
