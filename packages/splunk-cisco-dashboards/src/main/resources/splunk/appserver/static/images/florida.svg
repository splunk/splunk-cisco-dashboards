           Q 450,272 452,302
           Q 451,338 442,368
           Q 428,398 408,422
           Q 380,448 348,462
           Q 312,475 278,475
           Q 248,470 226,452
           Q 210,432 200,402
           Q 188,365 175,328
           Q 160,288 146,250
           Q 132,215 117,188
           Q 99,168 80,155
           Q 62,142 48,130
