<!DOCTYPE html>
<html class="no-js" lang="">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="x-ua-compatible" content="ie=edge" />
        <title>Splunk for Secure Networking</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            rel="stylesheet"
            href="${make_url('/static/app/splunk-cisco-dashboards/application.css')}"
        />
    </head>

    <body>
        <script src="${make_url('/config?autoload=1')}" crossorigin="use-credentials"></script>
        <script src="${make_url('/static/js/i18n.js')}"></script>
        <script src="${make_url('/i18ncatalog?autoload=1')}"></script>
        <script>
            __splunkd_partials__ = ${json_decode(splunkd)};
        </script>

        <script>
            function loadOverviewBootstrap() {
                const overviewBootstrap = document.createElement('script');
                overviewBootstrap.src =
                    "${make_url('/static/app/splunk-cisco-dashboards/overview_bootstrap.js')}" +
                    '?v=' +
                    Date.now();
                document.body.appendChild(overviewBootstrap);
            }

            const setupGate = document.createElement('script');
            setupGate.src =
                "${make_url('/static/app/splunk-cisco-dashboards/application.js')}" +
                '?v=' +
                Date.now();
            setupGate.onload = function () {
                Promise.resolve(window.scdSetupGatePromise).then(function (canLoadApp) {
                    if (canLoadApp !== false) {
                        loadOverviewBootstrap();
                    }
                });
            };
            setupGate.onerror = loadOverviewBootstrap;
            document.body.appendChild(setupGate);
        </script>
    </body>
</html>
