
[install]
state = enabled
build = 1203

[id]
name = splunk-cisco-dashboards
version = 1.0.10

[launcher]
author = Splunk Field Solutions Team
description = Splunk Executive Insights delivers a curated set of React-based dashboards for visualizing Cisco fleet inventory, network performance, and security posture inside Splunk Web.
version = 1.0.10

[package]
check_for_updates = 1
id = splunk-cisco-dashboards

[ui]
label = Splunk Executive Insights
is_visible = 1
show_in_nav = 1
supported_themes = light,dark

# Reload triggers for custom config files. Without these, Splunk would
# request a restart on every change to the config, which Cloud Vetting
# blocks. searchbase.conf is the Dashboard Studio searchbase registry.
# network_diagrams.conf is the Network Diagram authoring persistence
# layer (Build 115.3 — replaces the Build 108 CSV lookup); the simple
# reload picks up edits made via the REST API or btool without
# requiring a Splunkd restart.
[triggers]
reload.searchbase = simple
reload.network_diagrams = simple
