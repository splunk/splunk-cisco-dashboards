
[install]
state = enabled
build = 60

[id]
name = splunk-cisco-dashboards
version = 1.0.10

[launcher]
author = Cisco Dashboards Team
description = Splunk Cisco Dashboards delivers a curated set of React-based dashboards for visualizing Cisco fleet inventory, network performance, and security posture inside Splunk Web.
version = 1.0.10

[package]
check_for_updates = 1
id = splunk-cisco-dashboards

[ui]
label = Splunk Cisco Dashboards
is_visible = 1
show_in_nav = 1
supported_themes = light,dark

# Reload triggers for custom config files. Without these, Splunk would
# request a restart on every change to the config, which Cloud Vetting
# blocks. searchbase.conf is the Dashboard Studio searchbase registry.
[triggers]
reload.searchbase = simple
