| rename DeviceName as Device, DeviceFamily as Family, SiteName as Site, DeviceIpAddress as IP

[IT - Critical Systems - ds_issue_trend]
description = Catalyst Center issue trend — timechart of issue categories over time to identify patterns, spikes, and recurring operational problems.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:issue" \
| eval issue_group=case(match(IssueName,"High input"),"Interface Utilization", match(IssueName,"BGP"),"BGP Instability", match(IssueName,"AP"),"AP Issues", match(IssueName,"AAA"),"AAA/RADIUS", match(IssueName,"Host flap"),"MAC Flapping", match(IssueName,"Network Device"),"Device Reachability", match(IssueName,"Internet"),"Internet Connectivity", match(IssueName,"5 GHz"),"Wireless Radio", match(IssueName,"This Device"),"Device Health", 1==1,IssueSpecificCategory) \
| timechart span=1h count by issue_group limit=10

[IT - Critical Systems - ds_issue_by_site]
description = Catalyst Center issues by site — counts issues per site with severity breakdown and affected device count for site-level triage.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:issue" \
