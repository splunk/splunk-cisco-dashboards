# ======================================================================
# Security Posture (cisco:dnac:securityadvisory + cisco:dnac:compliance)
# ======================================================================

[Security Resilience - ds_psirt_critical_advisories]
description = Critical and High PSIRT security advisories from Catalyst Center — identifies network devices exposed to known vulnerabilities with CVE details.
dispatch.earliest_time = -7d
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:securityadvisory" (AdvisorySir="Critical" OR AdvisorySir="High") \
| stats dc(DeviceName) as affected_devices, values(DeviceFamily) as families, values(AdvisoryCvesStr) as cves, latest(Summary) as summary, latest(AdvisoryPublicationUrl) as url by AdvisoryID, AdvisorySir \
| sort -affected_devices \
| rename AdvisoryID as Advisory, AdvisorySir as Severity

[Security Resilience - ds_advisory_exposure_by_family]
description = Security advisory exposure aggregated by device family — shows which platform types carry the most unpatched vulnerability risk.
dispatch.earliest_time = -7d
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:securityadvisory" \
| stats dc(AdvisoryID) as advisory_count, count(eval(AdvisorySir=="Critical")) as critical, count(eval(AdvisorySir=="High")) as high, dc(DeviceName) as device_count by DeviceFamily \
| sort -critical, -advisory_count \
| rename DeviceFamily as "Device Family"

[Security Resilience - ds_noncompliant_devices]
description = Non-compliant devices by compliance type — identifies devices failing configuration, image, or PSIRT compliance checks.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:compliance" ComplianceStatus!="COMPLIANT" \
| stats count as violation_count, values(ComplianceComplianceType) as compliance_types, latest(ComplianceState) as state by DeviceName, DeviceFamily, Platform, IpAddress \
| eval compliance_types=mvjoin(compliance_types, ", ") \
| sort -violation_count \
| rename DeviceName as Device, DeviceFamily as Family

[Security Resilience - ds_compliance_distribution]
description = Compliance state distribution across all devices — donut chart of compliant vs non-compliant by compliance check type.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:compliance" \
| stats dc(DeviceName) as device_count by ComplianceStatus, ComplianceComplianceType \
| sort ComplianceStatus, -device_count

# ======================================================================
# User Experience — Client Intelligence (cisco:dnac:client)
# ======================================================================

[User Experience - ds_client_onboarding_failures]
description = Client onboarding failures — identifies DHCP, AAA, and association issues causing connectivity problems for end users.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:client" (onboarding.latestFailureReason!="" AND onboarding.latestFailureReason!="null") \
| stats count as failure_count, values(onboarding.latestFailureReason) as reasons, values(onboarding.aaaFailureReason) as aaa_reasons, values(onboarding.dhcpFailureReason) as dhcp_reasons, values(connection.ssid) as ssid, latest(siteHierarchy) as site by macAddress, deviceType \
| sort -failure_count \
| rename macAddress as "Client MAC", deviceType as "Device Type"

[User Experience - ds_client_health_distribution]
description = Client health score distribution — categorizes all connected clients into Good/Fair/Poor bands for overall wireless and wired experience assessment.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:client" \
| eval health_band=case(health.overallScore>=7,"Good (7-10)",health.overallScore>=4,"Fair (4-6)",health.overallScore>=1,"Poor (1-3)",1==1,"No Score") \
| stats count by health_band, type \
| sort type, health_band

[User Experience - ds_wireless_signal_quality]
description = Wireless signal quality by SSID and site — RSSI and SNR averages to identify coverage gaps and poor client experience areas.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:client" type="Wireless" \
| stats avg(connection.rssi) as avg_rssi, avg(connection.snr) as avg_snr, count as client_count, avg(health.overallScore) as avg_health by connection.ssid, siteHierarchy \
| eval avg_rssi=round(avg_rssi,1), avg_snr=round(avg_snr,1), avg_health=round(avg_health,1), signal_quality=case(avg_rssi>=-65,"Good",avg_rssi>=-75,"Fair",1==1,"Poor") \
| sort -client_count \
| rename connection.ssid as SSID, siteHierarchy as Site

[User Experience - ds_top_ssids_by_clients]
description = Top SSIDs by connected client count with band distribution — shows wireless network usage patterns and helps identify capacity planning needs.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:client" type="Wireless" \
| stats count as total_clients, count(eval(connection.band=="2.4")) as clients_24, count(eval(connection.band=="5.0")) as clients_50, count(eval(connection.band=="6.0")) as clients_6, dc(siteHierarchy) as site_count, avg(health.overallScore) as avg_health by connection.ssid \
| eval avg_health=round(avg_health,1) \
| sort -total_clients \
| rename connection.ssid as SSID

[User Experience - ds_client_roaming_analysis]
description = Client roaming success vs failure rates — identifies mobility issues across the wireless fabric that cause drops during room-to-room movement.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:client" type="Wireless" onboarding.totalRoamingAttempts>0 \
| stats sum(onboarding.successfulRoamingCount) as successful, sum(onboarding.failedRoamingCount) as failed, sum(onboarding.totalRoamingAttempts) as total, avg(onboarding.maxRoamingDuration) as avg_roam_ms by connection.ssid, siteHierarchy \
| eval success_pct=round(successful/total*100,1), avg_roam_ms=round(avg_roam_ms,0) \
| sort -failed \
| rename connection.ssid as SSID, siteHierarchy as Site

# ======================================================================
# Network & Traffic Intelligence
# ======================================================================

[User Experience - ds_client_top_talkers]
description = Top client devices by traffic usage — identifies bandwidth-heavy endpoints for capacity planning and anomaly detection.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:client" \
| eval usage_mb=round(traffic.usage/1048576,2) \
| where usage_mb>0 \
| stats latest(usage_mb) as usage_mb, latest(traffic.rxBytes) as rx_bytes, latest(traffic.txBytes) as tx_bytes, latest(type) as type, latest(connection.ssid) as ssid, latest(siteHierarchy) as site, latest(health.overallScore) as health by macAddress, username \
| sort -usage_mb \
| rename macAddress as "Client MAC", username as User

[IT - Critical Systems - ds_network_health_trend]
description = Network health score trend by category — timechart of good/fair/bad percentages from Catalyst Center network health rollup for executive monitoring.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:networkhealth" \
| timechart span=1h avg(goodPercentage) as "Good %", avg(fairPercentage) as "Fair %", avg(badPercentage) as "Bad %" by category

# ======================================================================
# Data Gap Analysis — Inventory vs. Splunk Coverage
# ======================================================================

[Asset Inventory - ds_gap_analysis]
description = Data gap analysis — compares all devices in the asset inventory lookup against live Splunk telemetry from five sources (DNAC devicehealth, IOS syslog, Network_Traffic datamodel, ISE NAD, Windows/AD) using six-way matching (FQDN, short name, and IP) to detect devices with no recent data.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = | inputlookup asset_inventory \
| eval short_name=device_name_short, ip=ip_address \
| append \
 [| search `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
 | stats count by DeviceName, IpAddress \
 | eval splunk_host=lower(DeviceName), \
 splunk_short=lower(mvindex(split(DeviceName,"."),0)), \
 splunk_ip=IpAddress, has_data=1 \
 | fields splunk_host, splunk_short, splunk_ip, has_data] \
| append \
 [| search `index_network` sourcetype="cisco:ios" \
 | stats count by host \
 | eval splunk_host=lower(host), \
 splunk_short=lower(mvindex(split(host,"."),0)), \
 has_data=1 \
 | fields splunk_host, splunk_short, has_data] \
| append \
 [| tstats `summariesonly` count from datamodel=Network_Traffic by All_Traffic.dvc \
 | rename "All_Traffic.dvc" as dvc \
 | eval splunk_host=lower(dvc), \
 splunk_short=lower(mvindex(split(dvc,"."),0)), \
 has_data=1 \
 | where isnotnull(splunk_host) AND splunk_host!="" \
 AND NOT match(splunk_host, "^[0-9a-f]{8}-[0-9a-f]{4}-") \
 | fields splunk_host, splunk_short, has_data] \
| append \
 [| search `index_identity` sourcetype="cisco:ise:syslog" \
 | rex "NetworkDeviceName=(?<nad_name>[^,]+)" \
 | where isnotnull(nad_name) AND nad_name!="DefaultNetworkDevice" \
 | stats count by nad_name \
 | eval splunk_host=lower(nad_name), \
 splunk_short=lower(mvindex(split(nad_name,"."),0)), \
 has_data=1 \
 | fields splunk_host, splunk_short, has_data] \
| append \
 [| search `index_windows` (sourcetype="XmlWinEventLog" OR sourcetype="ActiveDirectory" OR sourcetype="MSAD:NT6:DNS") \
 | stats count by host \
 | eval splunk_host=lower(host), \
 splunk_short=lower(mvindex(split(host,"."),0)), \
 has_data=1 \
 | fields splunk_host, splunk_short, has_data] \
| append \
 [| search `index_dhcp` sourcetype="DhcpSrvLog" \
 | stats count by host \
 | eval splunk_host=lower(host), \
 splunk_short=lower(mvindex(split(host,"."),0)), \
 has_data=1 \
 | fields splunk_host, splunk_short, has_data] \
| eventstats values(eval(if(has_data==1, splunk_host, null()))) as all_splunk_hosts, \
 values(eval(if(has_data==1, splunk_short, null()))) as all_splunk_shorts, \
 values(eval(if(has_data==1, splunk_ip, null()))) as all_splunk_ips \
| where isnotnull(device_name) \
| eval matched=if( \
 (short_name IN (all_splunk_hosts)) \
 OR (short_name IN (all_splunk_shorts)) \
 OR (ip IN (all_splunk_ips)) \
 OR (ip IN (all_splunk_hosts)) \
 OR (lower(device_name) IN (all_splunk_hosts)) \
 OR (lower(device_name) IN (all_splunk_shorts)) \
 , 1, 0) \
| eval data_status=if(matched==1, "Sending Data", "NO DATA") \
| table device_name, device_family, device_role, platform_id, location, ip_address, health_score, management_source, data_status \
| sort data_status, device_family, location, device_name


# ======================================================================
# Live Network Topology (cisco:dnac:devicehealth + Excel Inventory)
# ======================================================================

[IT - Critical Systems - ds_topology_site_role]
description = Live network topology — builds a site-to-device-role hierarchy from Catalyst Center device health data for the linkgraph visualization.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| stats latest(DeviceRole) as DeviceRole, latest(Site) as Site by DeviceName \
| eval role_order=case(DeviceRole=="CORE",1, DeviceRole=="DISTRIBUTION",2, DeviceRole=="ACCESS",3, DeviceRole=="AP",4, DeviceRole=="WIRELESS_CONTROLLER",2, DeviceRole=="ROUTER",1, DeviceRole=="BORDER ROUTER",1, 1==1,5), role_label=case(DeviceRole=="CORE","Core", DeviceRole=="DISTRIBUTION","Distribution", DeviceRole=="ACCESS","Access", DeviceRole=="AP","AP", DeviceRole=="WIRELESS_CONTROLLER","WLC", DeviceRole=="ROUTER","Router", DeviceRole=="BORDER ROUTER","Border Router", 1==1,DeviceRole) \
| stats dc(DeviceName) as count, values(DeviceName) as devices by Site, role_label, role_order \
| sort Site, role_order \
| eval node=role_label." (".count.")", devices=mvjoin(devices, ", ") \
| table Site, node, count, role_label, devices

[IT - Critical Systems - ds_topology_linkgraph]
description = Live network topology linkgraph — creates source-target pairs showing the hierarchical relationship from sites through device roles for the splunk.linkgraph visualization.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| stats latest(DeviceRole) as DeviceRole, latest(Site) as Site by DeviceName \
| eval site_short=mvindex(split(Site,"/"),-1), role_label=case(DeviceRole=="ACCESS","Access", DeviceRole=="DISTRIBUTION","Distribution", DeviceRole=="CORE","Core", DeviceRole=="WIRELESS_CONTROLLER","WLC", DeviceRole=="AP","AP", DeviceRole=="ROUTER","Router", DeviceRole=="BORDER ROUTER","Border Router", isnotnull(DeviceRole),DeviceRole, 1==1,"Unknown") \
| stats dc(DeviceName) as count by site_short, role_label \
| eval source=site_short, target=role_label." (".count.")" \
| table source, target

[IT - Critical Systems - ds_topology_device_table]
description = Live device inventory from Catalyst Center — all managed devices with health, role, family, platform, site, IP, software version, uptime, and issue count.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| stats latest(DeviceFamily) as DeviceFamily, latest(DeviceRole) as DeviceRole, latest(Platform) as Platform, latest(Site) as Site, latest(IpAddress) as IpAddress, latest(MACAddress) as MACAddress, latest(SerialNumber) as SerialNumber, latest(DeviceImgVersion) as DeviceImgVersion, latest(OverallHealth) as OverallHealth, latest(CPUUtilization) as CPUUtilization, latest(MemoryUtilization) as MemoryUtilization, latest(IssueCount) as IssueCount, latest(Reachability) as Reachability, latest(Uptime) as Uptime by DeviceName \
| table DeviceName, DeviceFamily, DeviceRole, Platform, Site, IpAddress, MACAddress, SerialNumber, DeviceImgVersion, OverallHealth, CPUUtilization, MemoryUtilization, IssueCount, Reachability, Uptime \
| sort Site, DeviceRole, DeviceName \
| rename DeviceName as Device, DeviceFamily as Family, DeviceRole as Role, OverallHealth as Health, CPUUtilization as "CPU %", MemoryUtilization as "Mem %"

# ======================================================================
# Power Event & Infrastructure Resilience Detection
# ======================================================================

[IT - Critical Systems - ds_power_event_detection]
description = Correlated power event detection — identifies power blips by detecting simultaneous reload, link-down, and reconvergence syslog patterns across multiple devices within a short time window.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("%SYS-5-RELOAD" OR "%SYS-5-RESTART" OR "%SYS-5-CONFIG_I" OR "%PLATFORM_ENV-1-FAN" OR "%PLATFORM_ENV-6-BOARD" OR "%REDUNDANCY-5-SWITCHOVER" OR "%STACKMGR-6-STACK_LINK_CHANGE" OR "%SYS-6-LOGGINGHOST_STARTSTOP" OR "%SYS-2-MALLOCFAIL" OR "%PLATFORM-2-PEM_NOINPUT") \
| eval event_class=case(match(_raw,"RELOAD|RESTART"),"Reload/Restart", match(_raw,"PLATFORM_ENV|PEM_NOINPUT"),"Power/Environment", match(_raw,"REDUNDANCY|SWITCHOVER"),"Supervisor Switchover", match(_raw,"STACKMGR"),"Stack Change", match(_raw,"MALLOCFAIL"),"Memory Failure", match(_raw,"CONFIG_I"),"Post-Boot Config", match(_raw,"LOGGINGHOST"),"Logging Restart", 1==1,"Other") \
| stats count as events, dc(host) as affected_devices, values(host) as devices, earliest(_time) as first_event, latest(_time) as last_event by event_class \
| eval duration_sec=last_event-first_event, first_event=strftime(first_event,"%H:%M:%S"), last_event=strftime(last_event,"%H:%M:%S"), devices=mvjoin(devices,", ") \
| sort -events

[IT - Critical Systems - ds_power_event_timeline]
description = Power event timeline — minute-by-minute view of infrastructure events during and after a power blip for incident chronology reconstruction.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("%SYS-5-RELOAD" OR "%SYS-5-RESTART" OR "%LINEPROTO-5-UPDOWN" OR "%LINK-3-UPDOWN" OR "%LINK-5-CHANGED" OR "%OSPF-5-ADJCHG" OR "%EIGRP-5-NBRCHANGE" OR "%BGP-5-ADJCHANGE" OR "%STP-6-TOPOLOGY" OR "%REDUNDANCY-5-SWITCHOVER" OR "%STACKMGR" OR "%PLATFORM_ENV" OR "%SYS-6-LOGGINGHOST") \
| eval event_class=case(match(_raw,"RELOAD|RESTART"),"1-Reload", match(_raw,"PLATFORM_ENV|PEM"),"1-Power/Env", match(_raw,"LINK-3-UPDOWN|LINK-5-CHANGED"),"2-Link Down/Up", match(_raw,"LINEPROTO-5-UPDOWN"),"3-Protocol Down/Up", match(_raw,"OSPF|EIGRP|BGP"),"4-Routing Reconvergence", match(_raw,"STP-6-TOPOLOGY"),"5-STP Reconvergence", match(_raw,"REDUNDANCY|STACKMGR"),"2-HA/Stack Change", match(_raw,"LOGGINGHOST"),"6-Recovery", 1==1,"7-Other") \
| timechart span=1m count by event_class

[IT - Critical Systems - ds_link_flap_storm]
description = Link flap storm detection — counts interface up/down events per device to identify power-related mass link state changes vs isolated port issues.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("%LINEPROTO-5-UPDOWN" OR "%LINK-3-UPDOWN" OR "%LINK-5-CHANGED") \
| rex "Interface (?<interface>\S+)" \
| stats count as flap_count, dc(interface) as intf_count, earliest(_time) as first_flap, latest(_time) as last_flap by host \
| eval duration_sec=round(last_flap-first_flap,0), first_flap=strftime(first_flap,"%H:%M:%S"), last_flap=strftime(last_flap,"%H:%M:%S"), flaps_per_min=if(duration_sec>0,round(flap_count/(duration_sec/60),1),flap_count), event_type=if(intf_count>5 AND duration_sec<120,"Power Event (mass flap)","Isolated Flap") \
| sort -flap_count

[IT - Critical Systems - ds_routing_reconvergence]
description = Routing protocol reconvergence events — OSPF, EIGRP, and BGP neighbor changes that follow a power event, showing the recovery timeline.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("%OSPF-5-ADJCHG" OR "%EIGRP-5-NBRCHANGE" OR "%BGP-5-ADJCHANGE" OR "%BGP-3-NOTIFICATION") \
| eval protocol=case(match(_raw,"OSPF"),"OSPF", match(_raw,"EIGRP"),"EIGRP", match(_raw,"BGP"),"BGP"), state=if(match(_raw,"(?i)up|FULL|established|adjacency"),"Up","Down") \
| stats count as events, count(eval(state=="Down")) as down_events, count(eval(state=="Up")) as up_events, earliest(_time) as first_event, latest(_time) as last_event by host, protocol \
| eval recovery_sec=round(last_event-first_event,0), first_event=strftime(first_event,"%H:%M:%S"), last_event=strftime(last_event,"%H:%M:%S") \
| sort -events

[IT - Critical Systems - ds_stp_reconvergence]
description = STP topology change events after power blip — counts topology changes per device/VLAN indicating spanning-tree reconvergence.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("%STP-6-TOPOLOGY" OR "%SPANTREE-2-ROOTCHANGE" OR "%SPANTREE-6-ROOTCHANGE" OR "%SPANTREE-2-BLOCK_BPDUGUARD") \
| rex "VLAN(?<vlan_id>\d+)" \
| stats count as topology_changes, dc(vlan_id) as vlans_affected, earliest(_time) as first_event, latest(_time) as last_event by host \
| eval duration_sec=round(last_event-first_event,0), first_event=strftime(first_event,"%H:%M:%S"), last_event=strftime(last_event,"%H:%M:%S") \
| sort -topology_changes

[IT - Critical Systems - ds_power_event_summary]
description = Power event summary — single-row KPI showing total affected devices, total events, and time to recovery for the alert strip.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("%SYS-5-RELOAD" OR "%SYS-5-RESTART" OR "%PLATFORM_ENV" OR "%REDUNDANCY-5-SWITCHOVER" OR "%STACKMGR" OR "%SYS-2-MALLOCFAIL" OR "%PLATFORM-2-PEM_NOINPUT") \
| stats count as power_events, dc(host) as affected_devices, earliest(_time) as first_event, latest(_time) as last_event \
| eval time_span_min=round((last_event-first_event)/60,1), first_event=strftime(first_event,"%Y-%m-%d %H:%M:%S"), last_event=strftime(last_event,"%Y-%m-%d %H:%M:%S") \
| fillnull value=0 power_events, affected_devices

[IT - Critical Systems - ds_power_outage_history]
description = Power outage history over 30 days — counts distinct power events per day using a transaction-based approach to cluster related syslog messages into discrete incidents. Use as evidence for the power provider.
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("%SYS-5-RELOAD" OR "%SYS-5-RESTART" OR "%PLATFORM_ENV" OR "%REDUNDANCY-5-SWITCHOVER" OR "%STACKMGR" OR "%SYS-2-MALLOCFAIL" OR "%PLATFORM-2-PEM_NOINPUT") \
| bin _time span=10m \
| stats count as events, dc(host) as affected_devices, values(host) as devices by _time \
| where affected_devices>=2 \
| eval date=strftime(_time,"%Y-%m-%d"), time=strftime(_time,"%H:%M"), severity=case(affected_devices>=10,"Major",affected_devices>=5,"Moderate",1==1,"Minor"), devices=mvjoin(devices,", ") \
| table date, time, severity, affected_devices, events, devices \
| sort -date, -time

[IT - Critical Systems - ds_power_outage_trend]
description = Power outage frequency trend — daily count of power incidents over 30 days to track provider reliability and validate remediation claims.
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("%SYS-5-RELOAD" OR "%SYS-5-RESTART" OR "%PLATFORM_ENV" OR "%REDUNDANCY-5-SWITCHOVER" OR "%STACKMGR" OR "%SYS-2-MALLOCFAIL" OR "%PLATFORM-2-PEM_NOINPUT") \
| bin _time span=10m \
| stats dc(host) as affected_devices by _time \
| where affected_devices>=2 \
| eval incident=1 \
| timechart span=1d sum(incident) as power_incidents, max(affected_devices) as max_devices_affected

[IT - Critical Systems - ds_power_impact_report]
description = Power impact report — aggregates all power events into a provider-ready summary showing total incidents, total downtime minutes, affected device hours, and worst incident severity over 30 days.
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("%SYS-5-RELOAD" OR "%SYS-5-RESTART" OR "%PLATFORM_ENV" OR "%REDUNDANCY-5-SWITCHOVER" OR "%STACKMGR" OR "%SYS-2-MALLOCFAIL" OR "%PLATFORM-2-PEM_NOINPUT") \
| bin _time span=10m \
| stats count as events, dc(host) as affected_devices, earliest(_time) as start, latest(_time) as end by _time \
| where affected_devices>=2 \
| eval duration_min=round((end-start)/60,1), device_impact_min=duration_min*affected_devices \
| stats count as total_incidents, sum(duration_min) as total_downtime_min, sum(device_impact_min) as total_device_impact_min, max(affected_devices) as worst_incident_devices, avg(affected_devices) as avg_devices_per_incident, avg(duration_min) as avg_duration_min \
| eval avg_devices_per_incident=round(avg_devices_per_incident,1), avg_duration_min=round(avg_duration_min,1), total_downtime_min=round(total_downtime_min,1), total_device_impact_min=round(total_device_impact_min,0)

[IT - Critical Systems - ds_compliance_report]
description = Non-compliant device report from Catalyst Center — details the compliance type(s) failing per device with platform, version, uptime, and reachability context for remediation prioritization.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:compliance" ComplianceStatus=NON_COMPLIANT ComplianceDetail=True \
| stats dc(ComplianceComplianceType) as type_count, values(ComplianceComplianceType) as compliance_types, latest(IpAddress) as ip, latest(Platform) as platform, latest(DeviceSeries) as series, latest(DeviceFamily) as family, latest(DeviceRole) as role, latest(ImageVersion) as version, latest(Uptime) as uptime, latest(Manageability) as manageability, latest(Reachability) as reachability by DeviceName \
| eval compliance_types=mvjoin(compliance_types,", ") \
| sort -type_count \
| rename DeviceName as "Device Name", ip as "IP Address", compliance_types as "Compliance Types", type_count as "Type Count", platform as Platform, series as "Device Series", family as "Device Family", role as "Device Role", version as "Image Version", uptime as Uptime, manageability as Manageability, reachability as Reachability

# ======================================================================
# Catalyst Center Reports — Executive Summary (cc_executive_summary)
# ======================================================================

[Executive Summary - ds_network_health_by_site]
description = Network device health percentage by site with device-category breakdown (Switch/Router/AP/Wireless) for lowest/highest site ranking tables.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| where Site!="" \
| stats latest(Reachability) as Reachability, latest(Manageability) as Manageability, latest(DeviceFamily) as DeviceFamily by DeviceID, Site \
| eval healthy=if(Reachability=="Reachable" AND match(Manageability,"^Managed"), 1, 0), cat=case(match(DeviceFamily,"(?i)switch"),"Switch", match(DeviceFamily,"(?i)router"),"Router", match(DeviceFamily,"(?i)ap|access.point|unified.ap"),"Wireless", 1==1,"Third Party") \
