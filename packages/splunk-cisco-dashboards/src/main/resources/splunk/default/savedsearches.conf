[Asset Inventory - Build Lookup]
description = Builds the unified asset inventory lookup by correlating devices from Catalyst Center, Meraki, IOS syslog, ASA/FTD/Firepower, ISE NADs, F5 BIG-IP, and Windows/AD. Deduplicates by device_name (lowercase), preferring the richest source. Adds device_name_short for FQDN-vs-short matching. Outputs to asset_inventory.csv.
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 5 2 * * *
enableSched = 1
allow_skew = 5m
dispatch.ttl = 90000
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| stats latest(DeviceFamily) as device_family, latest(DeviceType) as device_type_raw, latest(Platform) as platform_id, latest(IpAddress) as ip_address, latest(MACAddress) as mac_address, latest(DeviceImgVersion) as software_version, latest(SerialNumber) as serial_number, latest(Reachability) as reachability, latest(Manageability) as manageability, latest(DeviceRole) as device_role, latest(DeviceSeries) as device_series, latest(Site) as location by DeviceName \
| rename DeviceName as device_name \
| eval management_source="Catalyst Center", device_type=case(device_family=="Unified AP" OR device_family=="Access Points","AP", device_family=="Switches and Hubs","Switch", device_family=="Wireless Controller","WLC", device_family=="Routers","Router", 1==1,device_family), health_score=case(reachability=="Reachable" AND match(manageability,"^Managed"),100, reachability=="Reachable",50, 1==1,0), last_seen=now() \
| append \
 [| search `index_catalyst` sourcetype="cisco:dnac:compliance" \
 | stats latest(ComplianceStatus) as compliance_status by ComplianceDeviceID DeviceName \
 | rename DeviceName as device_name \
 | fields _time, device_name compliance_status] \
| stats latest(_time) as _time, latest(device_type) as device_type, latest(device_family) as device_family, latest(device_type_raw) as device_type_raw, latest(platform_id) as platform_id, latest(ip_address) as ip_address, latest(mac_address) as mac_address, latest(software_version) as software_version, latest(serial_number) as serial_number, latest(health_score) as health_score, latest(compliance_status) as compliance_status, latest(management_source) as management_source, latest(device_role) as device_role, latest(device_series) as device_series, latest(location) as location, latest(last_seen) as last_seen by device_name \
| append \
 [| search `index_meraki` sourcetype="meraki:devicesavailabilitieschangehistory" \
 | stats latest(device.model) as platform_id, latest(device.productType) as meraki_type, latest(network.name) as location by device.serial device.name \
 | rename device.serial as serial_number, device.name as device_name \
 | where len(device_name)>0 \
 | eval management_source="Meraki Dashboard", device_family=case(meraki_type=="wireless","Meraki Wireless", meraki_type=="switch","Meraki Switch", meraki_type=="appliance","Meraki Appliance", meraki_type=="cellularGateway","Meraki Cellular Gateway", meraki_type=="sensor","Meraki Sensor", 1==1,"Meraki ".meraki_type), device_type=case(meraki_type=="wireless","AP", meraki_type=="switch","Switch", meraki_type=="appliance","Firewall", meraki_type=="cellularGateway","Gateway", meraki_type=="sensor","Sensor", 1==1,meraki_type), last_seen=now() \
 | fields device_name device_type device_family platform_id serial_number location management_source last_seen] \
| append \
 [| search `index_network` sourcetype="cisco:ios" \
 | rex "^\d+/\d+/\d+\s+\d+:\d+:\d+\s+(?<device_name>[\w\-\.]+)" \
 | where device_name!="AP" \
 | stats count by device_name \
 | eval management_source="IOS Syslog", device_type=case(match(device_name,"(?i)rtr|router"),"Router", match(device_name,"(?i)swi|switch|sw\d"),"Switch", match(device_name,"(?i)wlc|wireless"),"WLC", 1==1,"Network Device"), device_family="IOS Device", last_seen=now() \
 | fields device_name device_type device_family management_source last_seen] \
| append \
 [| tstats `summariesonly` count from datamodel=Network_Traffic by All_Traffic.dvc \
 | rename "All_Traffic.dvc" as device_name \
 | eval device_name=lower(device_name) \
 | where isnotnull(device_name) AND device_name!="" AND NOT match(device_name, "^[0-9a-f]{8}-[0-9a-f]{4}-") \
 | stats count by device_name \
 | eval management_source="Firewall Syslog", device_type="Firewall", device_family="ASA/FTD/Firepower", last_seen=now() \
 | fields device_name device_type device_family management_source last_seen] \
| append \
 [| search `index_identity` sourcetype="cisco:ise:syslog" \
 | rex "NetworkDeviceName=(?<device_name>[^,]+)" \
 | where isnotnull(device_name) AND device_name!="DefaultNetworkDevice" \
 | stats count by device_name \
 | eval management_source="ISE NAD", device_type=case(match(device_name,"(?i)wlc|wireless"),"WLC", match(device_name,"(?i)sw|switch"),"Switch", match(device_name,"(?i)rtr|router"),"Router", match(device_name,"(?i)fw|asa|vpn"),"Firewall", 1==1,"Network Device"), device_family="ISE Network Access Device", last_seen=now() \
 | fields device_name device_type device_family management_source last_seen] \
| append \
 [| search `index_f5` sourcetype="f5:bigip:management:device:icontrol" \
 | stats latest(hostname) as device_name, latest(managementIp) as ip_address, latest(version) as software_version, latest(marketingName) as device_series, latest(platform) as platform_id by name \
 | eval device_name=if(isnotnull(device_name),device_name,name), management_source="F5 iControl", device_type="Load Balancer", device_family="F5 BIG-IP", last_seen=now() \
 | fields device_name device_type device_family platform_id ip_address software_version device_series management_source last_seen] \
| append \
 [| search `index_windows` (sourcetype="XmlWinEventLog" OR sourcetype="ActiveDirectory" OR sourcetype="MSAD:NT6:DNS") \
 | stats count by host \
 | rename host as device_name \
 | eval management_source="Windows/AD", device_type="Server", device_family="Windows Server", last_seen=now() \
 | fields device_name device_type device_family management_source last_seen] \
| append \
 [| search `index_dhcp` sourcetype="DhcpSrvLog" \
 | stats count by host \
 | rename host as device_name \
 | eval management_source="Windows DHCP", device_type="Server", device_family="DHCP Server", last_seen=now() \
 | fields device_name device_type device_family management_source last_seen] \
| eventstats values(management_source) as all_sources by device_name \
| eval management_source=mvjoin(all_sources, ", "), source_priority=case(match(management_source,"Catalyst Center"),1, match(management_source,"Meraki"),2, match(management_source,"F5"),3, match(management_source,"Firewall Syslog"),4, match(management_source,"IOS Syslog"),5, match(management_source,"ISE"),6, 1==1,7) \
| sort 0 source_priority \
| stats first(*) as * by device_name \
| eval device_name=lower(device_name), device_name_short=lower(if(match(device_name,"^[^\.]+\.[a-zA-Z]"),replace(device_name,"\..*$",""),device_name)), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S") \
| table device_name device_name_short device_type device_family platform_id ip_address mac_address software_version serial_number location device_role device_series health_score compliance_status management_source last_seen \
| sort device_type device_name \
| outputlookup asset_inventory CreateInApp=true Create_Empty=true Override_If_Empty=false

# ======================================================================
# P1 — Security Resilience Additions (security)
# ======================================================================

[Security Resilience - ds_ips_severity_distribution]
description = IPS/IDS intrusion events grouped by impact level and priority from eStreamer data for the severity distribution visualization.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_firewall` sourcetype="cisco:sfw:estreamer" EventType="IntrusionEvent" \
| eval impact=coalesce(ImpactFlag, Impact, "Unknown"), priority=coalesce(Priority, "Unknown") \
| stats count by impact, priority \
| sort -count

[Security Resilience - ds_repeated_blocked_sources]
description = Top source IPs with 20+ blocked firewall connections indicating possible scanning or persistent threat actor activity.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats `summariesonly` count from datamodel=Network_Traffic where All_Traffic.action="blocked" BY All_Traffic.src \
| rename All_Traffic.src as src \
| where count > 50 \
| sort -count \
| head 20 \
| rename src as "Source IP", count as "Blocked Connections"

[Security Resilience - ds_ssh_activity]
description = SSH connection activity — top source IPs initiating SSH sessions through the firewall.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats `summariesonly` count from datamodel=Network_Traffic where All_Traffic.dest_port=22 BY All_Traffic.src, All_Traffic.dest, _time span=1h \
| rename All_Traffic.src as src, All_Traffic.dest as dest \
| stats count, dc(dest) as dest_count by src \
| sort -count \
| head 20 \
| rename src as "Source", dest_count as "Unique Destinations", count as "Sessions"

[Security Resilience - ds_data_exfil_indicators]
description = Potential data exfiltration — internal hosts with abnormally high outbound byte volume (>100 MB) from firewall connection logs.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_firewall` (sourcetype="cisco:asa" OR sourcetype="cisco:ftd") \
| eval src=coalesce(src_ip, src), bytes_out=coalesce(bytes_out, bytes, 0) \
| where isnotnull(src) AND bytes_out > 0 \
| stats sum(bytes_out) as total_bytes, count as connections, dc(dest_ip) as unique_dests by src \
| eval total_mb=round(total_bytes/1048576, 2) \
| where total_mb > 100 \
| sort -total_mb \
| rename src as "Source IP", total_mb as "Total MB", connections as "Connections", unique_dests as "Unique Destinations"

[Security Resilience - ds_severity_by_host]
description = IOS syslog severity distribution by host — Critical, Error, Warning, Info event counts per network device enriched with asset inventory for quick triage.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" \
| rex "%(?<facility>[A-Z_]+)-(?<severity_id>\d+)-(?<mnemonic>[A-Z_]+)" \
| eval severity=case(severity_id<=2,"Critical", severity_id==3,"Error", severity_id<=5,"Warning", 1==1,"Info") \
| stats count by host, severity \
| eval host=lower(host) \
| lookup asset_inventory device_name as host OUTPUT device_type, location \
| sort -count

# ======================================================================
# P1 — IT - Critical Systems Additions (it_health)
# ======================================================================

[IT - Critical Systems - ds_port_flapping]
description = Port flapping detection — interfaces cycling up/down 3+ times from IOS syslog LINK-3-UPDOWN and LINEPROTO events, enriched with asset data.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("%LINK-3-UPDOWN" OR "%LINEPROTO-5-UPDOWN") \
| rex "Interface (?<interface>\S+)" \
| stats count as state_changes, earliest(_time) as first_seen, latest(_time) as last_seen by host, interface \
| where state_changes >= 3 \
| eval host=lower(host), first_seen=strftime(first_seen, "%H:%M:%S"), last_seen=strftime(last_seen, "%H:%M:%S") \
| sort -state_changes \
| lookup asset_inventory device_name as host OUTPUT device_type, location \
| fields host interface state_changes first_seen last_seen device_type location

[IT - Critical Systems - ds_route_flapping]
description = Routing protocol neighbor state changes — OSPF, EIGRP, BGP, LDP, IS-IS flap events from IOS syslog indicating network instability.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("%OSPF-" OR "%EIGRP-" OR "%BGP-" OR "%LDP-" OR "%ISIS-") \
| rex "%(?<facility>[A-Z_]+)-(?<severity_id>\d+)-(?<mnemonic>[A-Z_]+)" \
| eval routing_protocol=case(match(facility,"OSPF"),"OSPF", match(facility,"EIGRP"),"EIGRP", match(facility,"BGP"),"BGP", match(facility,"LDP"),"LDP", match(facility,"ISIS"),"IS-IS", 1==1,facility) \
| stats count as events, dc(host) as devices by routing_protocol, mnemonic \
| sort -events

[IT - Critical Systems - ds_stp_mac_flapping]
description = Spanning tree and MAC flapping — STP topology changes and MAC address move events from IOS syslog indicating Layer 2 instability.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("%SPANTREE-" OR "%SW_MATM-" OR "%MAC_MOVE-" OR "mac flap") \
| rex "%(?<facility>[A-Z_]+)-(?<severity_id>\d+)-(?<mnemonic>[A-Z_]+)" \
| eval event_type=case(match(mnemonic,"ROOT"),"STP Root Change", match(mnemonic,"TOPOTRAP"),"STP Topology Change", match(mnemonic,"BLOCK"),"STP Blocked", match(facility,"MATM") OR match(_raw,"mac flap"),"MAC Flap", 1==1, mnemonic) \
| stats count by host, event_type \
| eval host=lower(host) \
| sort -count \
| lookup asset_inventory device_name as host OUTPUT device_type, location \
| fields host event_type count device_type location

[IT - Critical Systems - ds_ntp_drift]
description = NTP time drift detection — compares event timestamp vs device-reported time to identify clocks drifting beyond 5 seconds.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" \
| rex "^(?<raw_ts>\w+\s+\d+\s+\d{4}\s+\d+:\d+:\d+)" \
| where isnotnull(raw_ts) \
| eval device_time=strptime(raw_ts, "%b %d %Y %H:%M:%S") \
| where isnotnull(device_time) \
| eval drift_sec=abs(_time - device_time) \
| stats avg(drift_sec) as avg_drift, max(drift_sec) as max_drift, count by host \
| where avg_drift > 5 \
| eval host=lower(host), avg_drift=round(avg_drift, 1), max_drift=round(max_drift, 1) \
| sort -avg_drift \
| lookup asset_inventory device_name as host OUTPUT device_type, location \
| fields host avg_drift max_drift count device_type location

[IT - Critical Systems - ds_config_change_transactions]
description = IOS configuration change transactions — correlates config start events with logged commands by user, host, and source IP.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("SYS-5-CONFIG_I" OR "PARSER-5-CFGLOG_LOGGEDCMD" OR "ARCHIVE-5-CONFIG_STARTED") \
| eval config_event=case(match(_raw,"CONFIG_I") OR match(_raw,"CONFIG_STARTED"),"config_start", match(_raw,"CFGLOG_LOGGEDCMD"),"command", 1==1,"other") \
| rex "User:(?<user>\S+)" \
| rex "by (?<user2>\S+) on " \
| rex "(?<command>configured .+)" \
| eval user=coalesce(user, user2, "unknown") \
| stats count as commands, latest(_time) as last_change, values(command) as changes by host, user \
| eval host=lower(host), last_change=strftime(last_change, "%Y-%m-%d %H:%M:%S"), changes=mvjoin(changes, " | ") \
| sort -last_change \
| lookup asset_inventory device_name as host OUTPUT device_type, location \
| fields host user commands last_change changes device_type location

[IT - Critical Systems - ds_error_disabled_interfaces]
description = Error-disabled interfaces — ports shut down due to security violations, BPDU guard, or port security triggers from IOS syslog.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("%PM-4-ERR_DISABLE" OR "%ILPOWER-" OR "err-disabled") \
| rex "Interface (?<interface>\S+)" \
| rex "cause (?<cause>\S+)" \
| stats count, latest(_time) as last_seen, values(cause) as causes by host, interface \
| eval host=lower(host), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M"), causes=mvjoin(causes, ", ") \
| sort -last_seen \
| lookup asset_inventory device_name as host OUTPUT device_type, location \
| fields host interface causes count last_seen device_type location

# ======================================================================
# P1 — Executive Dashboard Trend Comparisons (home_launchpad)
# ======================================================================

[Executive Dashboard - ds_security_trend_compare]
description = Security posture trend — current vs previous period unique failed auth users with percentage change for the trend indicator.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats `summariesonly` dc(Authentication.user) as count from datamodel=Authentication where Authentication.action="failure" \
| eval period="current" \
| append \
 [| tstats `summariesonly` dc(Authentication.user) as count from datamodel=Authentication where Authentication.action="failure" \
 | eval period="previous"] \
| stats sum(count) as count by period \
| stats sum(eval(if(period=="current",count,0))) as current, sum(eval(if(period=="previous",count,0))) as previous \
| eval delta=if(previous>0, round((current-previous)/previous*100, 1), 0), direction=case(delta>0, "↑", delta<0, "↓", 1==1, "—")

[Executive Dashboard - ds_fw_blocked_trend_compare]
description = Firewall blocked connections trend — current vs previous period unique connection count with percentage change.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats `summariesonly` count from datamodel=Network_Traffic where All_Traffic.action="blocked" by All_Traffic.src, All_Traffic.dest, All_Traffic.dest_port \
| stats count as count \
| eval period="current" \
| append \
 [| tstats `summariesonly` count from datamodel=Network_Traffic where All_Traffic.action="blocked" by All_Traffic.src, All_Traffic.dest, All_Traffic.dest_port \
 | stats count as count \
 | eval period="previous"] \
| stats sum(count) as count by period \
| stats sum(eval(if(period=="current",count,0))) as current, sum(eval(if(period=="previous",count,0))) as previous \
| eval delta=if(previous>0, round((current-previous)/previous*100, 1), 0), direction=case(delta>0, "↑", delta<0, "↓", 1==1, "—")

[Executive Dashboard - ds_network_health_trend_compare]
description = Network health trend — current vs previous period average health score with delta change from Catalyst Center.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:networkhealth" category="All" \
| eval period="current" \
| append \
 [| search `index_catalyst` sourcetype="cisco:dnac:networkhealth" category="All" \
 | eval period="previous"] \
| stats avg(healthScore) as score by period \
| stats sum(eval(if(period=="current",score,0))) as current, sum(eval(if(period=="previous",score,0))) as previous \
| eval current=round(current), previous=round(previous), delta=current-previous, direction=case(delta>0, "↑", delta<0, "↓", 1==1, "—")

[Executive Dashboard - ds_device_health_trend_compare]
description = Device health trend — current vs previous period average device health score with delta change.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| stats latest(Reachability) as Reachability, latest(Manageability) as Manageability by DeviceID \
| eval h=case(Reachability=="Reachable" AND match(Manageability,"^Managed"),100, Reachability=="Reachable",50, 1==1,0), period="current" \
| append \
 [| search `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
 | stats latest(Reachability) as Reachability, latest(Manageability) as Manageability by DeviceID \
 | eval h=case(Reachability=="Reachable" AND match(Manageability,"^Managed"),100, Reachability=="Reachable",50, 1==1,0), period="previous"] \
| stats avg(h) as score by period \
| stats sum(eval(if(period=="current",score,0))) as current, sum(eval(if(period=="previous",score,0))) as previous \
| eval current=round(current), previous=round(previous), delta=current-previous, direction=case(delta>0, "↑", delta<0, "↓", 1==1, "—")

# ======================================================================
# P2 — Network Intelligence
# ======================================================================

[Network Intelligence - ds_blocked_vs_allowed]
description = Firewall traffic action summary — total blocked and allowed connection counts for the action split visualization.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats `summariesonly` count from datamodel=Network_Traffic BY All_Traffic.action \
| rename All_Traffic.action as action \
| eval action=case(match(action,"(?i)block|deny|drop"),"Blocked", 1==1,"Allowed") \
| stats sum(count) as count by action

[Network Intelligence - ds_traffic_by_action_trend]
description = Firewall traffic trend by action — hourly timechart of blocked vs allowed connections.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats `summariesonly` count from datamodel=Network_Traffic BY _time span=1h All_Traffic.action \
| rename All_Traffic.action as fw_action \
| eval fw_action=case(match(fw_action,"(?i)block|deny|drop"),"Blocked", 1==1,"Allowed") \
| timechart span=1h sum(count) as count by fw_action

[Network Intelligence - ds_external_sources]
description = Top external (non-RFC1918) source IPs hitting the firewall with geographic enrichment.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats `summariesonly` count, dc(All_Traffic.dest) as unique_dests from datamodel=Network_Traffic BY All_Traffic.src \
| rename All_Traffic.src as src \
| where NOT cidrmatch("10.0.0.0/8", src) AND NOT cidrmatch("172.16.0.0/12", src) AND NOT cidrmatch("192.168.0.0/16", src) \
| sort -count \
| head 20 \
| rename src as "Source IP", unique_dests as "Unique Destinations"

[Network Intelligence - ds_traffic_by_protocol]
description = Firewall traffic distribution by transport protocol — TCP, UDP, ICMP volume breakdown.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats `summariesonly` count from datamodel=Network_Traffic BY All_Traffic.transport \
| rename All_Traffic.transport as protocol \
| eval protocol=upper(protocol) \
| sort -count

[Network Intelligence - ds_geo_blocked_traffic]
description = Geo-mapped blocked firewall connections — external source IPs with geographic coordinates for the world map.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats `summariesonly` count from datamodel=Network_Traffic where All_Traffic.action="blocked" BY All_Traffic.src \
| rename All_Traffic.src as src \
| where isnotnull(src) AND NOT cidrmatch("10.0.0.0/8", src) AND NOT cidrmatch("172.16.0.0/12", src) AND NOT cidrmatch("192.168.0.0/16", src) \
| iplocation src \
| where isnotnull(lat) \
| geostats sum(count) as count by Country

[Network Intelligence - ds_top_countries_blocked]
description = Top countries by blocked firewall connections — ranks source countries of denied external traffic.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats `summariesonly` count from datamodel=Network_Traffic where All_Traffic.action="blocked" BY All_Traffic.src \
| rename All_Traffic.src as src \
| where isnotnull(src) AND NOT cidrmatch("10.0.0.0/8", src) AND NOT cidrmatch("172.16.0.0/12", src) AND NOT cidrmatch("192.168.0.0/16", src) \
| iplocation src \
| stats sum(count) as count by Country \
| sort -count

[Network Intelligence - ds_top_talkers]
description = Top communication pairs by connection volume for network flow analysis.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_firewall` (sourcetype="cisco:asa" OR sourcetype="cisco:ftd" OR sourcetype="cisco:sfw:estreamer") \
| eval src=coalesce(src_ip, src), dest=coalesce(dest_ip, dest, dst) \
| where isnotnull(src) AND isnotnull(dest) \
| stats count as connections by src, dest \
| sort -connections \
| head 20 \
| rename src as "Source IP", dest as "Destination IP", connections as "Connections"

[Network Intelligence - ds_top_blocked_ports]
description = Top destination ports targeted by blocked traffic with common service name mapping.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats `summariesonly` count from datamodel=Network_Traffic where All_Traffic.action="blocked" BY All_Traffic.dest_port \
| rename All_Traffic.dest_port as dest_port \
| sort -count \
| head 10 \
| rename dest_port as "Destination Port"

[Network Intelligence - ds_traffic_volume_trend]
description = Firewall traffic volume trend — hourly total connection count for the traffic volume timeline.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats `summariesonly` count as connections from datamodel=Network_Traffic BY _time span=1h

# ======================================================================
# P2 — ESCU-Aligned Alert Searches
# ======================================================================

[ESCU Alert - ASA Logging Disabled]
description = Detects ASA logging being disabled via CLI — a common attacker technique to cover tracks after gaining firewall access.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_firewall` sourcetype="cisco:asa" ("no logging enable" OR "%ASA-5-111010" OR "logging disabled") \
| eval src=coalesce(src_ip, src, host) \
| stats count, latest(_time) as last_seen, values(user) as users by src \
| eval last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S"), users=mvjoin(users, ", ") \
| sort -last_seen \
| rename src as Source, count as Events, last_seen as "Last Seen", users as Users

[ESCU Alert - ASA Privilege Escalation]
description = Detects ASA privilege level changes — enable mode access and privilege level modifications that may indicate unauthorized escalation.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_firewall` sourcetype="cisco:asa" ("%ASA-5-502103" OR "%ASA-6-605005" OR "%ASA-5-111008" OR "Priv" OR "enable_15") \
| rex "User '(?<user>[^']+)'" \
| rex "Priv\s*(?<priv_level>\d+)" \
| stats count, latest(_time) as last_seen, values(user) as users by host \
| eval last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S"), users=mvjoin(users, ", ") \
| sort -last_seen \
| lookup asset_inventory device_name as host OUTPUT device_type, location

[ESCU Alert - ASA Recon Commands]
description = Detects reconnaissance commands on ASA (show run, show crypto, show access-list) — may indicate attacker enumeration of firewall configuration.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_firewall` sourcetype="cisco:asa" ("%ASA-5-111008" OR "%ASA-5-111010") \
| rex "User '(?<user>[^']+)'" \
| rex "CLI command '(?<command>[^']+)'" \
| where match(command, "(?i)show run|show crypto|show access-list|show conn|show xlate|show vpn") \
| stats count, values(command) as commands, latest(_time) as last_seen by host, user \
| eval last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S"), commands=mvjoin(commands, " | ") \
| sort -last_seen

[ESCU Alert - FW Repeated Blocked Connections]
description = Brute-force indicator — source IPs with 50+ blocked connections, suggesting scanning or brute-force activity, with geo-enrichment and risk rating.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_firewall` (sourcetype="cisco:asa" OR sourcetype="cisco:ftd" OR sourcetype="cisco:sfw:estreamer") (action="blocked" OR action="Block" OR action="Deny" OR "denied") \
| eval src=coalesce(src_ip, src), dest=coalesce(dest_ip, dest, dst), port=coalesce(dest_port, dst_port) \
| where isnotnull(src) \
| stats count as blocks, dc(dest) as targets, dc(port) as ports, earliest(_time) as first, latest(_time) as last by src \
| where blocks >= 50 \
| eval first=strftime(first, "%H:%M:%S"), last=strftime(last, "%H:%M:%S"), risk=case(blocks>=500,"Critical", blocks>=200,"High", blocks>=100,"Medium", 1==1,"Low") \
| sort -blocks \
| iplocation src \
| fields src Country blocks targets ports first last risk

[ESCU Alert - FW Compromised Host Indicators]
description = Potentially compromised internal hosts — internal IPs communicating with 50+ unique external destinations (possible C2 or exfiltration beaconing).
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_firewall` (sourcetype="cisco:asa" OR sourcetype="cisco:ftd") \
| eval src=coalesce(src_ip, src), dest=coalesce(dest_ip, dest, dst) \
| where isnotnull(src) AND isnotnull(dest) AND (cidrmatch("10.0.0.0/8", src) OR cidrmatch("172.16.0.0/12", src) OR cidrmatch("192.168.0.0/16", src)) AND NOT cidrmatch("10.0.0.0/8", dest) AND NOT cidrmatch("172.16.0.0/12", dest) AND NOT cidrmatch("192.168.0.0/16", dest) \
| stats count as connections, dc(dest) as unique_external_dests, dc(dest_port) as unique_ports by src \
| where unique_external_dests >= 50 \
| sort -unique_external_dests \
| eval risk=case(unique_external_dests>=200,"Critical", unique_external_dests>=100,"High", 1==1,"Medium") \
| rename src as "Source IP", connections as "Connections", unique_external_dests as "Unique External Dests", unique_ports as "Unique Ports", risk as "Risk"

[ESCU Alert - IOS Suspicious Account Creation]
description = Detects local privileged account creation (privilege 15) on IOS devices that may indicate unauthorized persistence.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("username" AND "privilege 15" AND "secret") \
| rex "username (?<new_user>\S+) privilege (?<priv_level>\d+)" \
| stats count, latest(_time) as last_seen, values(new_user) as accounts_created by host \
| eval host=lower(host), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S"), accounts_created=mvjoin(accounts_created, ", ") \
| sort -last_seen \
| lookup asset_inventory device_name as host OUTPUT device_type, location

[ESCU Alert - IOS SNMP Community Change]
description = Detects SNMP community string modifications on IOS — may indicate an attacker establishing a backdoor for network reconnaissance.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("snmp-server community" OR "%SNMP-5-COLDSTART" OR "snmp-server host") \
| rex "(?<snmp_cmd>snmp-server\s+\S+\s+\S+)" \
| stats count, latest(_time) as last_seen, values(snmp_cmd) as snmp_changes by host \
| eval host=lower(host), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S"), snmp_changes=mvjoin(snmp_changes, " | ") \
| sort -last_seen \
| lookup asset_inventory device_name as host OUTPUT device_type, location

[ESCU Alert - IOS Config Exfil via TFTP]
description = Detects TFTP/SCP/FTP copy commands on IOS that may indicate configuration exfiltration for credential harvesting.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("copy" AND ("tftp" OR "scp" OR "ftp")) \
| rex "copy (?<copy_src>\S+) (?<copy_dest>\S+)" \
| where match(copy_src, "(?i)running|startup|flash") OR match(copy_dest, "(?i)tftp|scp|ftp") \
| stats count, latest(_time) as last_seen, values(copy_src) as sources, values(copy_dest) as destinations by host \
| eval host=lower(host), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S") \
| sort -last_seen \
| lookup asset_inventory device_name as host OUTPUT device_type, location

# ======================================================================
# P2 — Asset Enrichment Searches
# ======================================================================

[Security Resilience - ds_assets_at_risk]
description = Destination IPs targeted by blocked/denied firewall events — top targets by event count for security incident triage.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_firewall` (sourcetype="cisco:asa" OR sourcetype="cisco:ftd" OR sourcetype="cisco:sfw:estreamer") (action="blocked" OR action="Block" OR action="Deny" OR "denied") \
| eval target_ip=coalesce(dest_ip, dest, dst) \
| where isnotnull(target_ip) \
| stats count as security_events, dc(src_ip) as unique_sources by target_ip \
| sort -security_events \
| head 20 \
| rename target_ip as "Target IP", security_events as "Security Events", unique_sources as "Unique Sources"

[IT - Critical Systems - ds_device_health_enriched]
description = Device health table enriched with asset inventory — combines Catalyst Center health with inventory metadata for comprehensive device status.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| stats latest(OverallHealth) as health, latest(Reachability) as reachability, latest(Manageability) as manageability, latest(IpAddress) as ip_address, latest(DeviceFamily) as family by DeviceName \
| eval health=health*10, status=case(reachability=="Reachable" AND match(manageability,"^Managed"),"Healthy", reachability=="Reachable","Degraded", 1==1,"Unreachable") \
| rename DeviceName as device_name \
| eval device_name_lc=lower(device_name) \
| lookup asset_inventory device_name as device_name_lc OUTPUT device_type, location, serial_number, software_version, compliance_status \
| sort status, -health \
| fields device_name family health status ip_address device_type location compliance_status software_version

# ======================================================================
# DHCP & Guest Network Capacity Monitoring
# ======================================================================

[IT - Critical Systems - ds_dhcp_pool_exhaustion]
description = DHCP pool exhaustion detection — monitors Windows DHCP server for NACK (event 15/16) and lease denial events indicating IP address shortage.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_dhcp` sourcetype="DhcpSrvLog" \
| rex "^(?<event_id>\d+),(?<date>[^,]+),(?<time>[^,]+),(?<description>[^,]*),(?<ip_address>[^,]+),(?<hostname>[^,]*),(?<mac_address>[^,]*)" \
| eval event_type=case(event_id=="13","IP In Use", event_id=="14","Lease Denied", event_id=="15","Range Exhausted", event_id=="16","Range Extended", 1==1,"Event ".event_id) \
| where event_id IN ("13","14","15","16") \
| stats dc(ip_address) as unique_ips, dc(mac_address) as unique_clients, count as events, earliest(_time) as first_seen, latest(_time) as last_seen by event_type \
| eval first_seen=strftime(first_seen, "%Y-%m-%d %H:%M"), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M") \
| sort -events \
| rename event_type as "Event", unique_ips as "Unique IPs", unique_clients as "Unique Clients", events as "Events", first_seen as "First Seen", last_seen as "Last Seen"

[IT - Critical Systems - ds_dhcp_lease_rate]
description = DHCP lease rate trend — hourly new lease and renewal counts from Windows DHCP to detect demand surges before pool exhaustion.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_dhcp` sourcetype="DhcpSrvLog" \
| rex "^(?<event_id>\d+)," \
| where event_id IN ("10","11","12") \
| eval event_type=case(event_id=="10","New Lease", event_id=="11","Renewal", event_id=="12","Release") \
| timechart span=1h count by event_type

[IT - Critical Systems - ds_dhcp_nack_trend]
description = DHCP NACK/denial trend over time — tracks lease denials and pool exhaustion events hourly to identify when capacity problems begin.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_dhcp` sourcetype="DhcpSrvLog" \
| rex "^(?<event_id>\d+)," \
| where event_id IN ("13","14","15","16") \
| timechart span=1h count as dhcp_failures

[IT - Critical Systems - ds_dhcp_scope_utilization]
description = DHCP scope utilization — estimates active leases vs releases per scope/subnet to calculate approximate pool usage percentage.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_dhcp` sourcetype="DhcpSrvLog" \
| rex "^(?<event_id>\d+),(?<date>[^,]+),(?<time>[^,]+),(?<description>[^,]*),(?<ip_address>[^,]+),(?<hostname>[^,]*),(?<mac_address>[^,]*)" \
| where event_id IN ("10","11","12") \
| eval scope=replace(ip_address, "\.\d+$", ".0/24") \
| stats count(eval(event_id=="10")) as new_leases, count(eval(event_id=="11")) as renewals, count(eval(event_id=="12")) as releases, dc(ip_address) as unique_ips by scope \
| eval active_estimate=new_leases+renewals-releases, utilization_warning=if(unique_ips>200, "HIGH - approaching /24 limit", if(unique_ips>150, "MEDIUM", "OK")) \
| sort -unique_ips

[IT - Critical Systems - ds_dhcp_ios_events]
description = Cisco IOS DHCP syslog events — pool exhaustion, address conflicts, and snooping violations from network switches and WLCs.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_network` sourcetype="cisco:ios" ("%DHCPD-" OR "%DHCP_SNOOPING-" OR "%DHCPD-4-POOL_EXHAUSTED" OR "%DHCPD-4-DECLINE_CONFLICT" OR "DHCP") \
| rex "%(?<facility>[A-Z_]+)-(?<severity_id>\d+)-(?<mnemonic>[A-Z_]+)" \
| eval event_type=case(match(mnemonic,"POOL_EXHAUSTED"),"Pool Exhausted", match(mnemonic,"DECLINE"),"Address Declined", match(mnemonic,"CONFLICT"),"Address Conflict", match(facility,"SNOOPING"),"Snooping Violation", 1==1,mnemonic) \
| stats count, latest(_time) as last_seen by host, event_type \
| eval host=lower(host), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S") \
| sort -count \
| lookup asset_inventory device_name as host OUTPUT device_type, location

[User Experience - ds_guest_client_surge]
description = Wireless client concurrency over time from Catalyst Center — monitors distinct client count in 30-minute buckets with capacity utilization thresholds.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:client" \
| where type="Wireless" \
| bucket _time span=30m \
| stats dc(macAddress) as concurrent_clients by _time \
| eval capacity_pct=round(concurrent_clients/3000*100, 1), status=case(concurrent_clients>=2500,"CRITICAL - pool near exhaustion", concurrent_clients>=2000,"WARNING - high utilization", concurrent_clients>=1500,"ELEVATED", 1==1,"OK") \
| sort -_time

[User Experience - ds_client_peak_by_ssid]
description = Peak concurrent client count by SSID/network over the last 24 hours for capacity planning — shows which wireless networks are most utilized.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:client" \
| stats latest(*) as * by macAddress \
| where type="Wireless" \
| stats dc(macAddress) as client_count by connection.ssid \
| sort -client_count

[User Experience - ds_ise_guest_auth_rate]
description = ISE guest portal authentication rate — monitors guest registration and authentication volume over time to detect demand surges.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_identity` sourcetype="cisco:ise:syslog" ("5200" OR "5400") \
| rex "NetworkDeviceGroupName=(?<device_group>[^,]+)" \
| eval is_guest=if(match(_raw,"(?i)guest|visitor|lobby|sponsor"), 1, 0), result=if(match(_raw,"5200"), "Pass", "Fail") \
| where is_guest=1 OR match(device_group,"(?i)guest") \
| timechart span=30m count by result

[User Experience - ds_client_count_trend]
description = Total connected client count trend (wired + wireless) from Catalyst Center over 24 hours for capacity planning and historical baseline.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:clienthealth" clientType="ALL" scoreType="ALL" \
| timechart span=30m latest(clientCount) as total_clients \
| eval threshold_1000=1000, threshold_2000=2000, threshold_3000=3000

