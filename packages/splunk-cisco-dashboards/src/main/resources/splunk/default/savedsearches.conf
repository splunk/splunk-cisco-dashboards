dispatch.latest_time = now
search = `index_security` (sourcetype="cisco:esa:amp" OR sourcetype="cisco:esa:antispam" OR sourcetype="cisco:esa:content_scanner") \
| eval threat=case(sourcetype=="cisco:esa:amp" AND (match(_raw,"MALICIOUS") OR match(_raw,"Unscannable")), "AMP Threats", sourcetype=="cisco:esa:antispam" AND match(_raw,"(?i)(SPAM|SUSPECT|POSITIVE|quarantine)"), "Spam Detected", sourcetype=="cisco:esa:content_scanner" AND match(_raw,"(?i)(virus|malware|DETECTED)"), "Content Threats", 1==1, null()) \
| where isnotnull(threat) \
| stats count as Events by threat \
| rename threat as Source

[Security Resilience - ds_email_threats]
description = Count of email threat verdicts from Cisco ESA — filters for MALICIOUS, Unscannable, and spam verdicts across AMP, antispam, and content scanner.
dispatch.earliest_time = -4h
dispatch.latest_time = now
