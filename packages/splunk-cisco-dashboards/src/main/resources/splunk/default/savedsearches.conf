[TEUC-5.9.53 - Cross-Platform Correlation Network plus APM]
description = [TEUC] Correlates ThousandEyes network metrics with APM traces — isolates network vs application root cause.
disabled = 1
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `stream_index` thousandeyes.test.type="agent-to-server" \
| bin _time span=5m \
| stats avg(network.latency) as avg_net_latency_s avg(network.loss) as avg_net_loss by server.address, _time \
| join type=outer max=1 server.address [ search index=apm_traces | bin _time span=5m | stats avg(duration_ms) as avg_app_latency_ms p99(duration_ms) as p99_app_latency_ms by service.name, server.address, _time ] \
| eval avg_net_latency_ms=round(avg_net_latency_s*1000,1) \
| eval root_cause=case(avg_net_latency_ms>200 AND avg_app_latency_ms<500, "Network", avg_net_latency_ms<50 AND avg_app_latency_ms>2000, "Application", avg_net_latency_ms>200 AND avg_app_latency_ms>2000, "Both", 1=1, "Normal") \
| where root_cause!="Normal" \
| table _time, server.address, service.name, avg_net_latency_ms, avg_net_loss, avg_app_latency_ms, root_cause

[TEUC-5.9.54 - MTTR Reduction via Network vs Application Isolation]
description = [TEUC] Mean time to isolate (MTTI) comparison — event-correlated vs alert-only.
