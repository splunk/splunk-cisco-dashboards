[Security Resilience - ds_security_events]
description = Recent high-priority security events aggregated by source, event type, and severity from ASA, ISE, Firepower, SSE, DNAC, and Active Directory.
dispatch.earliest_time = -4h
dispatch.latest_time = now
cron_schedule = 23 */4 * * *
enableSched = 1
allow_skew = 5m
dispatch.ttl = 16200
search = (`index_firewall` sourcetype="cisco:asa" ("Deny" OR "denied" OR "Teardown")) OR (`index_identity` sourcetype="cisco:ise:syslog" "5400") OR (`index_security` (sourcetype="cisco:cloud_security:dns" OR sourcetype="cisco:cloud_security:firewall") action="Blocked") OR (`index_firewall` sourcetype="cisco:estreamer:data") OR (`index_catalyst` sourcetype="cisco:dnac:audit:logs" name="LOGIN_USER_EVENT") OR (`index_windows` sourcetype="XmlWinEventLog" (EventCode=4625 OR EventCode=4740 OR EventCode=4672)) \
| eval Source=case(sourcetype=="cisco:asa","ASA", sourcetype=="cisco:ise:syslog","ISE", match(sourcetype,"estreamer"),"Firepower", match(sourcetype,"cloud_security:dns"),"Umbrella DNS", match(sourcetype,"cloud_security:firewall"),"Umbrella FW", match(sourcetype,"dnac:audit"),"DNAC", sourcetype=="XmlWinEventLog","Active Directory", 1==1,sourcetype) \
| eval Event=case(sourcetype=="cisco:asa" AND match(_raw,"(?i)deny"),"Firewall Deny", sourcetype=="cisco:asa" AND match(_raw,"(?i)teardown"),"Connection Teardown", sourcetype=="cisco:ise:syslog","Authentication Failure", match(sourcetype,"estreamer"),"Intrusion Event", match(sourcetype,"cloud_security:dns"),"DNS Blocked", match(sourcetype,"cloud_security:firewall"),"Web Blocked", match(sourcetype,"dnac:audit"),"Login Attempt", EventCode==4625,"Logon Failed", EventCode==4740,"Account Lockout", EventCode==4672,"Privileged Logon", 1==1,"Security Event") \
| eval Severity=case(match(_raw,"(?i)(crit|emerg|alert)"),"Critical", match(_raw,"(?i)(err|deny|denied|block|5400)") OR EventCode==4625 OR EventCode==4740,"High", match(_raw,"(?i)(warn)") OR EventCode==4672,"Medium", 1==1,"Low") \
| eval src=coalesce(src_ip, src, Source_Network_Address, "—"), dest=coalesce(dest_ip, dest, dst, Target_Server_Name, "—") \
| stats count as Count, latest(_time) as _time, values(src) as "Source IP", values(dest) as Destination by Source, Event, Severity \
| eval Time=strftime(_time, "%Y-%m-%d %H:%M:%S"), "Source IP"=mvindex('Source IP', 0, 4), Destination=mvindex(Destination, 0, 4) \
| sort -_time \
| table Time Source Event Severity "Source IP" Destination Count

