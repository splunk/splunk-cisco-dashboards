#
# savedsearches.conf — Executive Dashboard Searches
# All searches extracted from dashboard data sources with demo fallback removed.
# Default time range: -4h to now
#

# ======================================================================
# Building Resilience (building)
# ======================================================================

[Building Resilience - ds_ap_health_site]
description = Access point health by site — latest health score and AP count per location from Catalyst Center, enriched with asset inventory to show AP family mix.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" (DeviceFamily="Unified AP" OR DeviceFamily="Access Points") \
| where Site!="" \
| stats latest(OverallHealth) as health by DeviceID, DeviceName, Site \
| eval health=health*10, status=case(health>=80,"Healthy", health>=60,"Fair", 1==1,"Poor") \
| stats dc(DeviceID) as count, avg(health) as health, values(DeviceName) as devices by Site \
| eval health=round(health), status=case(health>=80,"Healthy", health>=60,"Fair", 1==1,"Poor") \
| sort -count \
| mvexpand devices \
| rename devices as device_name \
| lookup asset_inventory device_name OUTPUT device_family \
| stats first(health) as health, first(count) as count, first(status) as status, values(device_family) as ap_families by Site \
| eval ap_families=mvjoin(ap_families, ", ")

[Building Resilience - ds_compliance_detail]
description = Non-compliant device detail table from Catalyst Center enriched with asset inventory data — shows device name, compliance status, family, IP, software version, location, and management source.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:compliance" ComplianceStatus!="COMPLIANT" ComplianceStatus!="NOT_APPLICABLE" \
| stats latest(ComplianceStatus) as Status, latest(DeviceFamily) as Family, latest(IpAddress) as IP, latest(ImageVersion) as Version by DeviceName \
| rename DeviceName as device_name \
| lookup asset_inventory device_name OUTPUT location, management_source \
| rename device_name as Device, location as Location, management_source as Source \
| sort Status

[Building Resilience - ds_rooms]
description = Room utilization from Cisco Spaces SPACE_OCCUPANCY events — per-room occupancy, capacity, people presence, and booking status by building.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="SPACE_OCCUPANCY" \
| stats latest(spaceOccupancy.peoplePresence) as occupied, latest(spaceOccupancy.peakPeopleCount) as peak, latest(spaceOccupancy.space.capacity) as capacity, latest(spaceOccupancy.bookingStatus) as booked, latest(spaceOccupancy.location.parent.name) as building by spaceOccupancy.space.name \
| rename spaceOccupancy.space.name as Room \
| eval occupied=if(occupied=="true", 1, 0), booked=if(booked=="true", "Yes", "No"), util_pct=if(capacity>0, round(peak/capacity*100), 0) \
| stats count as rooms_total, sum(occupied) as rooms_used by building

[Building Resilience - ds_webex_devices]
description = Webex collaboration device inventory from Cisco Spaces WEBEX_TELEMETRY events — device name, product model, IP, firmware, location, and latest people count.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="WEBEX_TELEMETRY" \
| stats latest(webexTelemetryUpdate.deviceInfo.displayName) as Device, latest(webexTelemetryUpdate.deviceInfo.product) as Product, latest(webexTelemetryUpdate.deviceInfo.ipAddress) as IP, latest(webexTelemetryUpdate.deviceInfo.softwareVersion) as Firmware, latest(webexTelemetryUpdate.location.name) as Building, latest(webexTelemetryUpdate.location.parent.name) as Campus by webexTelemetryUpdate.deviceInfo.serialNumber \
| rename webexTelemetryUpdate.deviceInfo.serialNumber as Serial \
| sort Device

[Building Resilience - ds_webex_people_trend]
description = Webex device people count trend from WEBEX_TELEMETRY events — timechart of people detected by collaboration devices over time.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="WEBEX_TELEMETRY" \
| eval people='webexTelemetryUpdate.telemetries{}.peopleCount', device='webexTelemetryUpdate.deviceInfo.displayName' \
| where isnotnull(people) \
| timechart span=15m sum(people) as "People Detected"

[Building Resilience - ds_ssid_clients]
description = SSID client association breakdown from Cisco Spaces DEVICE_ASSOCIATION events — count of associate/disassociate events by SSID and building.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="DEVICE_ASSOCIATION" \
| eval ssid='deviceAssociation.ssid', event='deviceAssociation.event', building=coalesce('deviceAssociation.location.parent.parent.name', 'deviceAssociation.location.parent.name', 'deviceAssociation.location.name') \
| search event="ASSOCIATE" \
| stats dc(deviceAssociation.device.macAddress) as Clients by ssid \
| sort -Clients \
| rename ssid as SSID

[Building Resilience - ds_ssid_trend]
description = SSID association trend over time from DEVICE_ASSOCIATION events — timechart of client associations by SSID.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="DEVICE_ASSOCIATION" deviceAssociation.event="ASSOCIATE" \
| eval ssid='deviceAssociation.ssid' \
| timechart span=15m dc(deviceAssociation.device.macAddress) as clients by ssid

[Building Resilience - ds_user_presence_trend]
description = Active vs inactive user presence trend from Cisco Spaces USER_PRESENCE events — timechart of authenticated users at the building over time.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="USER_PRESENCE" \
| eval active='userPresence.activeUsersCount.totalUsers', inactive='userPresence.inActiveUsersCount.totalUsers', location='userPresence.location.name' \
| timechart span=15m latest(active) as "Active Users", latest(inactive) as "Inactive Users"

[Building Resilience - ds_device_presence_trend]
description = Active vs inactive device presence trend from Cisco Spaces DEVICE_PRESENCE events — timechart of connected devices over time by lifecycle state.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="DEVICE_PRESENCE" \
| eval active='devicePresence.activeDevicesCount', inactive='devicePresence.inActiveDevicesCount', location='devicePresence.location.name' \
| timechart span=15m latest(active) as "Active Devices", latest(inactive) as "Inactive Devices"

[Building Resilience - ds_room_detail]
description = Room-level detail table from Cisco Spaces SPACE_OCCUPANCY events — room name, building, floor, capacity, peak people count, presence status, and booking status.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="SPACE_OCCUPANCY" \
| stats latest(spaceOccupancy.peoplePresence) as Presence, latest(spaceOccupancy.peakPeopleCount) as "Peak Count", latest(spaceOccupancy.space.capacity) as Capacity, latest(spaceOccupancy.bookingStatus) as Booked, latest(spaceOccupancy.location.name) as Floor, latest(spaceOccupancy.location.parent.name) as Building by spaceOccupancy.space.name \
| rename spaceOccupancy.space.name as Room \
| eval Presence=if(Presence=="true", "Occupied", "Empty"), Booked=if(Booked=="true", "Yes", "No"), "Utilization %"=if(Capacity>0, round('Peak Count'/Capacity*100, 2), 0) \
| sort Building, Floor, Room

[Building Resilience - ds_spaces_kpi_devices]
description = Total unique devices tracked by Cisco Spaces via DEVICE_LOCATION_UPDATE events across all buildings and floors.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="DEVICE_LOCATION_UPDATE" \
| stats dc(deviceLocationUpdate.deviceMacAddress) as count

[Building Resilience - ds_spaces_kpi_users]
description = Total active users across all locations from Cisco Spaces USER_PRESENCE events.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="USER_PRESENCE" \
| stats latest(userPresence.activeUsersCount.totalUsers) as count by userPresence.location.name \
| stats sum(count) as count

[Building Resilience - ds_spaces_kpi_ssids]
description = Count of distinct active SSIDs from Cisco Spaces DEVICE_ASSOCIATION events.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="DEVICE_ASSOCIATION" deviceAssociation.event="ASSOCIATE" \
| stats dc(deviceAssociation.ssid) as count

[Building Resilience - ds_spaces_location_breakdown]
description = Device and AP distribution by campus, building, and floor from Cisco Spaces DEVICE_LOCATION_UPDATE events.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="DEVICE_LOCATION_UPDATE" \
| stats dc(deviceLocationUpdate.deviceMacAddress) as "Unique Devices", latest(deviceLocationUpdate.location.apCount) as "AP Count" by deviceLocationUpdate.location.parent.parent.name, deviceLocationUpdate.location.parent.name, deviceLocationUpdate.location.name \
| rename deviceLocationUpdate.location.parent.parent.name as Campus, deviceLocationUpdate.location.parent.name as Building, deviceLocationUpdate.location.name as Floor \
| sort Campus, Building, Floor

# ======================================================================
# Executive Dashboard (home_launchpad)
# ======================================================================

[Executive Dashboard - ds_active_clients]
description = Count of active wired and wireless clients currently connected, grouped by connection type (WIRED/WIRELESS), sourced from Catalyst Center client health data.
dispatch.earliest_time = -4h
dispatch.latest_time = now
cron_schedule = 8 */4 * * *
enableSched = 0
allow_skew = 5m
dispatch.ttl = 16200
search = `index_catalyst` sourcetype="cisco:dnac:client" \
| stats latest(type) as type, latest(connection.ssid) as ssid by macAddress \
| stats count by type

[Executive Dashboard - ds_base_issues]
description = Catalyst Center issue summary for executive tiles — counts issues by priority and category for the overview KPIs.
dispatch.earliest_time = -4h
dispatch.latest_time = now
enableSched = 0
cron_schedule = 11 */4 * * *
allow_skew = 5m
dispatch.ttl = 16200
search = `index_catalyst` sourcetype="cisco:dnac:issue" \
| stats count as total, count(eval(IssueSpecificPriority=="P1")) as critical, count(eval(IssueSpecificPriority=="P2")) as high, dc(DeviceName) as affected_devices, dc(SiteName) as affected_sites \
| appendpipe \
 [| where isnull(total) \
 | eval total=0, critical=0, high=0, affected_devices=0, affected_sites=0]

[Executive Dashboard - ds_bldg_score]
description = Building domain health score — averaged from AP health (DNAC), device connectivity (Spaces), room occupancy (Spaces), and compliance check pass rate.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" (DeviceFamily="Unified AP" OR DeviceFamily="Access Points") \
| stats latest(OverallHealth) as h by DeviceID \
| eval ap_h=h*10 \
| stats avg(ap_h) as ap_h \
| eval ap_h=round(ap_h) \
| append \
 [| search `index_spaces` sourcetype="cisco:spaces:firehose" eventType="DEVICE_PRESENCE" \
 | stats latest(devicePresence.activeDevicesCount) as active, latest(devicePresence.inActiveDevicesCount) as inactive by devicePresence.location.name \
 | eval total=active+inactive, pct=if(total>0, round(active/total*100), null()) \
 | stats avg(pct) as dev_h \
 | eval dev_h=round(dev_h)] \
| append \
 [| search `index_spaces` sourcetype="cisco:spaces:firehose" eventType="SPACE_OCCUPANCY" \
 | stats latest(spaceOccupancy.peoplePresence) as occupied by spaceOccupancy.space.name \
 | eval occupied=if(occupied=="true", 1, 0) \
 | stats count as total_rooms, sum(occupied) as rooms_occupied \
 | eval occ_h=if(total_rooms>0, round(rooms_occupied/total_rooms*100), null())] \
| append \
 [| search `index_catalyst` sourcetype="cisco:dnac:compliance" ComplianceStatus!="NOT_APPLICABLE" \
 | eval ok=if(ComplianceStatus=="COMPLIANT" OR ComplianceStatus=="COMPLIANT_WARNING",1,0) \
 | stats sum(ok) as compliant, count as total \
 | eval comp_h=if(total>0, round(compliant/total*100), null())] \
| stats values(ap_h) as a, values(dev_h) as d, values(occ_h) as o, values(comp_h) as c \
| eval parts=0, total=0 \
| eval parts=if(isnotnull(a), parts+1, parts), total=if(isnotnull(a), total+a, total) \
| eval parts=if(isnotnull(d), parts+1, parts), total=if(isnotnull(d), total+d, total) \
| eval parts=if(isnotnull(o), parts+1, parts), total=if(isnotnull(o), total+o, total) \
| eval parts=if(isnotnull(c), parts+1, parts), total=if(isnotnull(c), total+c, total) \
| eval score=if(parts>0, round(total/parts), 0) \
| fields score

[Executive Dashboard - ds_building_occupancy]
description = Percentage of rooms with people present from Cisco Spaces SPACE_OCCUPANCY events.
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0
cron_schedule = 21 */4 * * *
dispatch.ttl = 16200
allow_skew = 5m
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="SPACE_OCCUPANCY" \
| stats latest(spaceOccupancy.peoplePresence) as occupied by spaceOccupancy.space.name \
| eval occupied=if(occupied=="true", 1, 0) \
| stats count as total_rooms, sum(occupied) as rooms_occupied \
| eval score=if(total_rooms>0, round(rooms_occupied/total_rooms*100), 0) \
| fields score \
| appendpipe \
 [| where isnull(score) \
 | eval score=0]

[Executive Dashboard - ds_client_health_current]
description = Current average client health score derived from Catalyst Center device reachability and manageability status, normalized to a 0-100 scale.
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 14 */4 * * *
enableSched = 0
allow_skew = 5m
dispatch.ttl = 16200
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| stats latest(Reachability) as Reachability, latest(Manageability) as Manageability by DeviceID \
| eval h=case(Reachability=="Reachable" AND match(Manageability,"^Managed"),100, Reachability=="Reachable",50, 1==1,0) \
| stats avg(h) as score \
| eval score=round(score) \
| fields score \
| appendpipe \
 [| where isnull(score) \
 | eval score=0]

[Executive Dashboard - ds_compliance]
description = Compliance check pass rate — percentage of individual compliance checks returning COMPLIANT or COMPLIANT_WARNING from Catalyst Center assessments.
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0
cron_schedule = 24 */4 * * *
dispatch.ttl = 16200
allow_skew = 5m
search = `index_catalyst` sourcetype="cisco:dnac:compliance" ComplianceStatus!="NOT_APPLICABLE" \
| eval ok=if(ComplianceStatus=="COMPLIANT" OR ComplianceStatus=="COMPLIANT_WARNING",1,0) \
| stats sum(ok) as compliant, count as total \
| eval pct=if(total>0, round(compliant/total*100), 0) \
| fields pct \
| appendpipe \
 [| where isnull(pct) \
 | eval pct=0]

[Executive Dashboard - ds_config_changes]
description = Count of distinct human config workflows on Catalyst Center. \
A workflow = one user x one 5-minute window of activity. This collapses multi-device \
fan-out: a single human push to 28 devices that generates 8 audit lines all within \
the same 5 minutes = 1 workflow. Filters: roots only (parentInstanceId is null), \
human userIds (excludes system, SYSTEM, dnac-svc, license-management, localhost, null), \
no read-only commands, no preview/dry-run requests, no generic ack messages, no \
"Going to deploy" precursor events. Source: cisco:dnac:audit:logs. Used by the \
"Human config workflows" tiles on it_health_v2.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:audit:logs" name="AUDIT_LOG" \
 userId!="system" userId!="SYSTEM" userId!="dnac-svc" userId!="license-management" userId!="localhost" userId!="null" \
 NOT description="*read-only commands*" \
 NOT description="*preview*" \
 NOT description="Service request processing completed*" \
 NOT description="Going to deploy*" \
| where (parentInstanceId="null" OR parentInstanceId="" OR isnull(parentInstanceId)) \
| where NOT (description LIKE "Executing command%display%") \
| eval admin=coalesce(adminName, userId, "unknown") \
| bin _time span=5m as bucket \
| eval session = admin . "|" . bucket \
| stats dc(session) as count \
| appendpipe \
 [| where isnull(count) \
 | eval count=0]

[Executive Dashboard - ds_data_status]
description = Data source connectivity table showing each Cisco integration, its ingestion status, and 24-hour event volume with human-readable formatting (K/M suffixes).
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats count where index=* by index sourcetype \
| stats sum(count) as events_24h by sourcetype \
| eval source=case(match(sourcetype,"meraki"),"Meraki", match(sourcetype,"cisco:ise"),"ISE Syslog", match(sourcetype,"cisco:ios"),"IOS Syslog", match(sourcetype,"cisco:asa"),"ASA Firewall", match(sourcetype,"cisco:estreamer"),"eStreamer IPS", match(sourcetype,"cisco:cloud_security") OR match(sourcetype,"cisco:cloud:"),"SSE / Cloud Security", match(sourcetype,"cisco:sdwan"),"SD-WAN", match(sourcetype,"cisco:dnac"),"Catalyst Center (DNAC)", match(sourcetype,"cisco:dc:nd"),"DC Networking (ND)", match(sourcetype,"stream"),"NetFlow / Stream", match(sourcetype,"cisco:intersight"),"Intersight", match(sourcetype,"XmlWinEventLog") OR match(sourcetype,"ActiveDirectory") OR match(sourcetype,"MSAD"),"Windows / Active Directory", match(sourcetype,"DhcpSrvLog"),"Windows DHCP", 1==1, sourcetype) \
| stats sum(events_24h) as events_24h by source \
| eval status="Connected", events_24h=case(events_24h>=1000000, tostring(round(events_24h/1000000,1))."M", events_24h>=1000, tostring(round(events_24h/1000,1))."K", 1==1, tostring(events_24h)) \
| fields source status events_24h

[Executive Dashboard - ds_device_health_current]
description = Current device health score from Catalyst Center, evaluating reachability and manageability across all unique managed devices (deduped by DeviceID).
dispatch.earliest_time = -4h
dispatch.latest_time = now
enableSched = 0
cron_schedule = 17 */4 * * *
allow_skew = 5m
dispatch.ttl = 16200
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| stats latest(Reachability) as Reachability, latest(Manageability) as Manageability by DeviceID \
| eval h=case(Reachability=="Reachable" AND match(Manageability,"^Managed"),100, Reachability=="Reachable",50, 1==1,0) \
| stats avg(h) as score \
| eval score=round(score) \
| fields score

[Executive Dashboard - ds_device_inventory]
description = Device inventory counts by type from the unified asset inventory lookup — includes all sources (Catalyst Center, Meraki, IOS, Firewall, ISE, F5, Windows/AD).
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | inputlookup asset_inventory \
| stats count by device_type \
| rename device_type as category

[Executive Dashboard - ds_failed_logons]
description = Unique user accounts with failed authentication — counts distinct users from the Authentication data model where action=failure.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats `summariesonly` dc(Authentication.user) as count from datamodel=Authentication where Authentication.action="failure" \
| appendpipe \
 [| where isnull(count) \
 | eval count=0]

[Executive Dashboard - ds_fw_blocked]
description = Unique blocked connections (by src/dest/dest_port tuple) across the Network_Traffic data model for the security posture tile.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats `summariesonly` count from datamodel=Network_Traffic where All_Traffic.action="blocked" by All_Traffic.src, All_Traffic.dest, All_Traffic.dest_port \
| stats count as blocked \
| appendpipe \
 [| where isnull(blocked) \
 | eval blocked=0]

[Executive Dashboard - ds_wifi_clients]
description = Distinct Wi-Fi client devices currently associated from Cisco Spaces DEVICE_ASSOCIATION events.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="DEVICE_ASSOCIATION" deviceAssociation.event="ASSOCIATE" \
| stats dc(deviceAssociation.device.macAddress) as score \
| appendpipe \
 [| where isnull(score) \
 | eval score=0]

[Executive Dashboard - ds_ise_auth]
description = Authentication success rate — averaged ISE (CISE_Passed/Failed log categories) and AD (EventCode 4624/4625) success percentages.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_identity` sourcetype="cisco:ise:syslog" (CISE_Passed_Authentications OR CISE_Failed_Attempts) \
| eval p=if(match(_raw,"CISE_Passed"),1,0) \
| stats sum(p) as pass, count as t \
| eval ise_h=if(t>0, round(pass/t*100, 1), null()) \
| append \
 [| search `index_windows` sourcetype="XmlWinEventLog" (EventCode=4624 OR EventCode=4625) \
 | eval ok=if(EventCode=="4624",1,0) \
 | stats sum(ok) as pass2, count as t2 \
 | eval ad_h=if(t2>0, round(pass2/t2*100, 1), null())] \
| stats values(ise_h) as i, values(ad_h) as a \
| eval parts=0, total=0 \
| eval parts=if(isnotnull(i), parts+1, parts), total=if(isnotnull(i), total+i, total) \
| eval parts=if(isnotnull(a), parts+1, parts), total=if(isnotnull(a), total+a, total) \
| eval score=if(parts>0, round(total/parts, 1), 0) \
| fields score

[Executive Dashboard - ds_it_score]
description = IT domain composite score — averaged from network health, device health, and compliance check pass rate.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:networkhealth" category="All" \
| stats latest(healthScore) as net_h \
| append \
 [| search `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
 | stats latest(Reachability) as Reachability, latest(Manageability) as Manageability by DeviceID \
 | eval h=case(Reachability=="Reachable" AND match(Manageability,"^Managed"),100, Reachability=="Reachable",50, 1==1,0) \
 | stats avg(h) as dh \
 | eval dev_h=round(dh)] \
| append \
 [| search `index_catalyst` sourcetype="cisco:dnac:compliance" ComplianceStatus!="NOT_APPLICABLE" \
 | eval ok=if(ComplianceStatus=="COMPLIANT" OR ComplianceStatus=="COMPLIANT_WARNING",1,0) \
 | stats sum(ok) as compliant, count as total \
 | eval comp_h=if(total>0, round(compliant/total*100), null())] \
| stats values(net_h) as n, values(dev_h) as dv, values(comp_h) as c \
| eval parts=0, total=0 \
| eval parts=if(isnotnull(n), parts+1, parts), total=if(isnotnull(n), total+n, total) \
| eval parts=if(isnotnull(dv), parts+1, parts), total=if(isnotnull(dv), total+dv, total) \
| eval parts=if(isnotnull(c), parts+1, parts), total=if(isnotnull(c), total+c, total) \
| eval score=if(parts>0, round(total/parts), 0) \
| fields score \
| appendpipe \
 [| where isnull(score) \
 | eval score=0]

[Executive Dashboard - ds_network_health_current]
description = Current network health score from Catalyst Center for the "All" category, representing overall infrastructure health 0-100.
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0
cron_schedule = 27 */4 * * *
dispatch.ttl = 16200
allow_skew = 5m
search = `index_catalyst` sourcetype="cisco:dnac:networkhealth" category="All" \
| stats latest(healthScore) as score \
| fields score

[Executive Dashboard - ds_overall_score]
description = Overall executive posture score — average of IT Health, Security, User Experience, and Building domain scores from their respective saved searches.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | savedsearch "Executive Dashboard - ds_it_score" \
| rename score as it \
| append \
 [| savedsearch "Executive Dashboard - ds_sec_score" \
 | rename score as sec] \
| append \
 [| savedsearch "Executive Dashboard - ds_ux_score" \
 | rename score as ux] \
| append \
 [| savedsearch "Executive Dashboard - ds_bldg_score" \
 | rename score as bldg] \
| stats values(it) as it, values(sec) as sec, values(ux) as ux, values(bldg) as bldg \
| eval parts=0, total=0 \
| eval parts=if(isnotnull(it), parts+1, parts), total=if(isnotnull(it), total+it, total) \
| eval parts=if(isnotnull(sec), parts+1, parts), total=if(isnotnull(sec), total+sec, total) \
| eval parts=if(isnotnull(ux), parts+1, parts), total=if(isnotnull(ux), total+ux, total) \
| eval parts=if(isnotnull(bldg), parts+1, parts), total=if(isnotnull(bldg), total+bldg, total) \
| eval score=if(parts>0, round(total/parts), 0) \
| fields score \
| appendpipe \
 [| where isnull(score) \
 | eval score=0]

# ======================================================================
# Scheduled Score Pipeline — computes all domain + overall scores
# ======================================================================

[Executive Dashboard - Score Pipeline]
description = Scheduled pipeline: computes IT, Security, UX, Building, and Overall domain scores in one pass and outputs to exec_scores.csv for instant dashboard loading.
dispatch.earliest_time = -8h
dispatch.latest_time = now
cron_schedule = 2 */4 * * *
enableSched = 1
allow_skew = 5m
dispatch.ttl = 16200
search = `index_catalyst` sourcetype="cisco:dnac:networkhealth" category="All" \
| stats latest(healthScore) as val \
| eval metric="net_h" \
| append \
 [| search `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
 | stats latest(Reachability) as R, latest(Manageability) as M by DeviceID \
 | eval h=case(R=="Reachable" AND match(M,"^Managed"),100, R=="Reachable",50, 1==1,0) \
 | stats avg(h) as val \
 | eval val=round(val), metric="dev_h"] \
| append \
 [| search `index_catalyst` sourcetype="cisco:dnac:compliance" ComplianceStatus!="NOT_APPLICABLE" \
 | eval ok=if(ComplianceStatus=="COMPLIANT" OR ComplianceStatus=="COMPLIANT_WARNING",1,0) \
 | stats sum(ok) as c, count as t \
 | eval val=if(t>0, round(c/t*100), null()), metric="comp_h"] \
| append \
 [| search `index_identity` sourcetype="cisco:ise:syslog" (CISE_Passed_Authentications OR CISE_Failed_Attempts) \
 | eval p=if(match(_raw,"CISE_Passed"),1,0) \
 | stats sum(p) as pass, count as t \
 | eval val=if(t>0, round(pass/t*100), null()), metric="ise_h"] \
| append \
 [| search `index_windows` sourcetype="XmlWinEventLog" (EventCode=4624 OR EventCode=4625) \
 | eval ok=if(EventCode=="4624",1,0) \
 | stats sum(ok) as pass, count as t \
 | eval val=if(t>0, round(pass/t*100), null()), metric="ad_h"] \
| append \
 [| search `index_catalyst` sourcetype="cisco:dnac:clienthealth" clientType="ALL" scoreType="ALL" scoreValue>=0 \
 | stats latest(scoreValue) as val \
 | eval metric="client_h"] \
| append \
 [| search `index_catalyst` sourcetype="cisco:dnac:devicehealth" (DeviceFamily="Unified AP" OR DeviceFamily="Access Points") \
 | stats latest(OverallHealth) as h by DeviceID \
 | eval ap_h=h*10 \
 | stats avg(ap_h) as val \
 | eval val=round(val), metric="ap_h"] \
| append \
 [| search `index_spaces` sourcetype="cisco:spaces:firehose" eventType="DEVICE_PRESENCE" \
 | stats latest(devicePresence.activeDevicesCount) as active, latest(devicePresence.inActiveDevicesCount) as inactive by devicePresence.location.name \
 | eval total=active+inactive, pct=if(total>0, round(active/total*100), null()) \
 | stats avg(pct) as val \
 | eval val=round(val), metric="spaces_dev_h"] \
| append \
 [| search `index_spaces` sourcetype="cisco:spaces:firehose" eventType="SPACE_OCCUPANCY" \
 | stats latest(spaceOccupancy.peoplePresence) as occupied by spaceOccupancy.space.name \
 | eval occupied=if(occupied=="true", 1, 0) \
 | stats count as total_rooms, sum(occupied) as rooms_occupied \
 | eval val=if(total_rooms>0, round(rooms_occupied/total_rooms*100), null()), metric="occ_h"] \
| stats values(eval(if(metric=="net_h",val,null()))) as net_h, values(eval(if(metric=="dev_h",val,null()))) as dev_h, values(eval(if(metric=="comp_h",val,null()))) as comp_h, values(eval(if(metric=="ise_h",val,null()))) as ise_h, values(eval(if(metric=="ad_h",val,null()))) as ad_h, values(eval(if(metric=="client_h",val,null()))) as client_h, values(eval(if(metric=="ap_h",val,null()))) as ap_h, values(eval(if(metric=="spaces_dev_h",val,null()))) as spaces_dev_h, values(eval(if(metric=="occ_h",val,null()))) as occ_h \
| eval it_n=0, it_t=0 \
| eval it_n=if(isnotnull(net_h),it_n+1,it_n), it_t=if(isnotnull(net_h),it_t+net_h,it_t) \
| eval it_n=if(isnotnull(dev_h),it_n+1,it_n), it_t=if(isnotnull(dev_h),it_t+dev_h,it_t) \
| eval it_n=if(isnotnull(comp_h),it_n+1,it_n), it_t=if(isnotnull(comp_h),it_t+comp_h,it_t) \
| eval it_score=if(it_n>0, round(it_t/it_n), 0) \
| eval sec_n=0, sec_t=0 \
| eval sec_n=if(isnotnull(ise_h),sec_n+1,sec_n), sec_t=if(isnotnull(ise_h),sec_t+ise_h,sec_t) \
| eval sec_n=if(isnotnull(ad_h),sec_n+1,sec_n), sec_t=if(isnotnull(ad_h),sec_t+ad_h,sec_t) \
| eval sec_score=if(sec_n>0, round(sec_t/sec_n), 0) \
| eval ux_score=case(client_h>=0 AND isnotnull(dev_h), round((client_h+dev_h)/2), client_h>=0, round(client_h), isnotnull(dev_h), round(dev_h), 1==1, 0) \
| eval bldg_n=0, bldg_t=0 \
| eval bldg_n=if(isnotnull(ap_h),bldg_n+1,bldg_n), bldg_t=if(isnotnull(ap_h),bldg_t+ap_h,bldg_t) \
| eval bldg_n=if(isnotnull(spaces_dev_h),bldg_n+1,bldg_n), bldg_t=if(isnotnull(spaces_dev_h),bldg_t+spaces_dev_h,bldg_t) \
| eval bldg_n=if(isnotnull(occ_h),bldg_n+1,bldg_n), bldg_t=if(isnotnull(occ_h),bldg_t+occ_h,bldg_t) \
| eval bldg_n=if(isnotnull(comp_h),bldg_n+1,bldg_n), bldg_t=if(isnotnull(comp_h),bldg_t+comp_h,bldg_t) \
| eval bldg_score=if(bldg_n>0, round(bldg_t/bldg_n), 0) \
| eval overall_n=0, overall_t=0 \
| eval overall_n=if(it_score>0,overall_n+1,overall_n), overall_t=if(it_score>0,overall_t+it_score,overall_t) \
| eval overall_n=if(sec_score>0,overall_n+1,overall_n), overall_t=if(sec_score>0,overall_t+sec_score,overall_t) \
| eval overall_n=if(ux_score>0,overall_n+1,overall_n), overall_t=if(ux_score>0,overall_t+ux_score,overall_t) \
| eval overall_n=if(bldg_score>0,overall_n+1,overall_n), overall_t=if(bldg_score>0,overall_t+bldg_score,overall_t) \
| eval overall_score=if(overall_n>0, round(overall_t/overall_n), 0) \
| eval updated=strftime(now(), "%Y-%m-%d %H:%M:%S") \
| table it_score sec_score ux_score bldg_score overall_score net_h dev_h comp_h ise_h ad_h client_h ap_h spaces_dev_h occ_h updated \
| outputlookup exec_scores CreateInApp=true Create_Empty=true Override_If_Empty=false

# ======================================================================
# Scheduled Data Status Pipeline — replaces index=* scan
# ======================================================================

[Executive Dashboard - Data Status Pipeline]
description = Scheduled pipeline: checks data ingestion status for all Cisco integrations using targeted sourcetype filters instead of index=*. Outputs to data_status.csv.
dispatch.earliest_time = -4h
dispatch.latest_time = now
cron_schedule = 5 */4 * * *
enableSched = 1
allow_skew = 5m
dispatch.ttl = 16200
search = | tstats count where `index_catalyst` sourcetype="cisco:dnac:*" by sourcetype \
| append \
 [| tstats count where `index_meraki` sourcetype="meraki:*" by sourcetype] \
| append \
 [| tstats count where `index_identity` sourcetype="cisco:ise:syslog" by sourcetype] \
| append \
 [| tstats count where `index_windows` (sourcetype="XmlWinEventLog" OR sourcetype="ActiveDirectory" OR sourcetype="MSAD:*") by sourcetype] \
| append \
 [| tstats count where `index_dhcp` sourcetype="DhcpSrvLog" by sourcetype] \
| append \
 [| tstats count where `index_firewall` (sourcetype="cisco:asa" OR sourcetype="cisco:ftd" OR sourcetype="cisco:sfw:estreamer" OR sourcetype="cisco:firepower:syslog" OR sourcetype="cisco:estreamer:*") by sourcetype] \
| append \
 [| tstats count where `index_network` sourcetype="cisco:ios" by sourcetype] \
| append \
 [| tstats count where `index_security` (sourcetype="cisco:cloud_security:*" OR sourcetype="cisco:xdr:*" OR sourcetype="cisco:esa:*" OR sourcetype="cisco:wsa:*" OR sourcetype="cisco:sdwan:*" OR sourcetype="ms:defender:*") by sourcetype] \
| append \
 [| tstats count where `index_spaces` sourcetype="cisco:spaces:*" by sourcetype] \
| append \
 [| tstats count where `index_thousandeyes` sourcetype="cisco:thousandeyes:*" by sourcetype] \
| stats sum(count) as events_24h by sourcetype \
| eval source=case( match(sourcetype,"meraki"),"Meraki", match(sourcetype,"cisco:ise"),"ISE Syslog", match(sourcetype,"cisco:ios"),"IOS Syslog", match(sourcetype,"cisco:asa"),"ASA Firewall", match(sourcetype,"cisco:ftd"),"FTD Firewall", match(sourcetype,"cisco:estreamer") OR match(sourcetype,"cisco:sfw:estreamer"),"eStreamer IPS", match(sourcetype,"cisco:cloud_security") OR match(sourcetype,"cisco:cloud:"),"SSE / Cloud Security", match(sourcetype,"cisco:sdwan"),"SD-WAN", match(sourcetype,"cisco:dnac"),"Catalyst Center (DNAC)", match(sourcetype,"cisco:dc:nd"),"DC Networking (ND)", match(sourcetype,"stream"),"NetFlow / Stream", match(sourcetype,"cisco:intersight"),"Intersight", match(sourcetype,"cisco:spaces"),"Cisco Spaces", match(sourcetype,"cisco:thousandeyes"),"ThousandEyes", match(sourcetype,"XmlWinEventLog") OR match(sourcetype,"ActiveDirectory") OR match(sourcetype,"MSAD"),"Windows / Active Directory", match(sourcetype,"DhcpSrvLog"),"Windows DHCP", match(sourcetype,"cisco:xdr"),"Cisco XDR", match(sourcetype,"cisco:esa"),"Email Security (ESA)", match(sourcetype,"cisco:wsa"),"Web Security (WSA)", match(sourcetype,"ms:defender"),"Microsoft Defender", 1==1, sourcetype) \
| stats sum(events_24h) as events_24h by source \
| eval status="Connected", events_24h=case( events_24h>=1000000, tostring(round(events_24h/1000000,1))."M", events_24h>=1000, tostring(round(events_24h/1000,1))."K", 1==1, tostring(events_24h)), updated=strftime(now(), "%Y-%m-%d %H:%M:%S") \
| fields source status events_24h updated \
| outputlookup data_status CreateInApp=true Create_Empty=true Override_If_Empty=false

[Executive Dashboard - ds_collab_devices]
description = Count of unique Webex collaboration devices from Cisco Spaces WEBEX_TELEMETRY events.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="WEBEX_TELEMETRY" \
| stats dc(webexTelemetryUpdate.deviceInfo.serialNumber) as score \
| appendpipe \
 [| where isnull(score) \
 | eval score=0]

[Executive Dashboard - ds_sec_score]
description = Security domain score — averaged ISE and AD authentication success rates. ISE uses log categories (CISE_Passed/Failed), AD uses EventCode 4624/4625.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_identity` sourcetype="cisco:ise:syslog" (CISE_Passed_Authentications OR CISE_Failed_Attempts) \
| eval p=if(match(_raw,"CISE_Passed"),1,0) \
| stats sum(p) as pass, count as t \
| eval ise_h=if(t>0, round(pass/t*100), null()) \
| append \
 [| search `index_windows` sourcetype="XmlWinEventLog" (EventCode=4624 OR EventCode=4625) \
 | eval ok=if(EventCode=="4624",1,0) \
 | stats sum(ok) as pass2, count as t2 \
 | eval ad_h=if(t2>0, round(pass2/t2*100), null())] \
| stats values(ise_h) as i, values(ad_h) as a \
| eval parts=0, total=0 \
| eval parts=if(isnotnull(i), parts+1, parts), total=if(isnotnull(i), total+i, total) \
| eval parts=if(isnotnull(a), parts+1, parts), total=if(isnotnull(a), total+a, total) \
| eval score=if(parts>0, round(total/parts), 0) \
| fields score

[Executive Dashboard - ds_te_health]
description = ThousandEyes composite health score averaging network latency/loss, HTTP server availability, and web page load completion across all test types.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats `summariesonly` avg(Test_Metrics.metric_name:network.loss) as loss, avg(Test_Metrics.metric_name:network.latency) as latency, avg(Test_Metrics.metric_name:http.server.request.availability) as http_avail, avg(Test_Metrics.metric_name:web.page_load.completion) as page_completion FROM datamodel="Cisco_ThousandEyes.Test_Metrics" \
| eval net_score=if(isnotnull(loss) AND isnotnull(latency), 100 - latency/2 - loss*10, null()), http_score=if(isnotnull(http_avail), http_avail, null()), page_score=if(isnotnull(page_completion), page_completion, null()) \
| eventstats count as _dummy \
| eval n=0, total=0 \
| eval n=if(isnotnull(net_score), n+1, n), total=if(isnotnull(net_score), total+net_score, total) \
| eval n=if(isnotnull(http_score), n+1, n), total=if(isnotnull(http_score), total+http_score, total) \
| eval n=if(isnotnull(page_score), n+1, n), total=if(isnotnull(page_score), total+page_score, total) \
| eval score=if(n>0, round(total/n), 0) \
| appendpipe \
 [| where isnull(score) OR n==0 \
 | eval score=0]

[Executive Dashboard - ds_active_devices]
description = Total active tracked devices across all locations from Cisco Spaces DEVICE_PRESENCE events.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="DEVICE_PRESENCE" \
| stats latest(devicePresence.activeDevicesCount) as active by devicePresence.location.name \
| stats sum(active) as score \
| appendpipe \
 [| where isnull(score) \
 | eval score=0]

[Executive Dashboard - ds_ux_score]
description = User experience domain score from Catalyst Center client health for ALL client types and score types.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:clienthealth" \
| where clientType="ALL" AND scoreType="ALL" AND scoreValue>=0 \
| stats latest(scoreValue) as sv \
| eval client_h=sv \
| append \
 [| search `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
 | stats latest(Reachability) as Reachability, latest(Manageability) as Manageability by DeviceID \
 | eval h=case(Reachability=="Reachable" AND match(Manageability,"^Managed"),100, Reachability=="Reachable",50, 1==1,0) \
 | stats avg(h) as dev_h \
 | eval dev_h=round(dev_h)] \
| stats values(client_h) as ch, values(dev_h) as dh \
| eval score=case(ch>=0 AND isnotnull(dh), round((ch+dh)/2), ch>=0, ch, isnotnull(dh), dh, 1==1, 0) \
| fields score

[Executive Dashboard - ds_xdr_incidents]
description = Count of distinct XDR/SecureX incident IDs from Cisco XDR incident data.
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = 20 */4 * * *
enableSched = 0
allow_skew = 5m
dispatch.ttl = 16200
search = `index_security` (sourcetype="cisco:xdr:incidents" OR sourcetype="cisco:xdr:incidents-summary") \
| stats dc(id) as total \
| appendpipe \
 [| where isnull(total) \
 | eval total=0]

# ======================================================================
# IT - Critical Systems (it_health)
# ======================================================================

[IT - Critical Systems - ds_ap_by_location]
description = Access point count by physical location/site from Catalyst Center device health data, filtered to Unified AP and Access Points device families.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" (DeviceFamily="Unified AP" OR DeviceFamily="Access Points") \
| stats latest(DeviceID) as DeviceID by DeviceName, Site \
| where Site!="" \
| stats dc(DeviceID) as APs by Site \
| sort -APs \
| fillnull Site value="Unknown" \
| rename Site as "Location"

[IT - Critical Systems - ds_base_issues]
description = Base search for all Catalyst Center issues with structured fields — feeds downstream chain searches for severity filtering, category splits, site-level aggregation, and issue detail tables.
dispatch.earliest_time = -4h
dispatch.latest_time = now
enableSched = 0
cron_schedule = 30 */4 * * *
dispatch.ttl = 16200
allow_skew = 5m
search = `index_catalyst` sourcetype="cisco:dnac:issue" \
| fields IssueID, IssueName, IssueCategory, IssueSpecificPriority, IssueStatus, IssueSpecificSeverity, IssueSpecificDescription, IssueSpecificSummary, IssueSpecificEntity, IssueSpecificEntityValue, IssueSpecificCategory, IssueSpecificName, IssueSpecificSource, IssueCount, IssueDeviceRole, DeviceName, DeviceFamily, DevicePlatform, DeviceRole, DeviceSerialNumber, DeviceSeries, DeviceIpAddress, DeviceImgVersion, DeviceMACAddress, SiteName, SiteNameHierarchy, SiteType, IssueClientMac, _time

[IT - Critical Systems - ds_compliance_donut]
description = Compliance distribution for donut chart — count of devices grouped by ComplianceStatus (COMPLIANT, NON_COMPLIANT, WARNING).
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:compliance" \
| stats latest(ComplianceStatus) as ComplianceStatus by DeviceName \
| stats count by ComplianceStatus

[IT - Critical Systems - ds_config_trend]
description = Audit event trend over 14 days combining Meraki audit logs and Catalyst Center audit logs, displayed as a timechart by administrator.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = (`index_meraki` sourcetype="meraki:audit") OR (`index_catalyst` sourcetype="cisco:dnac:audit:logs" NOT name IN ("REGISTER","APIS_READY","SERVICE_STARTUP")) \
| eval admin=coalesce(adminName, userId, "system") \
| timechart span=1d count by admin limit=5

[IT - Critical Systems - ds_device_health]
description = Device health trend over time from Catalyst Center — 30-minute interval averages of device OverallHealth scores for timechart visualization.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" OverallHealth>=0 \
| bin _time span=30m \
| stats latest(OverallHealth) as oh by DeviceID, _time \
| eval health=oh*10 \
| timechart span=30m avg(health) as health

[IT - Critical Systems - ds_network_health]
description = Network health trend from Catalyst Center — 30-minute interval latest health scores for the "All" network category timechart.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:networkhealth" category="All" \
| timechart span=30m latest(healthScore) as health

[IT - Critical Systems - ds_site_health]
description = Per-site health scores from Catalyst Center — latest health score by site/location for the site-level health table.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:networkhealth" category!="All" \
| stats latest(healthScore) as health, latest(goodCount) as good, latest(badCount) as bad, latest(fairCount) as fair, latest(totalCount) as total by category \
| eval health=round(health) \
| sort -health \
| rename category as Site

[IT - Critical Systems - ds_switch_by_location]
description = Switch count by physical location from Catalyst Center device health, filtered to Switches and Hubs device family.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" DeviceFamily="Switches and Hubs" \
| where Site!="" \
| stats latest(DeviceID) as DeviceID by DeviceName, Site \
| stats dc(DeviceID) as Switches by Site \
| fillnull Site value="Unknown" \
| sort -Switches

[IT - Critical Systems - ds_syslog_severity]
description = IOS syslog event distribution by severity level — extracts severity from the %FACILITY-SEVERITY-MNEMONIC pattern using rex, then classifies as Critical (0-2), Error (3), Warning (4-5), or Info (6-7).
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_network` (sourcetype="cisco:ios") \
| rex "%(?<facility>[A-Z_]+)-(?<severity_id>\d+)-(?<mnemonic>[A-Z_]+)" \
| eval severity=case(severity_id<=2,"Critical", severity_id==3,"Error", severity_id<=5,"Warning", 1==1,"Info") \
| stats count as events, dc(host) as hosts, dc(mnemonic) as message_types by severity

[IT - Critical Systems - ds_wan_bandwidth_detail]
description = WAN circuit health table from Meraki uplink loss and latency data — shows per-circuit latency, loss percentage, and health status.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_meraki` sourcetype="meraki:devicesuplinkslossandlatency" \
| stats latest(timeSeries{0}.latencyMs) as latency_ms, latest(timeSeries{0}.lossPercent) as loss_pct by uplink \
| eval latency_ms=round(latency_ms,1), loss_pct=round(loss_pct,2), status=case(latency_ms>100,"Critical", latency_ms>50,"Warning", 1==1,"OK") \
| rename uplink as circuit

[IT - Critical Systems - ds_wow_health]
description = Week-over-week comparison of average network and device health scores — this week vs last week for trend analysis.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:networkhealth" \
| eval is_this_week=if(_time >= relative_time(now(), "-7d@d"), 1, 0) \
| stats avg(eval(if(is_this_week==1, healthScore, null()))) as this_week, avg(eval(if(is_this_week==0, healthScore, null()))) as last_week \
| eval score=round(this_week, 1), delta=round(this_week - last_week, 1) \
| table score delta

