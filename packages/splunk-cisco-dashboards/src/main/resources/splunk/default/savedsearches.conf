[Security Resilience - ds_ise_failure_reasons]
description = Top ISE authentication failure reasons extracted from final-verdict failure events (message code 5401).
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_identity` sourcetype="cisco:ise:syslog" "5401" \
| rex "FailureReason=(?<reason>[^,;]+)" \
| fillnull reason value="Unknown" \
| stats count by reason \
| sort -count \
| head 10 \
| rename reason as "Failure Reason", count as Count

[Security Resilience - ds_ise_by_nas]
description = ISE authentication breakdown by Network Access Server — shows pass/fail counts and success rate per NAS device.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_identity` sourcetype="cisco:ise:syslog" ("5200" OR "5401") \
| rex "NetworkDeviceName=(?<nas>[^,;]+)" \
| fillnull nas value="Unknown" \
| eval passed=if(match(_raw,"5200"),1,0) \
| stats count as Total, sum(passed) as Pass by nas \
| eval Fail=Total-Pass, "Pass %"=round(Pass/Total*100, 1) \
| sort -Total \
| head 10 \
| rename nas as "Network Access Server"

[Security Resilience - ds_ise_fail_count]
description = Total ISE authentication failure count from final-verdict failure events (message code 5401) for the overview KPI.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_identity` sourcetype="cisco:ise:syslog" "5401" \
| stats count as score \
| appendpipe \
 [| where isnull(score) \
 | eval score=0]


# ===========================================================================
# NetOps Readiness — scheduled checks (netops_readiness_v1.xml)
# Merged from local + default: refined SPL (coalesce/spath), no alert actions.
# Optional per-env notifications: add only in local/savedsearches.conf as overrides.
# Stamped: 2026-04-25
# ===========================================================================

[NetOps Alert - AP Down or Unreachable]
description = Fires when any Unified AP in DNAC is not REACHABLE (coalesce field names). Match local NetOps readiness Q3/Q5.
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.suppress = 0
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" | spath | eval nm=coalesce(deviceName, DeviceName), fam=coalesce(deviceFamily, DeviceFamily), r=coalesce(reachabilityHealth, Reachability) | where fam="Unified AP" AND isnotnull(nm) | stats latest(r) as reach by nm | where isnull(reach) OR (upper(reach)!="REACHABLE" AND upper(reach)!="UP") | eval AP=nm, status=reach

[NetOps Alert - AP Saturation Critical]
description = Fires when any AP peak client count exceeds 30 (24+5 GHz).
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.suppress = 0
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" | spath | eval d=coalesce(deviceName, DeviceName), fam=coalesce(deviceFamily, DeviceFamily) | eval c=coalesce(ClientCountGhz24, clientCountGhz24, 0) + coalesce(ClientCountGhz50, clientCountGhz50, 0) | where fam="Unified AP" AND isnotnull(d) | stats max(c) as peak by d | where peak>30

[NetOps Alert - Client Onboarding Degraded]
description = Any client onboarding time over 3 seconds (per-event threshold; see macro for site-aggregated variant).
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.suppress = 0
search = `index_catalyst` sourcetype="cisco:dnac:client" | spath path=onboarding.onboardingTime output=ot | where isnotnull(ot) AND ot>0 | eval sec=ot/1000 | where sec>3

[NetOps Alert - DNAC P1 Issue Raised]
description = Active P1 issues in DNAC (status + severity coalesced).
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.suppress = 0
search = `index_catalyst` sourcetype="cisco:dnac:issue" | spath | eval st=coalesce(status, IssueStatus), sev=coalesce(severity, IssueSpecificSeverity) | where sev="P1" AND match(lower(tostring(st)), "active|open|new|assigned")

[NetOps Alert - Client Health Collapse]
description = Global average client health (overallScore from cisco:dnac:client) below 5.
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.suppress = 0
search = `index_catalyst` sourcetype="cisco:dnac:client" | spath path=health.overallScore output=h | where isnotnull(h) | stats avg(h) as a | where a<5

[NetOps Alert - NRS Below Threshold]
description = Simplified NRS proxy below 80 (reach + Q + D placeholder). For full composite, see dashboard ds_score_nrs.
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.suppress = 0
search = | makeresults | eval k=1 | appendcols [ search `index_catalyst` sourcetype="cisco:dnac:devicehealth" DeviceFamily="Unified AP" | eval d=coalesce(deviceName, DeviceName) | stats latest(coalesce(reachabilityHealth, Reachability)) as r by d | eval ok=if(upper(r)="REACHABLE" OR upper(r)="UP",1,0) | stats avg(ok) as a1 ] | appendcols [ search `index_catalyst` sourcetype="cisco:dnac:client" | where 'health.overallScore'>=0 | stats avg('health.overallScore') as cha | eval q=round((coalesce(cha,0))*10,2) | fillnull value=50 q ] | fillnull value=1 a1 | eval A=a1*100, R=a1*100, Q=coalesce(q,50), D=0.95 | eval NRS=round((A*`nrs_w_nrs_a`+R*`nrs_w_nrs_r`+Q*`nrs_w_nrs_q`)*D,2) | where NRS<80

[NetOps Alert - Occupancy Surge 3x]
description = Device presence count versus prior bucket exceeds 3x (Spaces firehose).
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -4h
dispatch.latest_time = now
alert.suppress = 0
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="DEVICE_PRESENCE" | spath | eval mac=coalesce('devicePresence.device.macAddress','devicePresence.macAddress') | where isnotnull(mac) | timechart useother=f dc(mac) as u | streamstats count as i | autoregress u as p | where i>1 AND p>0 AND u > 3 * p

[Shared - ds_dev_health_trend]
description = Device-health trend (DNAC). h=100 if Reachable AND Managed; 50 if Reachable only; 0 otherwise. \
Used by it_health_v2 (ds_dev_health_trend) and home_launchpad_v3 (ds_dev_health_trend_exec).
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" | eval h=case(Reachability=="Reachable" AND match(Manageability,"^Managed"),100, Reachability=="Reachable",50, 1==1,0) | timechart fixedrange=false avg(h) as score

[Shared - ds_annotations]
description = Op Florida Ready event-annotation overlay (3 fixed dates). Used by workplace_spog_v2 \
and netops_readiness_v2 as a chart annotation source.
dispatch.earliest_time = -30d
dispatch.latest_time = now
search = | makeresults count=3 \
| streamstats count as id \
| eval _time=case(id=1, strptime("2026-04-13 12:00:00","%Y-%m-%d %H:%M:%S"), id=2, strptime("2026-04-14 12:00:00","%Y-%m-%d %H:%M:%S"), id=3, strptime("2026-04-15 12:00:00","%Y-%m-%d %H:%M:%S")) \
| eval label=case(id=1, "Op Florida Ready - Day 1", id=2, "Op Florida Ready - Day 2", id=3, "Op Florida Ready - Day 3") \
| eval annotation_color=case(id=1, "#0B5394", id=2, "#0B5394", id=3, "#0B5394") \
| table _time label annotation_color
