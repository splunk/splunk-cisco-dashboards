search = | tstats `summariesonly` latest(Test_Metrics.metric_name:network.latency) as latency, latest(Test_Metrics.metric_name:network.loss) as loss, latest(Test_Metrics.metric_name:http.server.request.availability) as http_avail, latest(Test_Metrics.metric_name:web.page_load.duration) as page_dur FROM datamodel="Cisco_ThousandEyes.Test_Metrics" BY Test_Metrics.thousandeyes.test.name, Test_Metrics.thousandeyes.test.type, Test_Metrics.server.address \
| rename Test_Metrics.thousandeyes.test.name as test, Test_Metrics.thousandeyes.test.type as type, Test_Metrics.server.address as target \
| eval latency=round(latency,1), loss=round(loss,2), http_avail=round(http_avail,1), page_dur=round(page_dur,0), status=case(isnotnull(loss) AND (loss>=5 OR latency>=200), "Critical", isnotnull(loss) AND (loss>=1 OR latency>=100), "Degraded", isnotnull(http_avail) AND http_avail<95, "Degraded", 1==1, "Healthy") \
