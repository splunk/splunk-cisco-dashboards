| eval evt=case(EventCode==4624,"AD_Success", EventCode==4625,"AD_Failed", EventCode==4740,"AD_Lockout", match(_raw,"5200"),"ISE_Success", match(_raw,"5400"),"ISE_Failed", 1==1,"Other") \
| where evt!="Other" \
| timechart span=1d count by evt

