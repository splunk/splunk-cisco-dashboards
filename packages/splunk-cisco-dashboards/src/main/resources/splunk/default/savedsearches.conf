[IT - Critical Systems - ds_cpu_memory_alerts]
description = Devices with CPU or memory utilization above 80% — identifies resource-constrained network infrastructure before performance degrades.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| where CPUUtilization > 80 OR MemoryUtilization > 80 \
| eval cpu_status=if(CPUUtilization>90,"Critical",if(CPUUtilization>80,"Warning","OK")), mem_status=if(MemoryUtilization>90,"Critical",if(MemoryUtilization>80,"Warning","OK")) \
| table DeviceName, DeviceFamily, Platform, Site, IpAddress, CPUUtilization, CPUHealth, cpu_status, MemoryUtilization, MemoryUtilizationHealth, mem_status, OverallHealth, Uptime \
| sort -CPUUtilization

[IT - Critical Systems - ds_device_health_distribution]
description = Device health score distribution by device family and site — shows the overall health posture of network infrastructure grouped by role.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| stats latest(OverallHealth) as OverallHealth, latest(DeviceFamily) as DeviceFamily by DeviceName \
| eval health_band=case(OverallHealth>=8,"Good (8-10)",OverallHealth>=5,"Fair (5-7)",OverallHealth>=1,"Poor (1-4)",1==1,"No Score") \
| stats count by DeviceFamily, health_band \
| sort DeviceFamily, health_band

[IT - Critical Systems - ds_unreachable_devices]
description = Devices reported as unreachable by Catalyst Center — critical alert for device-down conditions with failure reason.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| stats latest(Reachability) as Reachability, latest(ReachabilityFailureReason) as Reason, latest(OverallHealth) as Health, latest(DeviceFamily) as Family, latest(Platform) as Platform, latest(Site) as Site, latest(IpAddress) as IP, latest(SerialNumber) as Serial, latest(_time) as last_seen by DeviceName \
| where Reachability!="Reachable" \
| eval last_seen=strftime(last_seen, "%Y-%m-%d %H:%M") \
| table DeviceName, Family, Platform, Site, IP, Reachability, Reason, Health, last_seen \
| sort -last_seen

[IT - Critical Systems - ds_recent_reboots]
description = Devices that rebooted within the last 4 hours (uptime < 14400 seconds) — identifies unexpected restarts that may indicate crashes or maintenance.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" UptimeSeconds<14400 \
| stats latest(DeviceName) as DeviceName, latest(DeviceFamily) as DeviceFamily, latest(Platform) as Platform, latest(Site) as Site, latest(IpAddress) as IpAddress, latest(UptimeSeconds) as UptimeSeconds, latest(Uptime) as Uptime, latest(DeviceImgVersion) as DeviceImgVersion, latest(OverallHealth) as OverallHealth, latest(SerialNumber) as SerialNumber by DeviceID \
| eval uptime_min=round(UptimeSeconds/60,1) \
| table DeviceName, DeviceFamily, Platform, Site, IpAddress, uptime_min, Uptime, DeviceImgVersion, OverallHealth, SerialNumber \
| sort uptime_min \
| rename uptime_min as "Uptime (min)", DeviceImgVersion as "Image Version"

[IT - Critical Systems - ds_top_issue_devices]
description = Top 20 devices ranked by Catalyst Center issue count — highlights the most problematic infrastructure.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| stats latest(IssueCount) as issue_count, latest(OverallHealth) as health, latest(CPUUtilization) as cpu, latest(MemoryUtilization) as memory, latest(DeviceFamily) as family, latest(Platform) as platform, latest(Site) as site, latest(IpAddress) as ip by DeviceName \
| where issue_count>0 OR health<5 OR cpu>80 OR memory>80 \
| eval concern=case(issue_count>5, "High Issues (".issue_count.")", health<5, "Low Health (".health.")", cpu>80, "High CPU (".cpu."%)", memory>80, "High Memory (".memory."%)", issue_count>0, "Issues (".issue_count.")", 1==1, "Monitor") \
| sort -issue_count, health, -cpu \
| rename DeviceName as Device

