| stats latest(UtilizationGhz24) as UtilizationGhz24, latest(UtilizationGhz50) as UtilizationGhz50, latest(ClientCountGhz24) as ClientCountGhz24, latest(ClientCountGhz50) as ClientCountGhz50, latest(Site) as Site by DeviceID \
