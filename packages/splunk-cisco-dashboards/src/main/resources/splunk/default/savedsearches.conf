| sort -total_issues \
| eval categories=mvjoin(categories, ", ") \
| rename SiteName as Site

[IT - Critical Systems - ds_issue_by_priority]
description = Catalyst Center issue distribution by priority and category — shows P1/P2/P3/P4 breakdown for the issue severity donut chart.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:issue" \
| stats count by IssueSpecificPriority \
| sort IssueSpecificPriority

