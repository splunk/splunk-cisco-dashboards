# Scheduled, materialized, and explicit compatibility dependency searches only.
# Dashboard ad-hoc searches live in searchbase.conf and nav dashboard XML.

[Executive Dashboard - Score Pipeline]
description = Scheduled pipeline: computes IT, Security, UX, Building, and Overall domain scores in one pass and outputs to exec_scores.csv for instant dashboard loading.
dispatch.earliest_time = -8h
dispatch.latest_time = now
cron_schedule = 2 */4 * * *
enableSched = 1
allow_skew = 5m
dispatch.ttl = 16200
search = `index_catalyst` sourcetype="cisco:dnac:networkhealth" category="All" \
| stats latest(healthScore) as val \
| eval metric="net_h" \
| append \
[| search `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| stats latest(Reachability) as R, latest(Manageability) as M by DeviceID \
| eval h=case(R=="Reachable" AND match(M,"^Managed"),100, R=="Reachable",50, 1==1,0) \
| stats avg(h) as val \
| eval val=round(val), metric="dev_h"] \
| append \
[| search `index_catalyst` sourcetype="cisco:dnac:compliance" ComplianceStatus!="NOT_APPLICABLE" \
| eval ok=if(ComplianceStatus=="COMPLIANT" OR ComplianceStatus=="COMPLIANT_WARNING",1,0) \
| stats sum(ok) as c, count as t \
| eval val=if(t>0, round(c/t*100), null()), metric="comp_h"] \
| append \
[| search `index_identity` sourcetype="cisco:ise:syslog" (CISE_Passed_Authentications OR CISE_Failed_Attempts) \
| eval p=if(match(_raw,"CISE_Passed"),1,0) \
| stats sum(p) as pass, count as t \
| eval val=if(t>0, round(pass/t*100), null()), metric="ise_h"] \
| append \
[| search `index_windows` sourcetype="XmlWinEventLog" (EventCode=4624 OR EventCode=4625) \
| eval ok=if(EventCode=="4624",1,0) \
| stats sum(ok) as pass, count as t \
| eval val=if(t>0, round(pass/t*100), null()), metric="ad_h"] \
| append \
[| search `index_catalyst` sourcetype="cisco:dnac:clienthealth" clientType="ALL" scoreType="ALL" scoreValue>=0 \
| stats latest(scoreValue) as val \
| eval metric="client_h"] \
| append \
[| search `index_catalyst` sourcetype="cisco:dnac:devicehealth" (DeviceFamily="Unified AP" OR DeviceFamily="Access Points") \
| stats latest(OverallHealth) as h by DeviceID \
| eval ap_h=h*10 \
| stats avg(ap_h) as val \
| eval val=round(val), metric="ap_h"] \
| append \
[| search `index_spaces` sourcetype="cisco:spaces:firehose" eventType="DEVICE_PRESENCE" \
| stats latest(devicePresence.activeDevicesCount) as active, latest(devicePresence.inActiveDevicesCount) as inactive by devicePresence.location.name \
| eval total=active+inactive, pct=if(total>0, round(active/total*100), null()) \
| stats avg(pct) as val \
| eval val=round(val), metric="spaces_dev_h"] \
| append \
[| search `index_spaces` sourcetype="cisco:spaces:firehose" eventType="SPACE_OCCUPANCY" \
| stats latest(spaceOccupancy.peoplePresence) as occupied by spaceOccupancy.space.name \
| eval occupied=if(occupied=="true", 1, 0) \
| stats count as total_rooms, sum(occupied) as rooms_occupied \
| eval val=if(total_rooms>0, round(rooms_occupied/total_rooms*100), null()), metric="occ_h"] \
| stats values(eval(if(metric=="net_h",val,null()))) as net_h, values(eval(if(metric=="dev_h",val,null()))) as dev_h, values(eval(if(metric=="comp_h",val,null()))) as comp_h, values(eval(if(metric=="ise_h",val,null()))) as ise_h, values(eval(if(metric=="ad_h",val,null()))) as ad_h, values(eval(if(metric=="client_h",val,null()))) as client_h, values(eval(if(metric=="ap_h",val,null()))) as ap_h, values(eval(if(metric=="spaces_dev_h",val,null()))) as spaces_dev_h, values(eval(if(metric=="occ_h",val,null()))) as occ_h \
| eval it_n=0, it_t=0 \
| eval it_n=if(isnotnull(net_h),it_n+1,it_n), it_t=if(isnotnull(net_h),it_t+net_h,it_t) \
| eval it_n=if(isnotnull(dev_h),it_n+1,it_n), it_t=if(isnotnull(dev_h),it_t+dev_h,it_t) \
| eval it_n=if(isnotnull(comp_h),it_n+1,it_n), it_t=if(isnotnull(comp_h),it_t+comp_h,it_t) \
| eval it_score=if(it_n>0, round(it_t/it_n), 0) \
| eval sec_n=0, sec_t=0 \
| eval sec_n=if(isnotnull(ise_h),sec_n+1,sec_n), sec_t=if(isnotnull(ise_h),sec_t+ise_h,sec_t) \
| eval sec_n=if(isnotnull(ad_h),sec_n+1,sec_n), sec_t=if(isnotnull(ad_h),sec_t+ad_h,sec_t) \
| eval sec_score=if(sec_n>0, round(sec_t/sec_n), 0) \
| eval ux_score=case(client_h>=0 AND isnotnull(dev_h), round((client_h+dev_h)/2), client_h>=0, round(client_h), isnotnull(dev_h), round(dev_h), 1==1, 0) \
| eval bldg_n=0, bldg_t=0 \
| eval bldg_n=if(isnotnull(ap_h),bldg_n+1,bldg_n), bldg_t=if(isnotnull(ap_h),bldg_t+ap_h,bldg_t) \
| eval bldg_n=if(isnotnull(spaces_dev_h),bldg_n+1,bldg_n), bldg_t=if(isnotnull(spaces_dev_h),bldg_t+spaces_dev_h,bldg_t) \
| eval bldg_n=if(isnotnull(occ_h),bldg_n+1,bldg_n), bldg_t=if(isnotnull(occ_h),bldg_t+occ_h,bldg_t) \
| eval bldg_n=if(isnotnull(comp_h),bldg_n+1,bldg_n), bldg_t=if(isnotnull(comp_h),bldg_t+comp_h,bldg_t) \
| eval bldg_score=if(bldg_n>0, round(bldg_t/bldg_n), 0) \
| eval overall_n=0, overall_t=0 \
| eval overall_n=if(it_score>0,overall_n+1,overall_n), overall_t=if(it_score>0,overall_t+it_score,overall_t) \
| eval overall_n=if(sec_score>0,overall_n+1,overall_n), overall_t=if(sec_score>0,overall_t+sec_score,overall_t) \
| eval overall_n=if(ux_score>0,overall_n+1,overall_n), overall_t=if(ux_score>0,overall_t+ux_score,overall_t) \
| eval overall_n=if(bldg_score>0,overall_n+1,overall_n), overall_t=if(bldg_score>0,overall_t+bldg_score,overall_t) \
| eval overall_score=if(overall_n>0, round(overall_t/overall_n), 0) \
| eval updated=strftime(now(), "%Y-%m-%d %H:%M:%S") \
| table it_score sec_score ux_score bldg_score overall_score net_h dev_h comp_h ise_h ad_h client_h ap_h spaces_dev_h occ_h updated \
| outputlookup exec_scores CreateInApp=true Create_Empty=true Override_If_Empty=false

[Executive Dashboard - Data Status Pipeline]
description = Scheduled pipeline: checks data ingestion status for all Cisco integrations using targeted sourcetype filters instead of index=*. Outputs to data_status.csv.
dispatch.earliest_time = -4h
dispatch.latest_time = now
cron_schedule = 5 */4 * * *
enableSched = 1
allow_skew = 5m
dispatch.ttl = 16200
search = | tstats count where `index_catalyst` sourcetype="cisco:dnac:*" by sourcetype \
| append \
[| tstats count where `index_meraki` sourcetype="meraki:*" by sourcetype] \
| append \
[| tstats count where `index_identity` sourcetype="cisco:ise:syslog" by sourcetype] \
| append \
[| tstats count where `index_windows` (sourcetype="XmlWinEventLog" OR sourcetype="ActiveDirectory" OR sourcetype="MSAD:*") by sourcetype] \
| append \
[| tstats count where `index_dhcp` sourcetype="DhcpSrvLog" by sourcetype] \
| append \
[| tstats count where `index_firewall` (sourcetype="cisco:asa" OR sourcetype="cisco:ftd" OR sourcetype="cisco:sfw:estreamer" OR sourcetype="cisco:firepower:syslog" OR sourcetype="cisco:estreamer:*") by sourcetype] \
| append \
[| tstats count where `index_network` sourcetype="cisco:ios" by sourcetype] \
| append \
[| tstats count where `index_security` (sourcetype="cisco:cloud_security:*" OR sourcetype="cisco:xdr:*" OR sourcetype="cisco:esa:*" OR sourcetype="cisco:wsa:*" OR sourcetype="cisco:sdwan:*" OR sourcetype="ms:defender:*") by sourcetype] \
| append \
[| tstats count where `index_spaces` sourcetype="cisco:spaces:*" by sourcetype] \
| append \
[| tstats count where `index_thousandeyes` sourcetype="cisco:thousandeyes:*" by sourcetype] \
| stats sum(count) as events_24h by sourcetype \
| eval source=case( match(sourcetype,"meraki"),"Meraki", match(sourcetype,"cisco:ise"),"ISE Syslog", match(sourcetype,"cisco:ios"),"IOS Syslog", match(sourcetype,"cisco:asa"),"ASA Firewall", match(sourcetype,"cisco:ftd"),"FTD Firewall", match(sourcetype,"cisco:estreamer") OR match(sourcetype,"cisco:sfw:estreamer"),"eStreamer IPS", match(sourcetype,"cisco:cloud_security") OR match(sourcetype,"cisco:cloud:"),"SSE / Cloud Security", match(sourcetype,"cisco:sdwan"),"SD-WAN", match(sourcetype,"cisco:dnac"),"Catalyst Center (DNAC)", match(sourcetype,"cisco:dc:nd"),"DC Networking (ND)", match(sourcetype,"stream"),"NetFlow / Stream", match(sourcetype,"cisco:intersight"),"Intersight", match(sourcetype,"cisco:spaces"),"Cisco Spaces", match(sourcetype,"cisco:thousandeyes"),"ThousandEyes", match(sourcetype,"XmlWinEventLog") OR match(sourcetype,"ActiveDirectory") OR match(sourcetype,"MSAD"),"Windows / Active Directory", match(sourcetype,"DhcpSrvLog"),"Windows DHCP", match(sourcetype,"cisco:xdr"),"Cisco XDR", match(sourcetype,"cisco:esa"),"Email Security (ESA)", match(sourcetype,"cisco:wsa"),"Web Security (WSA)", match(sourcetype,"ms:defender"),"Microsoft Defender", 1==1, sourcetype) \
| stats sum(events_24h) as events_24h by source \
| eval status="Connected", events_24h=case( events_24h>=1000000, tostring(round(events_24h/1000000,1))."M", events_24h>=1000, tostring(round(events_24h/1000,1))."K", 1==1, tostring(events_24h)), updated=strftime(now(), "%Y-%m-%d %H:%M:%S") \
| fields source status events_24h updated \
| outputlookup data_status CreateInApp=true Create_Empty=true Override_If_Empty=false

[Executive Dashboard - Site Topology Lookup Generator]
description = Snapshots cisco:dnac:site:topology into site_topology_lookup.csv. Keyed on `id` (DNAC site UUID). Used as a join target for client/clienthealth/audit:logs to resolve siteId/siteHierarchyId UUIDs into human-readable site names + GPS + addresses. Schedule is conservative (every hour) since site:topology is a slow snapshot input. Floor rows are enriched with their parent building's `address`, `country`, `lat`, and `lon` so any consumer joining on a leaf UUID gets a complete location regardless of whether the leaf is a building or a floor. **Dual-schema note:** this sourcetype carries TWO different payload shapes upstream — event-style (Cisco's stock TA demo feed: `type="NETWORK"`, `eventId`, `name="topology_link_added"`, etc.) and hierarchy-style (real Catalyst Center site snapshots: `type IN ("global","area","building","floor")`, `id` UUID, `nameHierarchy`). The generator filters to hierarchy-style explicitly so demo-feed noise can never pollute the lookup, even if both schemas coexist on the same indexer.
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = 7 * * * *
enableSched = 1
allow_skew = 5m
dispatch.ttl = 16200
search = `index_catalyst` sourcetype="cisco:dnac:site:topology" type IN ("global","area","building","floor") \
| dedup id sortby -_time \
| eval Site=`dnac_site_normalize(nameHierarchy)` \
| eval lat=tonumber(latitude), lon=tonumber(longitude) \
| eval updated=strftime(now(), "%Y-%m-%d %H:%M:%S") \
| join type=left parentId \
   [ search `index_catalyst` sourcetype="cisco:dnac:site:topology" type="building" \
     | dedup id sortby -_time \
     | eval parentId=id \
     | rename latitude as buildingLat, longitude as buildingLon, address as buildingAddress, country as buildingCountry, name as buildingName \
     | table parentId buildingLat buildingLon buildingAddress buildingCountry buildingName ] \
| eval lat=if(isnotnull(lat),lat,tonumber(buildingLat)), lon=if(isnotnull(lon),lon,tonumber(buildingLon)), address=if(isnotnull(address),address,buildingAddress), country=if(isnotnull(country),country,buildingCountry), inheritedFromBuilding=if(type="floor",buildingName,null()) \
| table id name type parentId nameHierarchy Site lat lon address country floorNumber rfModel cisco_catalyst_host inheritedFromBuilding updated \
| outputlookup site_topology_lookup CreateInApp=true Create_Empty=true Override_If_Empty=false

[Executive Dashboard - ds_it_score]
description = Compatibility dependency for composite executive score searches. Canonical metadata lives in searchbase.conf.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:networkhealth" category="All" \
| stats latest(healthScore) as net_h \
| append \
[| search `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| stats latest(Reachability) as Reachability, latest(Manageability) as Manageability by DeviceID \
| eval h=case(Reachability=="Reachable" AND match(Manageability,"^Managed"),100, Reachability=="Reachable",50, 1==1,0) \
| stats avg(h) as dh \
| eval dev_h=round(dh)] \
| append \
[| search `index_catalyst` sourcetype="cisco:dnac:compliance" ComplianceStatus!="NOT_APPLICABLE" \
| eval ok=if(ComplianceStatus=="COMPLIANT" OR ComplianceStatus=="COMPLIANT_WARNING",1,0) \
| stats sum(ok) as compliant, count as total \
| eval comp_h=if(total>0, round(compliant/total*100), null())] \
| stats values(net_h) as n, values(dev_h) as dv, values(comp_h) as c \
| eval parts=0, total=0 \
| eval parts=if(isnotnull(n), parts+1, parts), total=if(isnotnull(n), total+n, total) \
| eval parts=if(isnotnull(dv), parts+1, parts), total=if(isnotnull(dv), total+dv, total) \
| eval parts=if(isnotnull(c), parts+1, parts), total=if(isnotnull(c), total+c, total) \
| eval score=if(parts>0, round(total/parts), 0) \
| fields score

[Executive Dashboard - ds_sec_score]
description = Compatibility dependency for composite executive score searches. Canonical metadata lives in searchbase.conf.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_identity` sourcetype="cisco:ise:syslog" (CISE_Passed_Authentications OR CISE_Failed_Attempts) \
| eval p=if(match(_raw,"CISE_Passed"),1,0) \
| stats sum(p) as pass, count as t \
| eval ise_h=if(t>0, round(pass/t*100), null()) \
| append \
[| search `index_windows` sourcetype="XmlWinEventLog" (EventCode=4624 OR EventCode=4625) \
| eval ok=if(EventCode=="4624",1,0) \
| stats sum(ok) as pass2, count as t2 \
| eval ad_h=if(t2>0, round(pass2/t2*100), null())] \
| stats values(ise_h) as i, values(ad_h) as a \
| eval parts=0, total=0 \
| eval parts=if(isnotnull(i), parts+1, parts), total=if(isnotnull(i), total+i, total) \
| eval parts=if(isnotnull(a), parts+1, parts), total=if(isnotnull(a), total+a, total) \
| eval score=if(parts>0, round(total/parts), 0) \
| fields score

[Executive Dashboard - ds_ux_score]
description = Compatibility dependency for composite executive score searches. Canonical metadata lives in searchbase.conf.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:clienthealth" \
| where clientType="ALL" AND scoreType="ALL" AND scoreValue>=0 \
| stats latest(scoreValue) as sv \
| eval client_h=sv \
| append \
[| search `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| stats latest(Reachability) as Reachability, latest(Manageability) as Manageability by DeviceID \
| eval h=case(Reachability=="Reachable" AND match(Manageability,"^Managed"),100, Reachability=="Reachable",50, 1==1,0) \
| stats avg(h) as dev_h \
| eval dev_h=round(dev_h)] \
| stats values(client_h) as ch, values(dev_h) as dh \
| eval score=case(ch>=0 AND isnotnull(dh), round((ch+dh)/2), ch>=0, ch, isnotnull(dh), dh, 1==1, 0) \
| fields score

[Executive Dashboard - ds_bldg_score]
description = Compatibility dependency for composite executive score searches. Canonical metadata lives in searchbase.conf.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" (DeviceFamily="Unified AP" OR DeviceFamily="Access Points") \
| stats latest(OverallHealth) as h by DeviceID \
| eval ap_h=h*10 \
| stats avg(ap_h) as ap_h \
| eval ap_h=round(ap_h) \
| append \
[| search `index_spaces` sourcetype="cisco:spaces:firehose" eventType="DEVICE_PRESENCE" \
| stats latest(devicePresence.activeDevicesCount) as active, latest(devicePresence.inActiveDevicesCount) as inactive by devicePresence.location.name \
| eval total=active+inactive, pct=if(total>0, round(active/total*100), null()) \
| stats avg(pct) as dev_h \
| eval dev_h=round(dev_h)] \
| append \
[| search `index_spaces` sourcetype="cisco:spaces:firehose" eventType="SPACE_OCCUPANCY" \
| stats latest(spaceOccupancy.peoplePresence) as occupied by spaceOccupancy.space.name \
| eval occupied=if(occupied=="true", 1, 0) \
| stats count as total_rooms, sum(occupied) as rooms_occupied \
| eval occ_h=if(total_rooms>0, round(rooms_occupied/total_rooms*100), null())] \
| append \
[| search `index_catalyst` sourcetype="cisco:dnac:compliance" ComplianceStatus!="NOT_APPLICABLE" \
| eval ok=if(ComplianceStatus=="COMPLIANT" OR ComplianceStatus=="COMPLIANT_WARNING",1,0) \
| stats sum(ok) as compliant, count as total \
| eval comp_h=if(total>0, round(compliant/total*100), null())] \
| stats values(ap_h) as a, values(dev_h) as d, values(occ_h) as o, values(comp_h) as c \
| eval parts=0, total=0 \
| eval parts=if(isnotnull(a), parts+1, parts), total=if(isnotnull(a), total+a, total) \
| eval parts=if(isnotnull(d), parts+1, parts), total=if(isnotnull(d), total+d, total) \
| eval parts=if(isnotnull(o), parts+1, parts), total=if(isnotnull(o), total+o, total) \
| eval parts=if(isnotnull(c), parts+1, parts), total=if(isnotnull(c), total+c, total) \
| eval score=if(parts>0, round(total/parts), 0) \
| fields score

[Security Resilience - ds_security_events]
description = Recent high-priority security events aggregated by source, event type, and severity from ASA, ISE, Firepower, SSE, DNAC, and Active Directory.
dispatch.earliest_time = -4h
dispatch.latest_time = now
cron_schedule = 23 */4 * * *
enableSched = 1
allow_skew = 5m
dispatch.ttl = 16200
search = (`index_firewall` sourcetype="cisco:asa" ("Deny" OR "denied" OR "Teardown")) OR (`index_identity` sourcetype="cisco:ise:syslog" "5400") OR (`index_security` (sourcetype="cisco:cloud_security:dns" OR sourcetype="cisco:cloud_security:firewall") action="Blocked") OR (`index_firewall` sourcetype="cisco:estreamer:data") OR (`index_catalyst` sourcetype="cisco:dnac:audit:logs" name="LOGIN_USER_EVENT") OR (`index_windows` sourcetype="XmlWinEventLog" (EventCode=4625 OR EventCode=4740 OR EventCode=4672)) \
| eval Source=case(sourcetype=="cisco:asa","ASA", sourcetype=="cisco:ise:syslog","ISE", match(sourcetype,"estreamer"),"Firepower", match(sourcetype,"cloud_security:dns"),"Umbrella DNS", match(sourcetype,"cloud_security:firewall"),"Umbrella FW", match(sourcetype,"dnac:audit"),"DNAC", sourcetype=="XmlWinEventLog","Active Directory", 1==1,sourcetype) \
| eval Event=case(sourcetype=="cisco:asa" AND match(_raw,"(?i)deny"),"Firewall Deny", sourcetype=="cisco:asa" AND match(_raw,"(?i)teardown"),"Connection Teardown", sourcetype=="cisco:ise:syslog","Authentication Failure", match(sourcetype,"estreamer"),"Intrusion Event", match(sourcetype,"cloud_security:dns"),"DNS Blocked", match(sourcetype,"cloud_security:firewall"),"Web Blocked", match(sourcetype,"dnac:audit"),"Login Attempt", EventCode==4625,"Logon Failed", EventCode==4740,"Account Lockout", EventCode==4672,"Privileged Logon", 1==1,"Security Event") \
| eval Severity=case(match(_raw,"(?i)(crit|emerg|alert)"),"Critical", match(_raw,"(?i)(err|deny|denied|block|5400)") OR EventCode==4625 OR EventCode==4740,"High", match(_raw,"(?i)(warn)") OR EventCode==4672,"Medium", 1==1,"Low") \
| eval src=coalesce(src_ip, src, Source_Network_Address, "—"), dest=coalesce(dest_ip, dest, dst, Target_Server_Name, "—") \
| stats count as Count, latest(_time) as _time, values(src) as "Source IP", values(dest) as Destination by Source, Event, Severity \
| eval Time=strftime(_time, "%Y-%m-%d %H:%M:%S"), "Source IP"=mvindex('Source IP', 0, 4), Destination=mvindex(Destination, 0, 4) \
| sort -_time \
| table Time Source Event Severity "Source IP" Destination Count

[Asset Inventory - Build Lookup]
description = Builds the unified asset inventory lookup by correlating devices from Catalyst Center, Meraki, IOS syslog, ASA/FTD/Firepower, ISE NADs, F5 BIG-IP, and Windows/AD. Deduplicates by device_name (lowercase), preferring the richest source. Adds device_name_short for FQDN-vs-short matching. Outputs to asset_inventory.csv.
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 5 2 * * *
enableSched = 1
allow_skew = 5m
dispatch.ttl = 90000
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| stats latest(DeviceFamily) as device_family, latest(DeviceType) as device_type_raw, latest(Platform) as platform_id, latest(IpAddress) as ip_address, latest(MACAddress) as mac_address, latest(ImageVersion) as software_version, latest(SerialNumber) as serial_number, latest(Reachability) as reachability, latest(Manageability) as manageability, latest(DeviceRole) as device_role, latest(DeviceSeries) as device_series, latest(Site) as location by DeviceName \
| rename DeviceName as device_name \
| eval management_source="Catalyst Center", device_type=case(device_family=="Unified AP" OR device_family=="Access Points","AP", device_family=="Switches and Hubs","Switch", device_family=="Wireless Controller","WLC", device_family=="Routers","Router", 1==1,device_family), health_score=case(reachability=="Reachable" AND match(manageability,"^Managed"),100, reachability=="Reachable",50, 1==1,0), last_seen=now() \
| append \
[| search `index_catalyst` sourcetype="cisco:dnac:compliance" \
| stats latest(ComplianceStatus) as compliance_status by ComplianceDeviceID DeviceName \
| rename DeviceName as device_name \
| fields _time, device_name compliance_status] \
| stats latest(_time) as _time, latest(device_type) as device_type, latest(device_family) as device_family, latest(device_type_raw) as device_type_raw, latest(platform_id) as platform_id, latest(ip_address) as ip_address, latest(mac_address) as mac_address, latest(software_version) as software_version, latest(serial_number) as serial_number, latest(health_score) as health_score, latest(compliance_status) as compliance_status, latest(management_source) as management_source, latest(device_role) as device_role, latest(device_series) as device_series, latest(location) as location, latest(last_seen) as last_seen by device_name \
| append \
[| search `index_meraki` sourcetype="meraki:devicesavailabilitieschangehistory" \
| stats latest(device.model) as platform_id, latest(device.productType) as meraki_type, latest(network.name) as location by device.serial device.name \
| rename device.serial as serial_number, device.name as device_name \
| where len(device_name)>0 \
| eval management_source="Meraki Dashboard", device_family=case(meraki_type=="wireless","Meraki Wireless", meraki_type=="switch","Meraki Switch", meraki_type=="appliance","Meraki Appliance", meraki_type=="cellularGateway","Meraki Cellular Gateway", meraki_type=="sensor","Meraki Sensor", 1==1,"Meraki ".meraki_type), device_type=case(meraki_type=="wireless","AP", meraki_type=="switch","Switch", meraki_type=="appliance","Firewall", meraki_type=="cellularGateway","Gateway", meraki_type=="sensor","Sensor", 1==1,meraki_type), last_seen=now() \
| fields device_name device_type device_family platform_id serial_number location management_source last_seen] \
| append \
[| search `index_network` sourcetype="cisco:ios" \
| rex "^\d+/\d+/\d+\s+\d+:\d+:\d+\s+(?<device_name>[\w\-\.]+)" \
| where device_name!="AP" \
| stats count by device_name \
| eval management_source="IOS Syslog", device_type=case(match(device_name,"(?i)rtr|router"),"Router", match(device_name,"(?i)swi|switch|sw\d"),"Switch", match(device_name,"(?i)wlc|wireless"),"WLC", 1==1,"Network Device"), device_family="IOS Device", last_seen=now() \
| fields device_name device_type device_family management_source last_seen] \
| append \
[| tstats `summariesonly` count from datamodel=Network_Traffic by All_Traffic.dvc \
| rename All_Traffic.dvc as device_name \
| eval device_name=lower(device_name) \
| where isnotnull(device_name) AND device_name!="" AND NOT match(device_name, "^[0-9a-f]{8}-[0-9a-f]{4}-") \
| stats count by device_name \
| eval management_source="Firewall Syslog", device_type="Firewall", device_family="ASA/FTD/Firepower", last_seen=now() \
| fields device_name device_type device_family management_source last_seen] \
| append \
[| search `index_identity` sourcetype="cisco:ise:syslog" \
| rex "NetworkDeviceName=(?<device_name>[^,]+)" \
| where isnotnull(device_name) AND device_name!="DefaultNetworkDevice" \
| stats count by device_name \
| eval management_source="ISE NAD", device_type=case(match(device_name,"(?i)wlc|wireless"),"WLC", match(device_name,"(?i)sw|switch"),"Switch", match(device_name,"(?i)rtr|router"),"Router", match(device_name,"(?i)fw|asa|vpn"),"Firewall", 1==1,"Network Device"), device_family="ISE Network Access Device", last_seen=now() \
| fields device_name device_type device_family management_source last_seen] \
| append \
[| search `index_f5` sourcetype="f5:bigip:management:device:icontrol" \
| stats latest(hostname) as device_name, latest(managementIp) as ip_address, latest(version) as software_version, latest(marketingName) as device_series, latest(platform) as platform_id by name \
| eval device_name=if(isnotnull(device_name),device_name,name), management_source="F5 iControl", device_type="Load Balancer", device_family="F5 BIG-IP", last_seen=now() \
| fields device_name device_type device_family platform_id ip_address software_version device_series management_source last_seen] \
| append \
[| search `index_windows` (sourcetype="XmlWinEventLog" OR sourcetype="ActiveDirectory" OR sourcetype="MSAD:NT6:DNS") \
| stats count by host \
| rename host as device_name \
| eval management_source="Windows/AD", device_type="Server", device_family="Windows Server", last_seen=now() \
| fields device_name device_type device_family management_source last_seen] \
| append \
[| search `index_dhcp` sourcetype="DhcpSrvLog" \
| stats count by host \
| rename host as device_name \
| eval management_source="Windows DHCP", device_type="Server", device_family="DHCP Server", last_seen=now() \
| fields device_name device_type device_family management_source last_seen] \
| eventstats values(management_source) as all_sources by device_name \
| eval management_source=mvjoin(all_sources, ", "), source_priority=case(match(management_source,"Catalyst Center"),1, match(management_source,"Meraki"),2, match(management_source,"F5"),3, match(management_source,"Firewall Syslog"),4, match(management_source,"IOS Syslog"),5, match(management_source,"ISE"),6, 1==1,7) \
| sort 0 source_priority \
| stats first(*) as * by device_name \
| eval device_name=lower(device_name), device_name_short=lower(if(match(device_name,"^[^\.]+\.[a-zA-Z]"),replace(device_name,"\..*$",""),device_name)), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S") \
| table device_name device_name_short device_type device_family platform_id ip_address mac_address software_version serial_number location device_role device_series health_score compliance_status management_source last_seen \
| sort device_type device_name \
| outputlookup asset_inventory CreateInApp=true Create_Empty=true Override_If_Empty=false

[NetOps Alert - AP Down or Unreachable]
description = Fires when any Unified AP in DNAC is not REACHABLE (coalesce field names). Match local NetOps readiness Q3/Q5.
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.suppress = 0
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" | spath | eval nm=DeviceName, fam=DeviceFamily, r=Reachability | where fam="Unified AP" AND isnotnull(nm) | stats latest(r) as reach by nm | where isnull(reach) OR (upper(reach)!="REACHABLE" AND upper(reach)!="UP") | eval AP=nm, status=reach

[NetOps Alert - AP Saturation Critical]
description = Fires when any AP peak client count exceeds 30 (24+5 GHz).
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.suppress = 0
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" | spath | eval d=DeviceName, fam=DeviceFamily | eval c=coalesce(ClientCountGhz24, 0) + coalesce(ClientCountGhz50, 0) | where fam="Unified AP" AND isnotnull(d) | stats max(c) as peak by d | where peak>30

[NetOps Alert - Client Onboarding Degraded]
description = Any client onboarding time over 3 seconds (per-event threshold; see macro for site-aggregated variant).
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.suppress = 0
search = `index_catalyst` sourcetype="cisco:dnac:client" | spath path=onboarding.onboardingTime output=ot | where isnotnull(ot) AND ot>0 | eval sec=ot/1000 | where sec>3

[NetOps Alert - DNAC P1 Issue Raised]
description = Active P1 issues in DNAC (status + severity coalesced).
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.suppress = 0
search = `index_catalyst` sourcetype="cisco:dnac:issue" | spath | eval st=coalesce(status, IssueStatus), sev=coalesce(severity, IssueSpecificSeverity) | where sev="P1" AND match(lower(tostring(st)), "active|open|new|assigned")

[NetOps Alert - Client Health Collapse]
description = Global average client health (overallScore from cisco:dnac:client) below 5.
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.suppress = 0
search = `index_catalyst` sourcetype="cisco:dnac:client" | spath path=health.overallScore output=h | where isnotnull(h) | stats avg(h) as a | where a<5

[NetOps Alert - NRS Below Threshold]
description = Simplified NRS proxy below 80 (reach + Q + D placeholder). For full composite, see dashboard ds_score_nrs.
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.suppress = 0
search = | makeresults | eval k=1 | appendcols [ search `index_catalyst` sourcetype="cisco:dnac:devicehealth" DeviceFamily="Unified AP" | spath | eval d=DeviceName | stats latest(Reachability) as r by d | eval ok=if(upper(r)="REACHABLE" OR upper(r)="UP",1,0) | stats avg(ok) as a1 ] | appendcols [ search `index_catalyst` sourcetype="cisco:dnac:client" | where 'health.overallScore'>=0 | stats avg(health.overallScore) as cha | eval q=round((coalesce(cha,0))*10,2) | fillnull value=50 q ] | fillnull value=1 a1 | eval A=a1*100, R=a1*100, Q=coalesce(q,50), D=0.95 | eval NRS=round((A*`nrs_w_nrs_a`+R*`nrs_w_nrs_r`+Q*`nrs_w_nrs_q`)*D,2) | where NRS<80

[NetOps Alert - Occupancy Surge 3x]
description = Device presence count versus prior bucket exceeds 3x (Spaces firehose).
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -4h
dispatch.latest_time = now
alert.suppress = 0
search = `index_spaces` sourcetype="cisco:spaces:firehose" eventType="DEVICE_PRESENCE" | spath | eval mac=coalesce('devicePresence.device.macAddress','devicePresence.macAddress') | where isnotnull(mac) | timechart useother=f dc(mac) as u | streamstats count as i | autoregress u as p | where i>1 AND p>0 AND u > 3 * p

# Build 115.4 — Splunk infrastructure discovery.
#
# Discovers all Splunk-deployment hosts (search heads, indexers,
# cluster managers, deployment servers, heavy/universal forwarders,
# IDMs on Cloud, and ES/ITSI search heads) and writes one row per
# host into `splunk_inventory.csv`. The Network Diagram authoring
# page reads this lookup as a SECOND inventory source alongside the
# Cisco asset_inventory feed — operators can drag indexers /
# search-heads onto the canvas, or "Bind to host" a placeholder
# shape to a real Splunk host so the diagram inherits live status
# (`| metadata type=hosts`), vendor (`Splunk`), and model
# (the host's primary role).
#
# The discovery search has TWO branches that both produce host
# rows: the Cloud branch uses naming conventions in
# `_introspection.splunk_resource_usage` (idx-*, sh-*, idm-*,
# c0m1-*, si-*); the Enterprise branch uses real role discovery
# from `_internal` Metrics + `tcpin_connections` + REST
# `/server/info` + `splunkd_access` (for ES / ITSI app
# detection). The first stanza in the search detects whether
# this Splunk instance is Cloud or Enterprise, and the final
# `| where env=splunk_deployment` keeps only the rows from the
# branch that matches the deployment type.
#
# Schedule: daily at 02:30 (offset from the Cisco asset_inventory
# build at 02:05 so the two don't collide on a busy search head).
#
# Source author: customer-provided "Splunk discovery job" SPL,
# trimmed to drop the license-entitlement block since
# is_workload / is_ingest / svc_license / ingest_license aren't
# used by the network-diagram inventory.
[Splunk Inventory - Build Lookup]
description = Discovers Splunk infrastructure hosts (indexers, search heads, SHC members, cluster managers, deployment servers, IDMs, heavy/universal forwarders, ES/ITSI search heads) and writes them to splunk_inventory.csv. Used by the Network Diagram page as the "Splunk" side of the asset inventory.
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = 30 2 * * *
enableSched = 1
allow_skew = 5m
dispatch.ttl = 90000
search = | rest /services/server/info splunk_server=local count=0 \
| fields instance_type \
| eval splunk_deployment=if(isnull(instance_type) OR instance_type="","Enterprise","Cloud") \
| fields splunk_deployment \
| append maxtime=60 maxout=50000 timeout=60 \
    [| tstats summariesonly=true latest(dns_alt_name) as dns_alt_name latest(sh_label) as sh_label count as num_searches WHERE index=_introspection sourcetype=splunk_resource_usage component::Hostwide host IN (idx-*,sh-*,idm-*,c0m1-*,si-*) OR dns_alt_name=* OR sh_label=* earliest=-24h by host \
    | eval label = case(match(host,"^idm-"), "idm", match(host,"^c0m1-"), "cm", match(host,"^idx-"), "indexer", true(), dns_alt_name) \
    | eval role = case(match(host,"^idm-"), "idm", match(host,"^c0m1-"), "cm", match(host,"^idx-"), "indexer", true(), "search_head") \
    | rename host as host_name \
    | eval name=label, splunk_server_name=host_name, lower_splunk_server=host_name, host_fqdn=host_name, host_resolved=host_name, serverName=host_name, is_connected="yes", isForwarding=if(role!="indexer", 1, 0), is_search_head=if(role="search_head", "yes", "no"), env="Cloud" \
    | fields env host_name splunk_server_name lower_splunk_server name label host_fqdn host_resolved serverName role is_search_head is_connected isForwarding num_searches] \
| append maxtime=60 maxout=50000 timeout=60 \
    [| search (index=_internal) earliest=-7d sourcetype=splunkd NOT (CASE(MetricSchemaProcessor)) Metrics TERM(group=instance) TERM(name=instance) (deployment_client OR cluster_search_head OR search_head OR indexer OR cluster_slave OR search_peer OR license_master) NOT (universal_forwarder) \
    | eval mv_roles=split(instance_roles, ", ") \
    | stats count values(instance_roles) as roles values(mv_roles) as mv_roles values(index_cluster_label) as index_cluster_label values(sh_cluster_label) as sh_cluster_label by instance_guid server_name \
    | eval index_cluster_label=if(index_cluster_label="none", "", index_cluster_label), sh_cluster_label=if(sh_cluster_label="none", "", sh_cluster_label) \
    | stats count(eval(mv_roles="indexer")) as indexer count(eval(mv_roles="search_peer")) as search_peer count(eval(mv_roles="cluster_search_head")) as cluster_search_head count(eval(mv_roles="search_head")) as search_head count(eval(mv_roles="cluster_slave")) as cluster_peer count(eval(mv_roles="kv_store")) as kv_store_role count(eval(mv_roles="cluster_master")) as cluster_manager count(eval(mv_roles="license_master")) as license_manager count(eval(mv_roles="deployment_server")) as deployment_server count(eval(mv_roles="deployment_client")) as deployment_client count(eval(mv_roles="shc_captain")) as shc_captain count(eval(mv_roles="shc_member")) as shc_member values(sh_cluster_label) as sh_cluster_label by instance_guid server_name roles index_cluster_label \
    | eval roles=split(roles, ", ") \
    | rename instance_guid as guid \
    | rename server_name as host \
    | eval host=lower(host) \
    | append maxtime=60 maxout=50000 timeout=60 \
        [| search (index=_internal) Metrics sourcetype=splunkd TERM(group=tcpin_connections) earliest=-4h latest=now TERM(fwdType=full) \
        | stats values(connectionType) as tcp_connectionType values(arch) as tcp_arch values(version) as tcp_version values(fwdType) as tcp_fwdType values(os) as tcp_os sum(kb) as tcp_sum_kb dc(host) as tcp_targets_touched by hostname guid \
        | table * \
        | eval hostname = lower(host), isForwarding=1] \
    | append maxtime=60 maxout=50000 timeout=60 \
        [| search index=_introspection component=hostwide earliest=-24h \
        | eval host = lower(host) \
        | stats values(data.cpu_count) as cpu_count values(data.virtual_cpu_count) as vcpu_count values(data.splunk_version) as introspection_splunk_version values(data.os_version) as introspection_os_version by host data.instance_guid \
        | rename data.instance_guid as guid] \
    | append maxtime=60 maxout=50000 timeout=60 \
        [| rest /servicesNS/-/-/server/info splunk_server=* count=0 \
        | eval is_connected = "yes", is_search_head = if(server_roles="search_head", "yes", null()), is_indexer = if(server_roles="indexer" OR isForwarding = 0, "yes", null()), host_resolved = lower(host_resolved), host_fqdn = lower(host_fqdn), lower_splunk_server = lower(splunk_server), host = lower(host), server_roles = mvjoin(server_roles, ",") \
        | fields lower_splunk_server splunk_server host_fqdn host_resolved serverName host is_connected is_search_head is_indexer guid server_roles isForwarding] \
    | stats values(*) as * by guid \
    | append maxtime=60 maxout=50000 timeout=60 \
        [| tstats dc(data.search_props.sid) as num_searches WHERE index=_introspection sourcetype=splunk_resource_usage data.process_type=search earliest=-7d by data.search_props.search_head \
        | rename data.search_props.search_head as host \
        | eval is_search_head = "yes", host = lower(host) \
        | fields host is_search_head num_searches] \
    | append maxtime=60 maxout=50000 timeout=60 \
        [search (index=_internal sourcetype=splunkd_access method=POST CASE(/services/shcluster/member)) OR (index=_internal sourcetype=splunkd_access uri_path = "*/itsi*" OR uri_path="*/SplunkEnterpriseSecuritySuite*") OR (index=_internal sourcetype=splunk_web_access) earliest=-4h \
        | eval host = lower(host) \
        | stats values(uri_path) as uri_path by host \
        | eval is_es = if(uri_path LIKE "%/SplunkEnterpriseSecuritySuite/%", "yes", null()), is_itsi = if(uri_path LIKE "%/itsi/%", "yes", null()) \
        | where isnotnull(is_es) OR isnotnull(is_itsi) \
        | fields host is_es is_itsi] \
    | stats values(*) as * by host \
    | eval primary_role=case(indexer=1,"indexer", cluster_manager=1,"cluster_manager", shc_member=1 OR shc_captain=1,"search_head_cluster", cluster_search_head=1,"cluster_search_head", search_head=1,"search_head", license_manager=1,"license_manager", deployment_server=1,"deployment_server", tcp_fwdType="full","heavy_forwarder", tcp_fwdType="uf","universal_forwarder") \
    | eval index_cluster_label = if(isnull(index_cluster_label) OR index_cluster_label="", null(), index_cluster_label) \
    | eval roles = case(isnull(roles) AND primary_role="heavy_forwarder", "heavy_forwarder", true(), roles) \
    | eval version=coalesce(tcp_version, introspection_splunk_version) \
    | eval label = case(primary_role="cluster_manager", host, primary_role="search_head_cluster", sh_cluster_label, isnotnull(index_cluster_label), index_cluster_label, true(), host) \
    | eval name = case(primary_role = "search_head_cluster" AND is_itsi = "yes", "itsi-shc", primary_role = "search_head_cluster" AND is_es = "yes", "es-shc", primary_role = "search_head_cluster", "shc", primary_role = "indexer" AND isnull(index_cluster_label), "idx", primary_role = "indexer" AND isnotnull(index_cluster_label), "idxc", (primary_role = "search_head" OR primary_role = "cluster_search_head") AND is_itsi = "yes", "itsi", (primary_role = "search_head" OR primary_role = "cluster_search_head") AND is_es = "yes", "es", primary_role = "search_head" OR primary_role = "cluster_search_head" OR is_search_head="yes", "sh", primary_role = "cluster_manager", "cm", primary_role = "heavy_forwarder", "hf", true(), "adhoc") \
    | eval is_search_head = case(primary_role="search_head", "yes", primary_role="indexer" OR primary_role = "heavy_forwarder", "no", true(), is_search_head) \
    | streamstats dc(label) as count by name \
    | eval name = name . "-" . printf("%02d", count) \
    | eval server_roles=split(server_roles, ",") \
    | eval roles = if(isnull(roles) AND is_search_head="yes", "search_head", roles), roles = mvdedup(mvappend(roles,server_roles)) \
    | eval role=mvjoin(roles,","), splunk_server = if(isnull(splunk_server) OR splunk_server="", host, splunk_server) \
    | foreach host host_fqdn host_resolved serverName lower_splunk_server \
        [| eval <<FIELD>> = if(isnull(<<FIELD>>) OR <<FIELD>>="", splunk_server, <<FIELD>>), <<FIELD>> = lower(<<FIELD>>)] \
    | eval _time = now() \
    | fillnull value="no" is_connected \
    | fillnull value=0 num_searches \
    | eval env="Enterprise" \
    | rename host as host_name, splunk_server as splunk_server_name \
    | fields env host_name label role primary_role cluster_manager cluster_peer cluster_search_head count cpu_count deployment_client deployment_server guid host_fqdn host_resolved index_cluster_label indexer introspection_os_version introspection_splunk_version isForwarding is_connected is_es is_indexer is_itsi is_search_head kv_store_role license_manager lower_splunk_server name num_searches roles search_head search_peer serverName server_roles sh_cluster_label shc_captain shc_member splunk_server_name tcp_arch tcp_connectionType tcp_fwdType tcp_os tcp_sum_kb tcp_targets_touched tcp_version vcpu_count version] \
| filldown splunk_deployment \
| where env=splunk_deployment \
| stats latest(*) as * by host_name \
| eval name=if(isnull(name) OR name="", host_name, name), label=if(isnull(label) OR label="", host_name, label) \
| table splunk_server_name lower_splunk_server name label host_name host_fqdn host_resolved serverName guid role primary_role index_cluster_label sh_cluster_label is_search_head is_connected isForwarding num_searches version cpu_count vcpu_count introspection_os_version introspection_splunk_version is_es is_itsi env \
| outputlookup splunk_inventory.csv
