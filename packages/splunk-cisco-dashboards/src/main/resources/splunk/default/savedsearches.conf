| eval evt=case( action=="success" AND sourcetype=="cisco:ise:syslog","ISE_Pass", action=="failure" AND sourcetype=="cisco:ise:syslog","ISE_Fail", action=="success","AD_Success", action=="failure","AD_Failure", action=="lockout","Lockout", 1==1,"Other") \
