[User Experience - ds_te_agents]
description = ThousandEyes per-agent performance — average latency, loss, and jitter per source agent with test count and health status assessment.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = | tstats `summariesonly` avg(Test_Metrics.metric_name:network.latency) as latency_ms, avg(Test_Metrics.metric_name:network.loss) as loss_pct, avg(Test_Metrics.metric_name:network.jitter) as jitter_ms, dc(Test_Metrics.thousandeyes.test.name) as test_count FROM datamodel="Cisco_ThousandEyes.Test_Metrics" BY Test_Metrics.thousandeyes.source.agent.name \
| rename Test_Metrics.thousandeyes.source.agent.name as agent \
| where isnotnull(agent) AND agent!="" \
| eval latency_ms=round(latency_ms,1), loss_pct=round(loss_pct,2), jitter_ms=round(jitter_ms,1), status=if(loss_pct<1 AND latency_ms<100, "Healthy", "Degraded")

