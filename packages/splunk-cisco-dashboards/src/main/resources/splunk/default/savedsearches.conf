[IT - Critical Systems - ds_aaa_server_issues]
description = AAA/RADIUS server reachability issues from Catalyst Center — tracks ISE and RADIUS availability as seen by network devices, critical for 802.1X and guest authentication.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `index_catalyst` sourcetype="cisco:dnac:issue" IssueName="AAA*" \
