search = | tstats count where sourcetype="cisco:dnac:*" OR sourcetype="cisco:asa" OR sourcetype="cisco:ftd" OR sourcetype="cisco:firepower:syslog" OR sourcetype="cisco:sfw:estreamer" OR sourcetype="cisco:estreamer:*" OR sourcetype="cisco:ise:syslog" OR sourcetype="XmlWinEventLog" OR sourcetype="ActiveDirectory" OR sourcetype="MSAD:*" OR sourcetype="cisco:ios" OR sourcetype="meraki:*" OR sourcetype="cisco:spaces:*" OR sourcetype="cisco:xdr:*" OR sourcetype="cisco:cloud_security:*" OR sourcetype="cisco:esa:*" OR sourcetype="cisco:wsa:*" OR sourcetype="cisco:sdwan:*" OR sourcetype="ms:defender:*" OR sourcetype="bms:*" OR sourcetype="DhcpSrvLog" OR sourcetype="cisco:thousandeyes:*" OR sourcetype="f5:bigip:*" by index, sourcetype \
| eval macro=case( match(sourcetype,"^cisco:dnac:"), "index_catalyst", match(sourcetype,"^cisco:(asa|ftd|firepower|sfw:estreamer|estreamer)"), "index_firewall", match(sourcetype,"^cisco:ise:"), "index_identity", match(sourcetype,"^XmlWinEventLog|^ActiveDirectory|^MSAD:"), "index_windows", match(sourcetype,"^cisco:ios"), "index_network", match(sourcetype,"^meraki:"), "index_meraki", match(sourcetype,"^cisco:spaces:"), "index_spaces", match(sourcetype,"^cisco:(xdr|cloud_security|esa|wsa|sdwan)|^ms:defender"), "index_security", match(sourcetype,"^bms:"), "index_bms", match(sourcetype,"^DhcpSrvLog"), "index_dhcp", match(sourcetype,"^cisco:thousandeyes:"), "index_thousandeyes", match(sourcetype,"^f5:bigip:"), "index_f5", 1==1, "unknown") \
