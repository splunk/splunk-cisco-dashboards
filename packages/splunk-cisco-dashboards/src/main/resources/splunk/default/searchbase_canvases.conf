# =====================================================================
# searchbase_canvases.conf - saved Searchbase Canvas layouts
# =====================================================================
#
# Runtime saves are written to local/searchbase_canvases.conf through
# Splunk's conf REST endpoint. This default file exists so the custom
# conf endpoint is registered and can later carry out-of-the-box canvas
# seeds if useful.
#
# Schema (schema_version = 1):
#   title         Friendly canvas title.
#   description   Reserved for future picker notes.
#   updated_at    ISO8601 UTC timestamp of the last save.
#   updated_by    Splunk username of the last saver.
#   tile_count    Number of tiles in payload_json.
#   page_size     Canvas page size: 10, 25, 50, or 100.
#   search_names  Comma-separated list of searchbase search_name values.
#   payload_json  Single-line JSON payload:
#                 { version, canvasName, pageSize, rangeLabel, tiles }.
