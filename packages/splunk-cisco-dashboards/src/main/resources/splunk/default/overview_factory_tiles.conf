# overview_factory_tiles.conf - shared factory tile layout for the Overview page.
#
# Operators can update these stanzas from the Overview tile picker via
# "Save defaults". Runtime writes go to local/overview_factory_tiles.conf
# so packaged defaults remain upgrade-safe. Each stanza name is an Overview
# section id, `tiles` is an ordered comma-separated list of MetricConfig ids,
# and `visible_count` controls the factory number shown for that section.

[it_health]
tiles = critical_website_availability,network_health,device_health,open_issues,active_te_alerts,syslog_severity,it_domain_score,config_changes,compliance_rate
visible_count = 9

[security]
tiles = fw_blocked,threat_sources,failed_auth,rogue_devices,sec_score,xdr_critical,dns_blocked_queries,web_threats,email_threat_count
visible_count = 9

[building]
tiles = active_devices,wifi_clients,occupancy,devices_to_review,collab_devices,ap_health,environmental_health,rooms_occupied,water_leaks
visible_count = 9

[custom]
tiles = executive_ux_score,executive_it_score,executive_security_score,executive_building_score,executive_active_clients,executive_active_alerts,executive_ai_defense_blocks,executive_duo_users,executive_issue_pressure
visible_count = 9

