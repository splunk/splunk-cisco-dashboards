[capability::scd_manage_insights_workspaces]

# Preserve the app's established behavior while allowing a custom role to
# receive only the narrow workspace-management capability.
[role_admin]
scd_manage_insights_workspaces = enabled

[role_power]
scd_manage_insights_workspaces = enabled

[role_sc_admin]
scd_manage_insights_workspaces = enabled
