# =============================================================================
# Cisco Exec Dashboards — macros.conf
# =============================================================================
# Tier 0 — Branding (1)            : customer name used in dashboard headers
# Tier 1 — Index abstraction (12)  : map customer index name once
# Tier 2 — Acceleration toggle (1) : tstats summariesonly switch
# Tier 3 — Reusable structural macros (2) : Spaces hierarchy, DNAC site normalize
# Tier 4 — NRS tuning knobs (6)    : the only NRS values worth surfacing
#
# Total: 22 macros. Sub-weights, D_risk components, and capacity constants are
# inlined in the SPL — see DECISIONS.md 2026-04-28 for the audit.
# =============================================================================


# -----------------------------------------------------------------------------
# Tier 0 — Branding
# The Overview header reads `customer_name` at load via a hidden search and
# uses it as the displayed organization. Operators can override the value
# two ways:
#   1. Per-deployment: copy this stanza into local/macros.conf and set
#      `definition = "<Your Organization Name>"`.
#   2. Per-user: click the pencil in the dashboard header (revealed on
#      hover) to override the title, subtitle, and logo from the browser.
# Other dashboards can use the same value via `| eval label=`customer_name``.
# -----------------------------------------------------------------------------
[customer_name]
# Examples:
#   definition = "Acme Corporation"
#   definition = "City of Springfield"
definition = "Your Organization Name"
# iseval = 1
description = Customer / organization name shown in dashboard headers and report titles. Override in local/macros.conf or via the in-dashboard branding editor (pencil icon in the header).


