[summariesonly]
definition = summariesonly=false allow_old_summaries=false fillnull_value=null
iseval = 0
description = tstats acceleration mode. Set summariesonly=true when data models are fully accelerated. Set summariesonly=false to fall back to raw search.


# -----------------------------------------------------------------------------
# Tier 3 — Reusable structural macros
# These replace large blocks of duplicated SPL across many panels.
# -----------------------------------------------------------------------------

# Cisco Spaces firehose location-hierarchy walker.
# Walks up to 5 parent levels and exposes campus / building / floor / site.
# Pass the event prefix (devicePresence, userPresence, deviceAssociation, etc.)
# as the only argument. site = "<campus>: <building>" — the standard label.
[spaces_hierarchy(1)]
args = prefix
definition = eval lh_t0='$prefix$.location.inferredLocationTypes{}', \
 lh_t1='$prefix$.location.parent.inferredLocationTypes{}', \
 lh_t2='$prefix$.location.parent.parent.inferredLocationTypes{}', \
 lh_t3='$prefix$.location.parent.parent.parent.inferredLocationTypes{}', \
 lh_t4='$prefix$.location.parent.parent.parent.parent.inferredLocationTypes{}', \
 lh_n0='$prefix$.location.name', \
 lh_n1='$prefix$.location.parent.name', \
 lh_n2='$prefix$.location.parent.parent.name', \
 lh_n3='$prefix$.location.parent.parent.parent.name', \
 lh_n4='$prefix$.location.parent.parent.parent.parent.name' \
| eval floor=case(mvfind(lh_t0,"FLOOR")>=0,lh_n0, mvfind(lh_t1,"FLOOR")>=0,lh_n1, mvfind(lh_t2,"FLOOR")>=0,lh_n2) \
| eval building=case(mvfind(lh_t0,"NETWORK")>=0,lh_n0, mvfind(lh_t1,"NETWORK")>=0,lh_n1, mvfind(lh_t2,"NETWORK")>=0,lh_n2, mvfind(lh_t3,"NETWORK")>=0,lh_n3, mvfind(lh_t4,"NETWORK")>=0,lh_n4) \
| eval campus=case(mvfind(lh_t0,"CAMPUS")>=0,lh_n0, mvfind(lh_t1,"CAMPUS")>=0,lh_n1, mvfind(lh_t2,"CAMPUS")>=0,lh_n2, mvfind(lh_t3,"CAMPUS")>=0,lh_n3, mvfind(lh_t4,"CAMPUS")>=0,lh_n4) \
| eval site=if(isnotnull(campus) AND isnotnull(building), campus.": ".building, coalesce(building, campus, "Unknown")) \
| fields - lh_t0 lh_t1 lh_t2 lh_t3 lh_t4 lh_n0 lh_n1 lh_n2 lh_n3 lh_n4
iseval = 0
description = Walks the Cisco Spaces location tree (up to 5 parent levels) and exposes campus / building / floor / site fields. site = "<campus>: <building>" — the standard label across all NetOps charts. Uses lh_* (letter-prefixed) intermediate fields because Splunk rejects field names with leading double underscore.

# Catalyst Center site path normalization.
# Maps any DNAC raw site path to canonical "<Campus>: <Building>" — matching
# what spaces_hierarchy produces, so DNAC + Spaces join cleanly.
# Recognizes specific building tokens (SEOC, TLH, AUB, Warehouse, Betty Easley).
# Use:
# | eval site_raw = coalesce(Site, Location)
# | eval site = `dnac_site_normalize(site_raw)`
#
# TODO (customer-specific): The `case(...)` definition below hard-codes
# Florida-specific site tokens (Tallahassee/SEOC/Betty Easley/TLH/AUB/
# Auburndale/Warehouse) carried over from the original customer deployment.
# Replace these with your own site identifiers — or generalize to a
# site-mapping lookup — before pushing to a non-Florida customer.
[dnac_site_normalize(1)]
args = site
definition = case(isnull($site$) OR trim($site$)="" OR lower($site$)="null", "", match($site$, "(?i)SEOC"), "Tallahassee: SEOC", match($site$, "(?i)Betty.*Easley"), "Tallahassee: Betty Easley", match($site$, "(?i)(^|/)TLH(/|$)"), "Tallahassee: TLH", match($site$, "(?i)Warehouse"), "Auburndale: Warehouse", match($site$, "(?i)(^|/)AUB(/|$)"), "Auburndale: AUB", match($site$, "(?i)(^|/)MCO(/|$)"), "Orlando: MCO", match($site$, "(?i)Tallahassee"), "Tallahassee: TLH", match($site$, "(?i)Auburndale"), "Auburndale: AUB", match($site$, "(?i)Orlando"), "Orlando: MCO", true(), replace($site$, "^Global/(Florida|USA)/", ""))
iseval = 0
description = Normalize a DNAC raw site path into "<Campus>: <Building>" form. Returns empty string for null/blank/literal-null inputs. Order matters: most-specific building/floor tokens (SEOC, Betty Easley, TLH, Warehouse, AUB, MCO) match before broader city-name fallbacks (Tallahassee, Auburndale, Orlando). Falls back to stripping Global/Florida/ or Global/USA/ prefix for unknown sites.


# -----------------------------------------------------------------------------
# Tier 4 — NRS tuning knobs (the only six worth a macro)
# Edit any of these to retune NRS without touching SPL. All other constants
# (sub-weights, D_risk components, capacity assumptions) are inlined in the
# panels themselves — there's only one or two places per constant, and folding
# them through 20+ macros made the dashboard hard to read.
# -----------------------------------------------------------------------------

# Headline ARQ rebalance — NRS = (wA*A + wR*R + wQ*Q) * D_risk
[nrs_w_nrs_a]
definition = "0.30"
iseval = 1
description = NRS top-level weight A (Attainability). Tune to rebalance the headline formula.

[nrs_w_nrs_r]
definition = "0.30"
iseval = 1
description = NRS top-level weight R (Retainability).

[nrs_w_nrs_q]
definition = "0.25"
iseval = 1
description = NRS top-level weight Q (Quality). Remaining 0.15 is implicit in the D_risk multiplier.

# Health pass thresholds (DNAC native 0-10 scale)
[nrs_th_ap_health]
definition = "7"
iseval = 1
description = Min OverallHealth for an AP to count as ok in R / per-site NRS arms. Also used by AP-health alerts.

[nrs_th_cl_health]
definition = "5"
iseval = 1
description = Min health.overallScore for a client to count as ok. Also used by Q9 worst-clients filter and client-health alerts.

# AP saturation threshold (concurrent clients)
[nrs_ap_saturation_clients]
definition = "30"
iseval = 1
description = Concurrent-client count above which an AP is flagged saturated. Used by Q5 KPI, Q5 heatmap filter, and the saturation alert.

[field_list]
description = Gather field list using | fieldsummary
definition = fields - date_*,eventtype,host,index,info_*_time,linecount,punct,source,sourcetype,splunk_server*,tag*,timeendpos,timestartpos | fieldsummary | stats values(field) as Fields_List | eval Fields_List=mvjoin(mvsort(Fields_List), ", ")
