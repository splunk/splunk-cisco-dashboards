# =============================================================================
# Cisco Exec Dashboards — macros.conf
# =============================================================================
# Tier 0 — Branding (1)            : customer name used in dashboard headers
# Tier 1 — Index abstraction (12)  : map customer index name once
# Tier 2 — Acceleration toggle (1) : tstats summariesonly switch
# Tier 3 — Reusable structural macros (2) : Spaces hierarchy, DNAC site normalize
# Tier 4 — NRS tuning knobs (6)    : the only NRS values worth surfacing
#
# Total: 22 macros. Sub-weights, D_risk components, and capacity constants are
# inlined in the SPL — see DECISIONS.md 2026-04-28 for the audit.
# =============================================================================


# -----------------------------------------------------------------------------
# Tier 0 — Branding
# Override these in local/macros.conf for per-customer deployments. The home
# dashboard pulls customer_name into its header at load time via a hidden
# search; other dashboards can do the same with `| eval label=`customer_name``.
# -----------------------------------------------------------------------------
[customer_name]
# definition = "Acme Corporation"
definition = "Florida Division of Emergency Management"
# iseval = 1
description = Customer / organization name shown in dashboard headers and report titles. Override in local/macros.conf to set per deployment.


# -----------------------------------------------------------------------------
# Tier 1 — Index abstraction
# Each macro is the first token of every search. Edit the `index=` value once
# per customer to retarget all panels and saved-searches at the right indexes.
# -----------------------------------------------------------------------------
[index_catalyst]
definition = index=*
iseval = 0
description = Index(es) for Catalyst Center / DNAC data (cisco:dnac:*)

[index_firewall]
definition = index=*
iseval = 0
description = Index(es) for firewall data (cisco:asa, cisco:ftd, cisco:sfw:estreamer)

