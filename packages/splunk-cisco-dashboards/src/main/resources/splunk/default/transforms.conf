#
# transforms.conf — Executive Dashboards
#

[asset_inventory]
filename = asset_inventory.csv
case_sensitive_match = false
match_type = WILDCARD(device_name)
min_matches = 1

[exec_scores]
filename = exec_scores.csv

[data_status]
filename = data_status.csv

[site_topology_lookup]
filename = site_topology_lookup.csv
case_sensitive_match = false
# Populated by [Executive Dashboard - Site Topology Lookup Generator]
# in savedsearches.conf. Snapshot of cisco:dnac:site:topology, keyed
# on `id` (DNAC site UUID). Use as a join target for any sourcetype
# whose site reference is a UUID:
#   cisco:dnac:client.siteHierarchyId  (slash-delimited UUID chain;
#                                       extract leaf via mvindex)
#   cisco:dnac:client.siteId           (leaf UUID directly)
#   cisco:dnac:clienthealth.siteId     (leaf UUID directly)
#   cisco:dnac:audit:logs.network.siteId (leaf UUID directly)

[network_diagrams]
filename = network_diagrams.csv
case_sensitive_match = false
# Network Diagram authoring persistence (Build 106).
#
# One row per saved diagram. The Network Diagram page (clones the
# react canvas at `/network_diagram`) reads/writes this lookup so
# customers can author Visio-style diagrams that pull real devices
# from `asset_inventory`, link them with arrows, group them into
# named regions, and save the layout by name.
#
# Schema:
#   - name             : human-friendly diagram name (e.g. "FDEM
#                        Production", "FDEM DR Plan"). Stable
#                        external key; (re)saving a diagram with
#                        an existing name overwrites that row.
#   - updated_at       : ISO-8601 UTC timestamp of the last save.
#   - updated_by       : Splunk username of the last saver.
#   - payload_json     : JSON-encoded `{ nodes[], edges[], groups[],
#                        version }` blob produced by the canvas.
#                        Treat as opaque on the SPL side; the React
#                        bundle is the only consumer.
#
# Why a single JSON blob per row instead of three normalised
# lookups (nodes / edges / groups)? Atomic save + atomic load is
# the dominant access pattern; splitting the persistence into
# three lookups would require a transactional dispatch we don't
# have on the conf-managed lookup REST surface. The blobs are
# small (kilobytes even for 200-device diagrams) so storage is a
# non-issue.
#
# Persistence flow:
#   - Read : | inputlookup network_diagrams (full table; UI picks
#     by name) — used for the diagram dropdown picker.
#   - Write: POST /servicesNS/-/<app>/data/lookup-edit/lookup_contents
#     with the entire updated CSV (the canvas reads, mutates the
#     row in JS, posts back). See diagramPersistenceService.ts.
#
# This stanza supersedes the Build 105 `[network_topology_edges]`
# scaffold which was retired in Build 106 (no producer, no
# consumer, never wired).
