# Central Signal Rail catalogue. Search bindings and semantic defaults live in
# shared app configuration; authenticated users store only sparse personal
# differences in insights_workspace_preferences.conf.
[signal_item.thousandeyes_stream_age]
search_name = Feed Monitor - ThousandEyes - Stream Staleness (Signal Rail KPI)
label = TE stream age
value_field = age_minutes
threshold_warning = 30
threshold_critical = 90
threshold_direction = lower_is_better
threshold_unit = m

[signal_item.ftd_firewall_age]
search_name = Feed Monitor - FTD Firewall - Stream Staleness (Signal Rail KPI)
label = FTD feed age
