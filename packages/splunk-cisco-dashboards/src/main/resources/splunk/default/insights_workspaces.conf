# insights_workspaces.conf - shared Insights workspace definitions and layouts.
#
# Workspace metadata uses [workspace.<workspace_id>] stanzas. Layout metadata
# uses [layout.<workspace_id>.<section_id>] stanzas. Signal Rail search bindings
# use reusable [signal_item.<item_id>] definitions, ordered by each
# [signal_rail.<workspace_id>] preset. Runtime changes are written to
# local/insights_workspaces.conf through Splunk's config REST endpoint, so
# customer demo workspaces survive app upgrades without requiring a restart.

