# insights_workspaces.conf - shared Insights workspace definitions and layouts.
#
# Workspace metadata uses [workspace.<workspace_id>] stanzas. Layout metadata
# uses [layout.<workspace_id>.<section_id>] stanzas. Signal Rail search bindings
# use reusable [signal_item.<item_id>] definitions, ordered by each
# [signal_rail.<workspace_id>] preset. Runtime changes are written to
# local/insights_workspaces.conf through Splunk's config REST endpoint, so
# customer demo workspaces survive app upgrades without requiring a restart.

[workspace.secure_networking]
label = Secure Networking
source_workspace = secure_networking
sections = zta,secure_infrastructure,scalable_network_segmentation,hybrid_mesh_firewalling,agentic_ops
default_visible_sections = zta,secure_infrastructure,scalable_network_segmentation,hybrid_mesh_firewalling,agentic_ops
max_visible_sections = 5
min_tile_count = 1
max_tile_count = 9
default_tile_count = 3
header_title = Splunk for Secure Networking
header_subtitle = Secure Networking Executive Insights
hide_default_logo = 1
legacy_view_names = secure_networking_profile
is_builtin = 1
enabled = 1
sort_order = 10
theme_preference = dark
map_visible = 1
map_position = right
regional_view = map

