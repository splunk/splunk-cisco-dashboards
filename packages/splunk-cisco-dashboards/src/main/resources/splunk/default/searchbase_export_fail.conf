[xdr_aa_forensic_http_large_transfer_anomalies]
search_name = XDR - Attack Analyzer - Forensic HTTP Large Transfer Anomalies
search_author = akhamis
updated_author = akhamis
version = 1.0.0
date_created = 2026-06-02
date_updated = 2026-06-02
category = Security
sub_category = XDR
tags = Security,XDR,AttackAnalyzer,Forensics,HTTP,Anomaly,Cisco Live
description = <p>Detects unusual upload/download HTTP transactions based on request, response, and total transfer-size thresholds.</p>
explanation = <p>The query evaluates method and size fields in <code>splunk:aa:forensic:http</code> and keeps large transfers or heavy upload methods likely to represent payload delivery or exfil behavior.</p>
solution = <p>Investigate top rows by max total size and event count. Correlate destination hosts and user agents with known infrastructure before permitting recurring large exchanges.</p>
related_info = <ul><li><b>Observed volume shape</b><br>Field summary shows long-tail large response sizes and occasional large requests that provide immediate anomaly signal.</li></ul>
search = index="<<index>>" sourcetype="splunk:aa:forensic:http"\
| eval hostname=lower(coalesce(Hostname,"unknown")), path=coalesce(Path,"/"), url=coalesce(URL,hostname.path), method=upper(coalesce(Method,"UNKNOWN")), status_code=tonumber(coalesce(StatusCode,0)), request_size=tonumber(coalesce(RequestSize,0)), response_size=tonumber(coalesce(ResponseSize,0)), total_size=tonumber(coalesce(TotalSize,request_size+response_size)), user_agent=coalesce('RequestHeaders.user-agent',"unknown"), job_id=coalesce(JobID,SAA_JOB_ID)\
| where (method IN ("POST","PUT","DELETE") AND request_size>=50000) OR response_size>=5000000 OR total_size>=10000000\
| stats count as transfer_events dc(job_id) as jobs max(request_size) as max_request_size max(response_size) as max_response_size max(total_size) as max_total_size values(status_code) as status_codes values(user_agent) as user_agents by hostname, url, method\
| eval status_codes=mvjoin(status_codes,", "), user_agent=mvindex(user_agents,0)\
| sort 25 -max_total_size -transfer_events
