# EXPORT VALIDATION FAILED: [executive_dashboard_data_source_status]
# 1. [performance] Uses index=* (all indexes).
#    Suggestion: Scope to a specific index or datamodel; avoid full-index scans.

[executive_dashboard_data_source_status]
search_name = Executive Dashboard - Data Source Status
search_author = akhamis
updated_author = akhamis
version = 1.0.0
date_created = 2026-04-12 20:14:57
date_updated = 2026-04-12 20:14:57
category = Security
sub_category = Firewall
tags = Executive,Catalyst Center,Meraki,ISE,ASA,Firepower,Active Directory,Umbrella,SD-WAN,IOS,DHCP
default_viz = splunk.area
viz_options = {"seriesColors":["#C83C10"],"lineWidth":2}
description = <p>Builds a <b>per-integration inventory</b> of Splunk ingestion for the executive launchpad: each row shows a <b>friendly source name</b>, a static <b>Connected</b> status, and <b>24-hour event volume</b> formatted with <b>K/M suffixes</b> for readability.</p>
explanation = <p><code>tstats count</code> scans <code>index=*</code> in the selected window, grouping by <code>index</code> and <code>sourcetype</code>. A first <code>stats</code> collapses duplicate sourcetypes across indexes, then <code>eval source=case(...)</code> maps regex patterns on <code>sourcetype</code> to executive labels such as Meraki, ISE Syslog, Catalyst Center, SD-WAN, Windows, and others, defaulting to the raw sourcetype when no pattern matches.</p><p>Another <code>stats sum(events_24h) by source</code> merges related sourcetypes into one row per integration. The closing <code>eval</code> formats counts into strings with K or M suffixes and sets <code>status</code> to Connected for every row that made it through the pipeline&mdash;the presence of a row implies telemetry was observed in the window.</p><p>Junior engineers should understand that <code>tstats</code> respects summarization and permissions; sparse deployments may omit integrations entirely rather than showing explicit disconnected rows. For alerting, duplicate the search without string formatting if you need numeric thresholds. Regex order inside <code>case</code> matters because the first match wins.</p><p>Overall, this is a <b>sourcetype-to-product rollup with formatting</b> designed for quick visual assurance.</p>
solution = <p>Use the table to answer <b>which Cisco stacks contributed events recently</b> and whether volumes look proportionate; it is a connectivity smell test, not a substitute for input-level monitoring.</p><p><b>Suggested Actions</b><br><b>1.</b> If a strategic integration row is missing, run a raw <code>tstats</code> slice on that sourcetype to confirm indexing and RBAC visibility.<br><b>2.</b> When volume strings look too small, validate clock skew, sampling, or filtered inputs before blaming the product.<br><b>3.</b> After onboarding a new TA, extend the <code>case</code> map so executives see a clean label instead of a technical sourcetype.<br><b>4.</b> Compare this summary with CIM or data model acceleration health if you rely on <code>tstats</code> elsewhere.<br><b>5.</b> Continue deeper TA-specific checks from the <a href="/app/splunk-cisco-dashboards/home_launchpad">Executive Dashboard</a> launchpad when a row exists but downstream KPIs are empty.</p><p><b>Recommended Alerts</b></p><pre><code>| eval severity_level=case(isnull(events_24h) OR events_24h=="0", "critical", like(events_24h, "0.%K") OR like(events_24h, "0.%M"), "high", match(events_24h, "^[1-4]\.?[0-9]*K$"), "medium", match(events_24h, "^[5-9]") OR match(events_24h, "^[0-9][0-9]") OR match(events_24h, "M$"), "low", 1==1, "normal")</code></pre><p>This pattern keys off the formatted string; for production alerts prefer a clone that thresholds on numeric counts before K/M formatting.</p><p><b>Evaluation Logic:</b></p><ul><li><b>Normal (Severity 1):</b> <i>Volume string indicates healthy throughput for the integration class.</i></li><li><b>Low (Severity 2):</b> <i>Small but non-zero formatted volume; monitor for two consecutive intervals before paging.</i></li><li><b>Medium (Severity 3):</b> <i>Very low K-tier volume; likely nearing silence or heavily filtered ingestion.</i></li><li><b>High (Severity 4):</b> <i>Near-zero formatted traffic; high risk that parsers or forwarders stopped.</i></li><li><b>Critical (Severity 5):</b> <i>Explicit zero or null volume; treat as integration outage until disproven.</i></li></ul>
related_info = <ul><li><b>tstats scope</b><br>All-index summaries can be heavy; narrow time ranges on busy clusters and ensure roles may read the indexes you expect.</li><li><b>Label mapping drift</b><br>New sourcetypes require updates to the <code>case</code> map or they appear under raw names, which can confuse executives.</li><li><b>Status semantics</b><br>Because status is static text here, rely on row absence or near-zero volume elsewhere for true health signals.</li></ul>
search = | tstats count where index=* by index sourcetype\
| stats sum(count) as events_24h by sourcetype\
| eval source=case(match(sourcetype,"meraki"),"Meraki", match(sourcetype,"cisco:ise"),"ISE Syslog", match(sourcetype,"cisco:ios"),"IOS Syslog", match(sourcetype,"cisco:asa"),"ASA Firewall", match(sourcetype,"cisco:estreamer"),"eStreamer IPS", match(sourcetype,"cisco:cloud_security") OR match(sourcetype,"cisco:cloud:"),"SSE / Cloud Security", match(sourcetype,"cisco:sdwan"),"SD-WAN", match(sourcetype,"cisco:dnac"),"Catalyst Center (DNAC)", match(sourcetype,"cisco:dc:nd"),"DC Networking (ND)", match(sourcetype,"cisco:dc:"),"Data Center (ACI/Nexus)", match(sourcetype,"stream"),"NetFlow / Stream", match(sourcetype,"cisco:intersight"),"Intersight", match(sourcetype,"cisco:duo"),"Cisco Duo MFA", match(sourcetype,"cisco:cybervision"),"Cisco CyberVision OT", match(sourcetype,"cisco:ucs"),"Cisco UCS Compute", match(sourcetype,"cisco:nvm"),"Cisco NVM Endpoint", match(sourcetype,"XmlWinEventLog") OR match(sourcetype,"ActiveDirectory") OR match(sourcetype,"MSAD"),"Windows / Active Directory", match(sourcetype,"DhcpSrvLog"),"Windows DHCP", 1==1, sourcetype)\
| stats sum(events_24h) as events_24h by source\
| eval status="Connected", events_24h=case(events_24h>=1000000, tostring(round(events_24h/1000000,1))."M", events_24h>=1000, tostring(round(events_24h/1000,1))."K", 1==1, tostring(events_24h))\
| fields source status events_24h

# EXPORT VALIDATION FAILED: [xdr_aa_forensic_http_large_transfer_anomalies]
