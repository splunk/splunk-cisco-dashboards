# Local override for splunk-cisco-dashboards
#
# The TA_cisco_catalyst props relies on INDEXED_EXTRACTIONS = JSON, but that
# only takes effect for events indexed AFTER the setting was applied (and only
# at the indexing tier). Existing data and any data ingested via search-head-
# only setups end up without auto-extracted fields, which forces every
# dashboard query to start with `| spath`.
#
# Enabling KV_MODE = json here gives us search-time JSON parsing for the
# Catalyst Center sourcetypes the dashboards consume. With this in place the
# nested fields (IssueID, IssueStatus, IssuePriority, IssueSpecificSeverity,
# OverallHealth, Reachability, DeviceFamily, ClientCountGhz24, AdvisoryID,
# ComplianceStatus, ...) are available without an explicit spath, which
# (a) matches the user's mental model and (b) lets us count distinct issues
# and advisories correctly with dc(IssueID) / dc(AdvisoryID).

[cisco:dnac:issue]
KV_MODE = json

[cisco:dnac:devicehealth]
KV_MODE = json

[cisco:dnac:clienthealth]
KV_MODE = json

[cisco:dnac:client]
KV_MODE = json

[cisco:dnac:networkhealth]
KV_MODE = json

[cisco:dnac:compliance]
KV_MODE = json

[cisco:dnac:securityadvisory]
KV_MODE = json

[cisco:dnac:site:topology]
KV_MODE = json

[cisco:dnac:audit:logs]
KV_MODE = json

[cisco:sdwan:linkhealth]
DATETIME_CONFIG = /etc/datetime.xml
KV_MODE = json
NO_BINARY_CHECK = true
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "lastupdated":\s*
TIME_FORMAT = %s%3N
MAX_TIMESTAMP_LOOKAHEAD = 32
TRUNCATE = 0
