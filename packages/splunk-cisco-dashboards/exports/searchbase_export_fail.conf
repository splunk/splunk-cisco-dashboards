description = <p>Shows <b>Hybrid Mesh Firewalling enforcement coverage</b> by site using Meraki device inventory and SD-WAN UTD activity.</p>
explanation = <p>Hybrid Mesh Firewalling is a distributed-enforcement story. This search starts with the sources available today: Meraki device inventory classifies MX, Secure Router, and Teleworker firewall-capable devices by site, and SD-WAN UTD logs add evidence that WAN-edge security inspection is active.</p>
solution = <p>Investigate sites with only switches/APs and no Meraki firewall-class device or SD-WAN UTD activity. Confirm whether another firewall platform covers the site before calling it an exposure gap.</p>
