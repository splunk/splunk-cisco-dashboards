search_name = Secure Networking - Secure Infrastructure Status Rollup
search_author = akhamis
updated_author = akhamis
version = 1.0.0
date_created = 2026-07-21 18:00:00
date_updated = 2026-07-21 18:00:00
category = Asset
sub_category = Secure Infrastructure
