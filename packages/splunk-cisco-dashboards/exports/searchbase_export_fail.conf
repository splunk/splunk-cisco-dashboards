explanation = <p><code>tstats</code> on <code>Cisco_Catalyst_App</code> (<code>nodename=Cisco_Catalyst_Dataset.Cisco_Catalyst_Device_Health_Events</code>) filters <code>device_health_device_family</code> to <code>Unified AP</code> or <code>Access Points</code>, keeps rows with a non-empty <code>device_health_site</code>, and dedupes by <code>device_health_ip_address</code> with <code>latest(device_health_site)</code>. <code>stats count as APs by Site</code> counts unique APs per site. <code>fillnull</code> labels missing sites as <code>Unknown</code>.</p>
