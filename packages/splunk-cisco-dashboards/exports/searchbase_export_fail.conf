| eval result_value=lower(coalesce(result,"unknown"))\
| where match(result_value,"failure|deny|fraud|blocked")\
| eval event_type="Identity decision", reason=coalesce(reason,result,"Unknown"), identity=coalesce('user.name',username,user,email,"Unknown"), endpoint=coalesce('access_device.hostname',device,host,"Unknown"), application=coalesce('application.name',application,integration,"Unknown"), location=coalesce('access_device.location.city','access_device.location.country',location,"Unknown")\
| fields _time, event_type, reason, identity, endpoint, application, location\
| append [ search index="<<index>>" sourcetype="cisco:duo:endpoint" | stats latest(_time) as _time latest(disk_encryption_status) as encryption latest(firewall_status) as firewall latest(password_status) as password latest(trusted_endpoint_status) as trusted latest(hostname) as hostname latest(username) as username latest(os_family) as os_family by epkey | eval failed_controls=mvappend(if(NOT match(encryption,"(?i)^(encrypted|enabled|true|on)$"),"Disk encryption",null()),if(NOT match(firewall,"(?i)^(enabled|true|on)$"),"Host firewall",null()),if(NOT match(password,"(?i)^(set|enabled|true|on)$"),"Password",null()),if(NOT match(trusted,"(?i)^(trusted|enabled|true|on)$"),"Trusted endpoint",null())) | mvexpand failed_controls | where isnotnull(failed_controls) | eval event_type="Endpoint posture", reason=failed_controls, identity=coalesce(username,"Unknown"), endpoint=coalesce(hostname,epkey,"Unknown"), application="Duo Device Health", location=coalesce(os_family,"Unknown") | fields _time, event_type, reason, identity, endpoint, application, location ]\
| eval "Last Seen"=strftime(_time,"%Y-%m-%d %H:%M:%S")\
| rename event_type as "Event Type", reason as Reason, identity as Identity, endpoint as Endpoint, application as Application, location as Location\
| table "Last Seen", "Event Type", Reason, Identity, Endpoint, Application, Location\
