| rename "devicePresence.activeDevicesCount" as active_devices "devicePresence.inActiveDevicesCount" as inactive_devices "devicePresence.location.name" as location\
| eval active_devices=tonumber(active_devices), inactive_devices=tonumber(inactive_devices)\
| where isnotnull(location)\
| bin _time span=1h\
| stats max(active_devices) as active_devices max(inactive_devices) as inactive_devices by _time, location\
| eval active_devices=coalesce(active_devices,0), inactive_devices=coalesce(inactive_devices,0), total_devices=active_devices+inactive_devices\
| where total_devices > 0\
| eval active_ratio=round(active_devices/total_devices*100, 1)\
| where active_ratio>=0 AND active_ratio<=100\
| eval day_type=if(tonumber(strftime(_time,"%u"))>=6,"Weekend","Weekday"), slot=location." ".day_type." ".strftime(_time,"%H").":00"\
| eventstats count as n_samples by slot\
