[teuc_5_9_54_mttr_reduction_via_network_vs_application_isolation]
search_name = TEUC-5.9.54 - MTTR Reduction via Network vs Application Isolation
search_author = use-case-library
updated_author = akhamis
version = 1.0.1
date_created = 2026-04-21 11:24:21
date_updated = 2026-07-02
category = Monitoring
sub_category = Correlation
tags = ThousandEyes,MTTR,MTTI
default_viz = splunk.column
viz_options = {"seriesColors":["#38BDF8"],"stackMode":"unstacked"}
description = <p>Estimates <b>mean time to isolate</b> by comparing alert lifetimes that could be paired with <b>ThousandEyes event telemetry</b> versus alert-only workflows, quantifying how much faster correlation shortens investigations.</p>
explanation = Starting from <code>tstats</code> with the <code>scd_summariesonly</code> macro against the accelerated <code>Cisco_ThousandEyes.Alerts</code> data model, the search derives per alert rule/test name the earliest and latest event timestamps. A subsearch against the accelerated <code>Cisco_ThousandEyes.Events</code> data model (also via tstats) aggregates earliest event time and latest state.
solution = <p>Organizations that integrate events with alerts expect <b>lower <code>avg_mtti</code></b> for the correlated method when telemetry shortens guesswork; persistently similar averages suggest the join is not finding meaningful state transitions.</p>
related_info = <li><b>Data model routing</b><br>Accelerated Cisco_ThousandEyes data models keep deployment-specific index routing out of the SPL body.</li>
search = | tstats summariesonly=false allow_old_summaries=false fillnull_value=null earliest(_time) as alert_start, latest(_time) as alert_end FROM DATAMODEL=Cisco_ThousandEyes.Alerts BY Alerts.signature, Alerts.testName\
| rename "Alerts.signature" as "alert.rule.name" "Alerts.testName" as "alert.test.name"\
| eval mtti_minutes=round((alert_end-alert_start)/60,1)\
| join type=outer max=1 alert.test.name [ | tstats summariesonly=false allow_old_summaries=false fillnull_value=null earliest(_time) as event_start, latest(Events.state) as final_state FROM DATAMODEL=Cisco_ThousandEyes.Events BY Events.title\
  | rename "Events.title" as "thousandeyes.test.name"\
  | rename thousandeyes.test.name as alert.test.name ]\
| eval isolation_method=if(isnotnull(event_start), "ThousandEyes Event + Alert", "ThousandEyes Alert Only")\
| timechart minspan=1h avg(mtti_minutes) as avg_mtti count by isolation_method

