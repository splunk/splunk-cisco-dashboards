[teuc_fit_multivariate_network_health_anomaly]
search_name = TE - Network - Multivariate Health Anomaly: Latency + Loss + Jitter (DensityFunction)
search_author = akhamis
updated_author = akhamis
version = 1.0.0
date_created = 2026-06-14
date_updated = 2026-06-14
category = ThousandEyes
sub_category = Network Performance
tags = ThousandEyes,Latency,Multivariate,Anomaly,Machine Learning,DensityFunction,Forecast
default_viz = splunk.table
viz_options = {"seriesColors":["#0284C7","#16A34A","#F59E0B","#DC2626"],"legendDisplay":"off"}
description = <p>Joint three-dimensional anomaly detection on latency, packet loss, and jitter per test type x time slot using multivariate DensityFunction. Detects network health degradation scenarios invisible to single-metric thresholds - e.g. low loss but correlated high jitter and elevated latency indicating congestion.</p>
explanation = <p>Fits three independent <code>DensityFunction</code> models - one each for <code>avg_latency_ms</code>, <code>avg_loss_pct</code>, and <code>avg_jitter_ms</code> - against a per-test-type Weekday/Weekend x hour slot. Only hours where <em>all three</em> metrics are simultaneously outliers are returned, requiring correlated degradation across latency, loss, and jitter to fire.</p>
solution = <p>Multivariate network health anomalies are the most reliable signal of genuine path degradation. Single-metric thresholds generate too many false positives; this search produces actionable alerts that warrant immediate NOC investigation. Correlate with BGP path changes and application availability drops for root-cause determination.</p>
related_info = <ul><li><b>Data model</b>: Cisco_ThousandEyes.Test_Metrics</li><li><b>Test type</b>: agent-to-server</li><li><b>Algorithm</b>: DensityFunction x 3 (MLTK, chained univariate)</li><li><b>Models</b>: teuc_multivariate_latency_model, teuc_multivariate_loss_model, teuc_multivariate_jitter_model</li></ul>
search = | tstats summariesonly=false allow_old_summaries=false fillnull_value=null avg(Test_Metrics.metric_name:network.latency) as avg_latency_ms avg(Test_Metrics.metric_name:network.loss) as avg_loss_pct avg(Test_Metrics.metric_name:network.jitter) as avg_jitter_ms FROM DATAMODEL=Cisco_ThousandEyes.Test_Metrics WHERE Test_Metrics.thousandeyes.test.type="agent-to-server" BY _time span=1h\
| eval day_type=if(tonumber(strftime(_time,"%u"))>=6,"Weekend","Weekday"), slot=day_type." ".strftime(_time,"%H").":00"\
| eventstats count as n_samples by slot\
| where n_samples >= 3\
| fit DensityFunction avg_latency_ms by slot into user:teuc_multivariate_latency_model\
| eval is_latency_outlier='IsOutlier(avg_latency_ms)'\
| fit DensityFunction avg_loss_pct by slot into user:teuc_multivariate_loss_model\
| eval is_loss_outlier='IsOutlier(avg_loss_pct)'\
| fit DensityFunction avg_jitter_ms by slot into user:teuc_multivariate_jitter_model\
| eval is_jitter_outlier='IsOutlier(avg_jitter_ms)'\
| where is_latency_outlier=1 AND is_loss_outlier=1 AND is_jitter_outlier=1\
| sort - _time\
| fields _time slot avg_latency_ms avg_loss_pct avg_jitter_ms is_latency_outlier is_loss_outlier is_jitter_outlier

