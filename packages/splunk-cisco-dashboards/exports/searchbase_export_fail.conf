description = <p>Counts the number of <b>doors currently in an open state</b> from <b>Meraki door sensors</b>, providing a real-time <b>physical security</b> indicator for the Building Safety Sensors KPI tile.</p>
explanation = <p>This search provides deeper visibility into <b>physical security posture</b> by querying Meraki door sensor telemetry and counting how many monitored doors are currently open. The pipeline uses a <b>two-stage aggregation pattern</b>: first deduplicating to the latest reading per sensor serial, then filtering and counting only those in an open state.</p>
solution = <p>Returns a <b>single integer</b> representing the count of doors currently in an open state. A value of <b>0</b> means all monitored doors are closed &mdash; the desired security baseline. Any positive value warrants review, especially outside business hours.</p>
related_info = <ul><li><b>Meraki MT Door Sensor Documentation</b><br>Cisco Meraki documentation on MT door sensor capabilities, the <code>door.open</code> field values, and how sensor readings are reported via the Dashboard API.</li><li><b>Physical Security Monitoring with IoT Sensors</b><br>Best practices for integrating door, motion, and access control sensors into a unified facility monitoring platform for real-time physical security awareness.</li><li><b>Two-Stage Aggregation Pattern in SPL</b><br>The <code>stats ... by entity | where ... | stats count</code> pattern is a reusable technique for deduplicating per-device, filtering to a condition, and then producing a cross-device aggregate.</li></ul>
search = index="<<index>>" sourcetype="meraki:sensorreadingshistory" metric="door"\
| stats latest(*) as * by serial\
| where 'door.open'=="true"\
| stats count as open_doors\
| appendpipe [stats count as _c | where _c=0 | eval open_doors="N/A"]

