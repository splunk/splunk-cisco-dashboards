default_viz = splunk.table
viz_options = {"seriesColors":["#2563EB","#16A34A","#F59E0B","#DC2626"],"legendDisplay":"off","overview":[{"workspace":"secure_networking","tileId":"secinfra_status_rollup","section":"secure_infrastructure","label":"Infrastructure status","subLabel":"Reachability, software, compliance by family","color":"#0ea5e9","thresholdNote":"This is the TA-backed part of Secure Infrastructure: inventory, reachability, software, and compliance. TPM/SUDI/PQC/Broccoli remain separate collection gaps."}]}
description = <p>Rolls up <b>Secure Infrastructure posture</b> from Catalyst Center device health, inventory, and compliance records.</p>
explanation = <p>This search stays inside the TA-backed data that exists today: device health provides reachability/manageability, inventory provides family and software version, and compliance records provide coarse control status. It intentionally does not claim TPM, SUDI, secure boot, Broccoli, or PQC coverage.</p>
solution = <p>Use the table to prioritize families with many unreachable devices, many distinct software versions, or non-compliance evidence. Treat cryptographic/hardware trust questions as follow-on collection work.</p>
related_info = <ul><li><b>Companions</b><br><code>secure_networking_catalyst_center_software_version_inventory</code> and <code>secure_networking_software_license_compatibility</code> provide narrower software/license views.</li></ul>
search = index="<<index>>" sourcetype="cisco:catalyst:center:inventory:report"\
| dedup "Serial No."\
| eval device=coalesce('Serial No.', 'Device Name', Hostname, IP_Address), family=coalesce('Device Family', DeviceFamily, "Unknown"), software=coalesce('Software Version', ImageVersion, "Unknown")\
| stats dc(device) as devices dc(software) as software_versions values(software) as versions by family\
| append [ search index="<<index>>" sourcetype IN (cisco:dnac:devicehealth, cisco:catalyst:devicehealth) | eval family=coalesce(DeviceFamily, Family, "Unknown"), reachable=if(Reachability="Reachable",1,0), managed=if(match(Manageability,"Managed"),1,0) | stats dc(DeviceID) as health_devices sum(reachable) as reachable_devices sum(managed) as managed_devices by family ]\
| append [ search index="<<index>>" sourcetype IN (cisco:dnac:compliance, cisco:catalyst:compliance) ComplianceStatus!="NOT_APPLICABLE" | eval family=coalesce(DeviceFamily, Family, "Unknown"), noncompliant=if(ComplianceStatus!="COMPLIANT",1,0) | stats dc(DeviceName) as compliance_devices dc(eval(if(noncompliant=1,DeviceName,null()))) as noncompliant_devices by family ]\
| stats sum(devices) as "Inventory Devices", sum(health_devices) as "Health Devices", sum(reachable_devices) as "Reachable Devices", sum(managed_devices) as "Managed Devices", sum(compliance_devices) as "Compliance Devices", sum(noncompliant_devices) as "Noncompliant Devices", max(software_versions) as "Software Versions", values(versions) as versions by family\
| eval versions=mvjoin(versions,", ")\
| rename family as "Device Family", versions as "Versions Seen"\
| table "Device Family", "Inventory Devices", "Health Devices", "Reachable Devices", "Managed Devices", "Compliance Devices", "Noncompliant Devices", "Software Versions", "Versions Seen"\
| sort - "Inventory Devices"

