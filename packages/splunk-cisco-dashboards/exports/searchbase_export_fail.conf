[security_resilience_repeated_blocked_sources]
search_name = Security Resilience - Repeated Blocked Sources
search_author = akhamis
updated_author = akhamis
version = 1.0.1
date_created = 2026-04-13 11:04:12
date_updated = 2026-07-02
category = Security
sub_category = Threat Detection
tags = Firewall,Scanning,Brute Force
default_viz = splunk.table
viz_options = {"seriesColors":["#DC2626","#F59E0B","#2563EB","#16A34A"],"legendDisplay":"off"}
description = <p>Ranks <b>noisy blocked sources</b> (20+ deny events) with <b>destination breadth</b>, <b>port cardinality</b>, and a short <b>top-5 ports</b> summary &mdash; not a full port list.</p>
explanation = <p>Denied ASA/FTD/eStreamer traffic is normalized, then summarized in two passes: totals per source (<code>blocks</code>, <code>dc(dest_ip)</code>, <code>dc(dest_port)</code>), and a join that lists only the <b>five highest-volume ports</b> per source as <code>443 (1200), 80 (400)</code> style text. This avoids unusable <code>values(dest_port)</code> walls in the UI.</p>
solution = <p><b>Operational insight:</b> Internal RFC1918 sources in this table may be compromised east-west movers; external sources may be internet-wide scanners.</p>
related_info = <ul><li><b>coalesce for source IPs</b><br>Firewall families use <code>src</code> or <code>src_ip</code>; coalesce keeps one key.</li><li><b>Top 5 ports per source</b><br>After <code>sort 0 src -port_blocks</code>, a <code>streamstats count by src</code> + <code>where rank&lt;=5</code> keeps the top five ports per source. The values are then collected with <code>stats list()</code> (order-preserving) and rendered with <code>mvjoin()</code>.</li><li><b>Executive blocked KPI</b><br>Tuple-deduped unique flows live in <code>executive_dashboard_firewall_blocked_count</code>; this panel is raw deny-event volume per source.</li></ul>
search = | tstats summariesonly=false allow_old_summaries=false fillnull_value=null count FROM DATAMODEL=Network_Traffic where nodename=All_Traffic.Traffic_By_Action.Blocked_Traffic All_Traffic.src!="" All_Traffic.src!="-" by All_Traffic.src, All_Traffic.dest, All_Traffic.dest_port\
| where NOT match('All_Traffic.src', "(?i)^(unknown|null|none)$")\
| stats sum(count) as blocks, dc(All_Traffic.dest) as unique_targets, dc(All_Traffic.dest_port) as unique_ports by All_Traffic.src\
| where blocks >= 20\
| rename All_Traffic.src as src\
| join type=left src [\
    | tstats summariesonly=false allow_old_summaries=false fillnull_value=null count as port_blocks FROM DATAMODEL=Network_Traffic where nodename=All_Traffic.Traffic_By_Action.Blocked_Traffic All_Traffic.src!="" All_Traffic.src!="-" by All_Traffic.src, All_Traffic.dest_port\
    | rename All_Traffic.src as src, All_Traffic.dest_port as dest_port\
    | where isnotnull(src) AND isnotnull(dest_port) AND NOT match(src, "(?i)^(unknown|null|none)$")\
    | sort 0 src -port_blocks\
    | streamstats count as rank by src\
    | where rank<=5\
    | eval port_summary=dest_port." (".port_blocks.")"\
    | stats list(port_summary) as port_summary_list by src\
    | eval top_ports=mvjoin(port_summary_list, ", ") ]\
| rename src as "Source IP", blocks as "Blocked Events", unique_targets as "Unique Destinations", unique_ports as "Unique Ports", top_ports as "Top Ports (up to 5)"

