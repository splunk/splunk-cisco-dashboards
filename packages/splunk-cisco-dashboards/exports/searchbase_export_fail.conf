description = <p>Detects anomalous active-device ratios per location and weekday/weekend hour using DensityFunction. An unusually low ratio during business hours may indicate a network outage, stale device telemetry, or building evacuation.</p>
explanation = <p>Computes active_ratio = activeDevicesCount / (activeDevicesCount + inActiveDevicesCount) hourly per location from DEVICE_PRESENCE events after converting raw counters to numbers and dropping invalid zero-device buckets.. The search builds a Weekday/Weekend x hour slot key, requires >=3 samples, and fits a Gaussian density model per slot.</p>
solution = <p>An anomalous drop in active device ratio during business hours should trigger a network health check for the affected floor. An unusual spike after hours may indicate unauthorized device activity warranting a security investigation.</p>
