default_viz = splunk.singlevalue
viz_options = {"majorColor":"#3B82F6"}
description = <p>Security posture trend - current vs previous period unique failed auth users with percentage change for the trend indicator.</p>
explanation = <p>A single <code>tstats</code> pass on the accelerated <code>Authentication</code> data model returns one row per <code>(Authentication.user, _time)</code> hourly bucket where <code>action="failure"</code>. <code>| addinfo</code> injects <code>info_min_time</code> and <code>info_max_time</code> (epoch seconds) from the dispatched time range. <code>eval period</code> splits the window exactly in half: buckets in the upper half are labelled <code>current</code>, the lower half <code>previous</code>. <code>stats dc(Authentication.user)</code> per period then counts truly distinct failing users in each half, and the final <code>stats</code> pivots the two-row result into <code>current</code> and <code>previous</code> scalars for <code>delta</code> and <code>direction</code>.</p>
solution = <p>Rising <code>delta</code> implies more unique accounts failing authentication relative to the baseline slice&mdash;engage identity operations. Sharp negative swings may be positive (remediated attack) or bad (logging gap); verify.</p>
related_info = <ul><li><b>Identity trend analytics</b><br>Why unique-user metrics beat raw failure counts for executive clarity.</li><li><b>Authentication DM</b><br>Requirements for reliable <code>tstats</code> on identity events.</li><li><b>Percent change pitfalls</b><br>Small baselines exaggerate percentages&mdash;always show absolutes.</li></ul>
