default_viz = splunk.table
viz_options = {"seriesColors":["#0284C7","#0D9488","#F59E0B","#DC2626"],"legendDisplay":"off"}
description = <p>Compresses power-related IOS signals into a <b>single KPI row</b>-<b>event totals</b>, <b>distinct devices</b>, and the <b>elapsed minutes</b> between first and last observation-for headline strips and alert macros.</p>
explanation = <p>The search narrows to reload, restart, platform environmental, redundancy switchover, stack, malloc failure, and PEM input messages. One <code>stats</code> pass counts all matching events, counts distinct <code>host</code> values, and captures earliest and latest timestamps. <code>eval</code> formats human-readable timestamps and derives <code>time_span_min</code> as the incident spread; <code>fillnull</code> guards empty summaries so dashboards always render numeric zeroes.</p>
solution = <p><b>Operational insight:</b> Large <b>affected_devices</b> with a <b>short time_span_min</b> describes a <b>sharp utility event</b>; long spans may indicate <b>rolling brownouts</b> or <b>intermittent PEM faults</b>.</p>
related_info = <ul><li><b>Single-result design</b><br>Fits single-value visualization components.</li><li><b>time_span_min</b><br>Communicates incident duration without extra SPL.</li><li><b>fillnull safeguard</b><br>Prevents blank tiles when no syslog matches.</li></ul>
search = index="<<index>>" sourcetype="cisco:ios" ("%SYS-5-RELOAD" OR "%SYS-5-RESTART" OR "%PLATFORM_ENV" OR "%REDUNDANCY-5-SWITCHOVER" OR "%STACKMGR" OR "%SYS-2-MALLOCFAIL" OR "%PLATFORM-2-PEM_NOINPUT")\
| stats count as power_events, dc(host) as affected_devices, earliest(_time) as first_event, latest(_time) as last_event\
| eval time_span_min=round((last_event-first_event)/60,1), first_event=strftime(first_event,"%Y-%m-%d %H:%M:%S"), last_event=strftime(last_event,"%Y-%m-%d %H:%M:%S")\
| fillnull value=0 power_events, affected_devices

