default_viz = splunk.table
viz_options = {"seriesColors":["#2563EB","#16A34A","#F59E0B","#DC2626"],"legendDisplay":"off","overview":[{"workspace":"secure_networking","tileId":"secinfra_software_version_inventory","section":"secure_infrastructure","label":"Software version mix","subLabel":"Catalyst Center inventory by family","color":"#0ea5e9","thresholdNote":"Version sprawl (many distinct versions for one device family) is itself a risk signal, independent of formal EoL dates. This is groundwork for LDOS tracking, not a complete LDOS status yet."}]}
description = <p>Groups managed devices by <b>device family</b> and <b>software version</b> from Catalyst Center inventory, providing the version-distribution baseline needed to flag devices approaching End of Life/End of Support (LDOS).</p>
explanation = <p>Catalyst Center's inventory report (<code>cisco:catalyst:center:inventory:report</code>) carries per-device <code>Device Family</code>, <code>Device Type</code>, and <code>Software Version</code> fields. Deduplicating on <code>Serial No.</code> avoids double-counting devices reported multiple times within the search window, then rolling up by family and version gives a fleet-wide software currency view.</p>
solution = <p>Use this to identify version sprawl &mdash; many distinct versions for the same device family usually means an inconsistent upgrade cadence, which is itself a risk signal independent of formal LDOS dates.</p>
related_info = <ul><li><b>Cisco Software End-of-Life Policy</b><br>Cisco's published EoL/EoS milestone definitions &mdash; the reference this search's follow-on lookup would need to encode.</li><li><b>Catalyst Center Inventory Report</b><br>Source report for <code>cisco:catalyst:center:inventory:report</code>, collected via <code>TA_cisco_catalyst</code>.</li></ul>
search = index="<<index>>" sourcetype="cisco:catalyst:center:inventory:report"\
