date_updated = 2026-07-21 22:00:00
category = Security
sub_category = Secure Infrastructure
tags = Secure Networking,Secure Infrastructure,Meraki,BSSID,Wireless
default_viz = splunk.table
viz_options = {"seriesColors":["#2563EB","#16A34A","#F59E0B","#DC2626"],"legendDisplay":"off","overview":[{"workspace":"secure_networking","tileId":"secure_networking_meraki_top_clients_by_ap_events","section":"secure_infrastructure","label":"Meraki Top Detected BSSIDs","subLabel":"Secure Infrastructure","color":"#2563EB","thresholdNote":"Investigate frequently detected BSSIDs seen by multiple APs, especially when their SSID resembles a corporate network or containment policy marks them as rogue."}]}
description = <p>Top <b>wireless BSSIDs detected</b> in Cisco Meraki Air Marshal events, with the number of detecting APs and associated SSIDs.</p>
explanation = <p>Expands the observed <code>bssids{}.bssid</code> values and counts detections per BSSID. The feed does not expose a client <code>src</code> field; <code>bssids{}.detectedBy{}.device</code> identifies Meraki APs that observed each BSSID.</p>
solution = <p>Investigate frequently detected BSSIDs seen by multiple APs, especially when their SSID resembles a corporate network or containment policy marks them as rogue.</p>
related_info = <ul><li><b>Rogue context</b><br><code>secure_networking_meraki_rogue_ap_containment</code> shows associated SSID containment status. Cross-reference detected BSSIDs with the Meraki Dashboard Air Marshal view.</li></ul>
search = index="<<index>>" sourcetype="meraki:airmarshal"\
| eval detected_bssid='bssids{}.bssid', detecting_ap='bssids{}.detectedBy{}.device'\
| mvexpand detected_bssid\
| stats count as event_count, dc(detecting_ap) as detecting_aps, dc(ssid) as ssids_seen, values(ssid) as ssid_list, latest(_time) as last_seen by detected_bssid\
| eval "SSIDs"=mvjoin(mvindex(ssid_list,0,5),", "), "Last Seen"=strftime(last_seen,"%Y-%m-%d %H:%M:%S")\
| sort - event_count\
| head 20\
| rename detected_bssid as "Detected BSSID", detecting_aps as "Detecting APs", event_count as "Event Count", ssids_seen as "SSIDs Seen"\
| table "Detected BSSID", "Event Count", "Detecting APs", "SSIDs Seen", "SSIDs", "Last Seen"

