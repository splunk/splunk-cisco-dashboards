description = <p>Combines <b>Duo denied identity decisions</b> with current <b>endpoint posture failures</b> such as missing encryption, firewall, password, or trust controls.</p>
explanation = <p>Authentication events provide user-facing deny and fraud decisions. Endpoint snapshots provide device-control state. The branches normalize both into a shared event type, reason, identity, endpoint, application, and location table.</p>
solution = <p>Prioritize identities with both denied authentication and unhealthy endpoint posture. A broad increase in one posture reason usually points to an operating-system update, Device Health policy change, or agent rollout issue.</p>
