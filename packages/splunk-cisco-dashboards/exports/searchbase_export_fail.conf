[building_resilience_fit_occupancy_calendar_profile]
search_name = Building Resilience - Expected Occupancy by Time-of-Day and Day-of-Week (fit)
search_author = akhamis
updated_author = akhamis
version = 1.1.0
date_created = 2026-06-10
date_updated = 2026-06-13
category = Building
sub_category = Occupancy
tags = Cisco Spaces,Forecast,Machine Learning
default_viz = splunk.table
viz_options = {"seriesColors":["#16A34A","#0EA5E9","#F59E0B","#DC2626"],"legendDisplay":"off"}
description = <p>Trains a <b>RandomForest regression</b> with the Splunk Machine Learning Toolkit / AI Toolkit command to learn <b>expected room-occupancy %</b> from calendar features &mdash; <b>hour of day, day of week, week of month, and month of year</b> &mdash; then reports the learned occupancy profile per weekday and hour.</p>
explanation = <p>The base search reduces Cisco Spaces SPACE_OCCUPANCY ROOM events to one hourly occupancy_pct series (per-room snapshot &rarr; rooms_occupied / total_rooms * 100), exactly like the snapshot KPI.. Two calendar features are derived from _time with strftime: day_of_week (%A) and hour (%H).</p>
solution = <p>Returns a <code>Day of Week</code> &times; <code>Hour</code> table of <code>Expected Occupancy %</code> &mdash; the model's answer to &ldquo;what occupancy do we normally expect at this time?&rdquo;. Render as a table or heat-map.</p>
related_info = <ul><li><b>Requires the Machine Learning Toolkit</b><br><code>fit</code>/<code>apply</code> ship with the Splunk AI/Machine Learning Toolkit, not core Splunk.</li><li><b>Categorical features</b><br>String calendar fields are one-hot encoded by the MLTK; keep them as strings, not numbers.</li><li><b>Persisted model</b><br><code>into spaces_occupancy_calendar_model</code> lets a later search <code>apply</code> the model to live data without re-fitting.</li></ul>
search = index="<<index>>" sourcetype="cisco:spaces:firehose" eventType="SPACE_OCCUPANCY" "spaceOccupancy.space.type"=ROOM\
| bin _time span=1h\
| stats max(spaceOccupancy.peakPeopleCount) as peak, latest(spaceOccupancy.peoplePresence) as present by _time, spaceOccupancy.space.floorId, spaceOccupancy.space.name\
| eval occupied=if(present=="true" OR peak>0, 1, 0)\
| stats count as total_rooms, sum(occupied) as rooms_occupied by _time\
| eval occupancy_pct=if(total_rooms>0, round(rooms_occupied/total_rooms*100, 2), 0)\
| eval day_of_week=strftime(_time,"%A"), hour=strftime(_time,"%H")\
| fit RandomForestRegressor occupancy_pct from day_of_week hour into user:spaces_occupancy_calendar_model\
| eval expected_occupancy=round('predicted(occupancy_pct)', 1)\
| stats avg(expected_occupancy) as expected_occupancy by day_of_week, hour\
| eval day_order=case(day_of_week=="Sunday",0, day_of_week=="Monday",1, day_of_week=="Tuesday",2, day_of_week=="Wednesday",3, day_of_week=="Thursday",4, day_of_week=="Friday",5, day_of_week=="Saturday",6)\
| sort day_order, hour\
| eval expected_occupancy=round(expected_occupancy, 1)\
| fields day_of_week hour expected_occupancy\
| rename day_of_week as "Day of Week", hour as "Hour", expected_occupancy as "Expected Occupancy %"

