search_name = TE - Network - Expected Latency Calendar Profile (RandomForest)
search_author = akhamis
updated_author = akhamis
version = 1.0.0
date_created = 2026-06-14
date_updated = 2026-06-14
category = ThousandEyes
sub_category = Network Performance
tags = ThousandEyes,Latency,Machine Learning,RandomForest,Baseline,SLA,Forecast
default_viz = splunk.table
viz_options = {"seriesColors":["#0284C7","#16A34A","#F59E0B","#DC2626"],"legendDisplay":"off"}
description = <p>Builds a test-type x day-of-week x hour expected latency baseline using Random Forest regression. Establishes a data-driven performance SLA per hour of the week, enabling context-aware alerting that avoids false positives during expected high-latency windows.</p>
explanation = <p>Trains a <code>RandomForestRegressor</code> on hourly average latency per test type with <code>test_type</code>, <code>day_of_week</code>, and <code>hour</code> as features using the <code>Cisco_ThousandEyes.Test_Metrics</code> data model. The expected latency for each weekly slot becomes a dynamic SLA baseline, replacing static threshold alerts with model-driven performance expectations.</p>
solution = <p>Replace static latency threshold alerts (e.g., "&gt;50ms = alert") with the expected latency from this model. Alerts generated as deviations from the expected value are far more actionable than threshold breaches, since expected latency naturally varies by hour, day, and test type.</p>
related_info = <ul><li><b>Data model</b>: Cisco_ThousandEyes.Test_Metrics</li><li><b>Algorithm</b>: RandomForestRegressor (MLTK)</li><li><b>Model</b>: teuc_latency_calendar_model</li><li><b>Use case</b>: Dynamic SLA baseline generation</li></ul>
search = | tstats summariesonly=false allow_old_summaries=false fillnull_value=null avg(Test_Metrics.metric_name:network.latency) as avg_latency_ms FROM DATAMODEL=Cisco_ThousandEyes.Test_Metrics WHERE Test_Metrics.thousandeyes.test.type="agent-to-server" BY _time span=1h, Test_Metrics.thousandeyes.test.type\
| rename Test_Metrics.thousandeyes.test.type as test_type\
| eval day_of_week=strftime(_time,"%A"), hour=strftime(_time,"%H")\
| fit RandomForestRegressor avg_latency_ms from test_type day_of_week hour into user:teuc_latency_calendar_model\
| eval expected_latency_ms=round('predicted(avg_latency_ms)', 2)\
| stats avg(avg_latency_ms) as obs_avg_ms avg(expected_latency_ms) as exp_avg_ms count as samples by test_type, day_of_week, hour\
| eval delta_ms=round(obs_avg_ms-exp_avg_ms, 2)\
| eval day_order=case(day_of_week=="Sunday",0, day_of_week=="Monday",1, day_of_week=="Tuesday",2, day_of_week=="Wednesday",3, day_of_week=="Thursday",4, day_of_week=="Friday",5, day_of_week=="Saturday",6)\
| sort test_type, day_order, hour\
| rename test_type as "Test Type" day_of_week as "Day" hour as "Hour" obs_avg_ms as "Obs Avg ms" exp_avg_ms as "Expected ms" delta_ms as "Delta ms" samples as "Samples"

