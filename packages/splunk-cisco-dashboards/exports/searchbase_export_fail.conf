| eval sgt_value=coalesce(direct_sgt,ise_sgt)\
| where isnotnull(sgt_value) AND sgt_value!="" AND sgt_value!="0" AND NOT match(sgt_value,"^0{1,4}-0(?:\s|$)")\
| stats count as sgt_enforced_blocks\
| fillnull value=0 sgt_enforced_blocks\
| eval label="SGT-Enforced Firewall Blocks"\
| table label, sgt_enforced_blocks

