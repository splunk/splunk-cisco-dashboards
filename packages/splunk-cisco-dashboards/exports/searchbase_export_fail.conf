viz_options = {"modalTitle":"Camera Multivariate Anomaly Detail","modalSubtitle":"Joint headcount and delta anomalies by location for {rangeLabel}.","rowKeyField":"location","emptyMessage":"No joint camera headcount/delta anomalies in this window.","errorMessage":"Unable to load camera multivariate anomaly detail.","columns":[{"field":"_time","label":"Time","kind":"time"},{"field":"location","label":"Location","fallback":"Unknown"},{"field":"slot","label":"Slot","fallback":"-"},{"field":"avg_headcount","label":"Avg Headcount","align":"right","kind":"metric","fallback":"-"},{"field":"avg_delta","label":"Avg Delta","align":"right","kind":"metric","fallback":"-"},{"field":"is_count_outlier","label":"Count Outlier","fallback":"-"},{"field":"is_delta_outlier","label":"Delta Outlier","fallback":"-"}]}
description = <p>Joint two-dimensional anomaly detection on camera headcount AND count-delta per location using multivariate DensityFunction. Catches combinations of unusual occupancy level and unusual rate-of-change that univariate models miss.</p>
