| eval is_anomaly=coalesce('IsOutlier(active_ratio)','IsOutlier')\
| eval is_anomaly=if(is_anomaly==1 OR lower(tostring(is_anomaly))=="true", 1, 0)\
| where is_anomaly=1\
| sort - _time\
| fields _time location slot active_devices inactive_devices active_ratio is_anomaly

