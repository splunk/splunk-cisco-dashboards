[security_ftd_potential_data_exfiltration]
search_name = Security - FTD - Potential Data Exfiltration
search_author = Nasreddine Bencherchali, Splunk
updated_author = OpenAI Codex
version = 7.0.0
date_created = 2025-04-03
date_updated = 2026-08-10
category = Security
sub_category = ESCU Detections
tags = FTD,Security,Threats,Firewall,Table,ESCU
dispatch_context = CiscoSecurityCloud
dispatch_context_origin = security_content
dispatch_context_force = 0
search_hidden = 0
default_viz = splunk.table
viz_options = {"seriesColors":["#DC2626","#F59E0B","#2563EB","#16A34A"],"legendDisplay":"off"}
description = <p>Flags inside-to-outside Cisco Secure Firewall connection events where the initiator sends at least 100 MB, providing a focused signal for possible large-volume data exfiltration.</p>
explanation = <p>The production Splunk Security Content analytic reads <code>cisco:sfw:estreamer</code> <code>ConnectionEvent</code> telemetry, restricts it to <code>IngressZone="inside"</code> and <code>EgressZone="outside"</code>, converts <code>InitiatorBytes</code> to megabytes, and retains connections at or above 100 MB. Results preserve source, destination, transport, action, policy rule, URL, destination ports, and first/last observation time. This fills a different gap from the existing destination-cardinality hunt: it identifies a single high-volume outbound transfer.</p>
solution = <p>Triage each row against the asset owner, destination reputation, expected backup/synchronization jobs, and endpoint process telemetry. Tune approved backup servers, CI/CD systems, and enterprise file-sync services before alerting. Confirm that local zone names are exactly <code>inside</code> and <code>outside</code>; otherwise replace those predicates with the deployment's real ingress and egress zones.</p>
related_info = <ul><li><b>Upstream detection</b><br><a href="https://github.com/splunk/security_content/blob/a9ff0e20cb4fe1319ac581ff2fa64a536d8a8842/detections/network/cisco_secure_firewall___potential_data_exfiltration.yml">Cisco Secure Firewall - Potential Data Exfiltration</a> (UUID 3d8536b6-52b4-4c3e-b695-3f2e90bb22be, content version 7).</li><li><b>Required data</b><br>Cisco Secure Firewall Threat Defense Connection Event logs from the Splunk Add-on for Cisco Security Cloud, with access-policy logging enabled.</li><li><b>ATT&amp;CK</b><br>T1041, T1567.002, and T1048.003.</li><li><b>Known tuning need</b><br>Large backups, file synchronization, build deployments, and asymmetric sessions can be benign.</li></ul>
search = `index_firewall` sourcetype="cisco:sfw:estreamer" EventType=ConnectionEvent IngressZone="inside" EgressZone="outside"\
| eval initiator_mb=round(InitiatorBytes/1024/1024, 2)\
| where initiator_mb>=100\
| eval Potentially_Exfiltrated=initiator_mb." MB"\
| stats min(_time) as firstTime, max(_time) as lastTime, values(url) as url, values(rule) as rule, values(dest_port) as dest_port by src, dest, Potentially_Exfiltrated, transport, action\
| convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)

[security_ftd_high_eve_threat_confidence]
search_name = Security - FTD - High EVE Threat Confidence
search_author = Nasreddine Bencherchali, Splunk
updated_author = OpenAI Codex
version = 7.0.0
date_created = 2025-04-03
date_updated = 2026-08-10
category = Security
sub_category = ESCU Detections
tags = FTD,Security,Threats,Encryption,Table,ESCU
dispatch_context = CiscoSecurityCloud
dispatch_context_origin = security_content
dispatch_context_force = 0
search_hidden = 0
default_viz = splunk.table
viz_options = {"seriesColors":["#DC2626","#F59E0B","#2563EB","#16A34A"],"legendDisplay":"off"}
description = <p>Surfaces Cisco Secure Firewall connections with an Encrypted Visibility Engine threat-confidence score of 80 percent or higher.</p>
explanation = <p>The production Splunk Security Content analytic filters Secure Firewall <code>ConnectionEvent</code> records on <code>EVE_ThreatConfidencePct&gt;=80</code>, then groups them by EVE process, score, endpoints, port, transport, and action. Existing FTD searches expose connection, policy, intrusion, and encryption summaries, but none applies this high-confidence EVE security threshold.</p>
solution = <p>Validate the reported <code>EVE_Process</code>, destination, policy rule, and endpoint activity. Escalate unknown processes or destinations, especially when the firewall allowed the session. Internal tools and uncommon encryption libraries can score highly, so tune confirmed applications rather than lowering the threshold globally.</p>
related_info = <ul><li><b>Upstream detection</b><br><a href="https://github.com/splunk/security_content/blob/a9ff0e20cb4fe1319ac581ff2fa64a536d8a8842/detections/network/cisco_secure_firewall___high_eve_threat_confidence.yml">Cisco Secure Firewall - High EVE Threat Confidence</a> (UUID 8c15183e-2e70-4db4-86c3-88f8d9129b66, content version 7).</li><li><b>Required data</b><br>Cisco Secure Firewall Threat Defense Connection Event logs with EVE fields populated.</li><li><b>ATT&amp;CK</b><br>T1041, T1071.001, T1105, and T1573.002.</li><li><b>Known tuning need</b><br>Custom applications and uncommon encryption implementations can produce benign high scores.</li></ul>
search = `index_firewall` sourcetype="cisco:sfw:estreamer" EventType=ConnectionEvent EVE_ThreatConfidencePct>=80\
| stats count, min(_time) as firstTime, max(_time) as lastTime, values(rule) as rule, values(url) as url by EVE_Process, EVE_ThreatConfidencePct, src, dest, dest_port, transport, action\
| convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)

[security_ios_xe_vty_access_class_tampering]
search_name = Security - IOS XE - VTY Access Class Tampering
search_author = Nasreddine Bencherchali
updated_author = OpenAI Codex
version = 1.0.0
date_created = 2026-05-19
date_updated = 2026-08-10
category = Security
sub_category = ESCU Detections
tags = IOS,Security,Threats,Configuration,Table,ESCU
dispatch_context = TA_cisco_catalyst
dispatch_context_origin = security_content
dispatch_context_force = 0
search_hidden = 0
default_viz = splunk.table
viz_options = {"seriesColors":["#DC2626","#F59E0B","#2563EB","#16A34A"],"legendDisplay":"off"}
description = <p>Detects a one-minute IOS XE command sequence that enters VTY configuration, removes an access class, and adds an access class, indicating possible management-plane access-control tampering.</p>
explanation = <p>The production Splunk Security Content analytic parses both EEM and parser command-log formats from <code>HA_EM:LOG</code> and <code>PARSER:CFGLOG_LOGGEDCMD</code> events. It normalizes commands, users, source IPs, and devices; assigns semantic event types; and requires <code>line_vty</code>, <code>remove_access_class</code>, and <code>add_access_class</code> on the same device within one minute. The current catalog has generic IOS configuration-change searches but no equivalent sequence correlation.</p>
solution = <p>Treat unapproved results as urgent because VTY ACL changes can expose SSH or other remote-management access. Correlate the user and source IP with TACACS+/RADIUS accounting and an approved change. Tune only explicit maintenance windows and known automation identities.</p>
related_info = <ul><li><b>Upstream detection</b><br><a href="https://github.com/splunk/security_content/blob/a9ff0e20cb4fe1319ac581ff2fa64a536d8a8842/detections/application/cisco_ios_xe_vty_access_class_tampering.yml">Cisco IOS XE VTY Access Class Tampering</a> (UUID a01ca274-16cb-476d-a814-d2ffe29d8905, content version 1).</li><li><b>Required data</b><br><code>cisco:ios</code> syslog collected by the Cisco Catalyst Add-on, with archive/configuration command logging enabled.</li><li><b>ATT&amp;CK</b><br>T1562 and T1021.</li><li><b>Threat context</b><br><a href="https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-239a">CISA advisory AA25-239A</a>.</li></ul>
search = `index_network` sourcetype="cisco:ios" facility IN ("HA_EM", "PARSER") mnemonic IN ("LOG", "CFGLOG_LOGGEDCMD") message_text IN ("*access-class*", "*configure http*", "*line vty*")\
| rex field=message_text "^(?:[^:]+:\s+)?(?:catchall:\s+)?(?<eem_command>.+?)\s*$"\
| rex field=message_text "<enteredCommand><cli>(?<parser_command>.*?)</cli>"\
| rex field=message_text "<user>(?<parser_user>[^<]+)</user>"\
| rex field=message_text "<srcIP>(?<parser_src_ip>[^<]+)</srcIP>"\
| eval command=lower(trim(coalesce(parser_command, eem_command, "")))\
| eval event_type=case(like(command, "configure http%") OR like(command, "ip http secure-server%"), "http_config", like(command, "line vty%"), "line_vty", like(command, "no access-class%"), "remove_access_class", like(command, "access-class%"), "add_access_class", true(), null())\
| where isnotnull(event_type)\
| eval user=coalesce(parser_user, user, "unknown"), src_ip=coalesce(parser_src_ip, src_ip, "unknown"), dest=coalesce(host, dvc, dest, "unknown")\
| bin _time span=1m\
| stats count, min(_time) as firstTime, max(_time) as lastTime, values(event_type) as event_types, values(user) as user, values(src_ip) as src_ip, values(command) as commands by _time, dest\
| where mvfind(event_types, "line_vty")>=0 AND mvfind(event_types, "remove_access_class")>=0 AND mvfind(event_types, "add_access_class")>=0\
| convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)

[security_ios_xe_webui_programmatic_configuration]
search_name = Security - IOS XE - WebUI Programmatic Configuration
search_author = Nasreddine Bencherchali
updated_author = OpenAI Codex
version = 1.0.0
date_created = 2026-05-19
date_updated = 2026-08-10
category = Security
sub_category = ESCU Detections
tags = IOS,Security,Threats,Configuration,Table,ESCU
dispatch_context = TA_cisco_catalyst
dispatch_context_origin = security_content
dispatch_context_force = 0
search_hidden = 0
default_viz = splunk.table
viz_options = {"seriesColors":["#DC2626","#F59E0B","#2563EB","#16A34A"],"legendDisplay":"off"}
description = <p>Detects IOS XE configuration changes attributed to the <code>SEP_webui_wsma_http</code> WebUI process, a high-value indicator of configuration performed through the HTTP management plane.</p>
explanation = <p>The production Splunk Security Content analytic matches the exact IOS XE <code>SYS:CONFIG_P</code> message emitted when the device is configured programmatically by <code>SEP_webui_wsma_http</code>. It extracts the process, user, and VTY from the raw event and groups observations by device and user. No existing catalog search matches this process-specific signal.</p>
solution = <p>Validate every result against an approved WebUI administration session and the originating identity. If the activity is not expected, isolate management-plane access, preserve configuration diffs and authentication logs, and investigate for exploitation or stolen credentials. The upstream analytic identifies no known false positives, but authorized WebUI changes remain possible.</p>
related_info = <ul><li><b>Upstream detection</b><br><a href="https://github.com/splunk/security_content/blob/a9ff0e20cb4fe1319ac581ff2fa64a536d8a8842/detections/application/cisco_ios_xe_webui_programmatic_configuration.yml">Cisco IOS XE WebUI Programmatic Configuration</a> (UUID f9686576-a23d-4c4d-bfad-a45499dc448a, content version 1).</li><li><b>Required data</b><br><code>cisco:ios</code> syslog collected by the Cisco Catalyst Add-on, with IOS XE WebUI activity logging enabled.</li><li><b>ATT&amp;CK</b><br>T1190 and T1078.</li><li><b>Threat context</b><br><a href="https://blog.talosintelligence.com/salt-typhoon-analysis/">Cisco Talos Salt Typhoon analysis</a>.</li></ul>
search = `index_network` sourcetype="cisco:ios" facility="SYS" mnemonic="CONFIG_P" message_text="*Configured programmatically by process SEP_webui_wsma_http*"\
| rex field=_raw "process\s(?<process>\S+)\sfrom.*as\s(?<user>\S+)\son\s(?<vty>\S+)"\
| eval dest=coalesce(host, dvc, dest, "unknown")\
| stats count, min(_time) as firstTime, max(_time) as lastTime, values(process) as process, values(vty) as vty by dest, user\
| convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)

[security_duo_bulk_policy_deletion]
search_name = Security - Duo - Bulk Policy Deletion
search_author = Patrick Bareiss, Splunk
updated_author = OpenAI Codex
version = 5.0.0
date_created = 2025-07-10
date_updated = 2026-08-10
category = Security
sub_category = ESCU Detections
tags = Duo,Zero Trust Access,Policies,Identity,Table,ESCU
dispatch_context = CiscoSecurityCloud
dispatch_context_origin = security_content
dispatch_context_force = 0
search_hidden = 0
default_viz = splunk.table
viz_options = {"seriesColors":["#DC2626","#F59E0B","#2563EB","#16A34A"],"legendDisplay":"off"}
description = <p>Detects a Cisco Duo administrative event that deletes more than three policies in one bulk action.</p>
explanation = <p>The production Splunk Security Content analytic selects <code>action=policy_bulk_delete</code> from Duo administrator logs, parses the policy names from the event description, counts them, and retains actions affecting more than three policies. Existing Duo searches cover tenants, authentication, endpoints, users, and general audit activity, but none implements this destructive-action threshold.</p>
solution = <p>Confirm the named administrator and deleted policy set against an approved change immediately. If unauthorized, secure the admin account, restore required policies, review subsequent authentication outcomes, and inspect other administrative changes made in the same session. No upstream false positives are currently identified.</p>
related_info = <ul><li><b>Upstream detection</b><br><a href="https://github.com/splunk/security_content/blob/a9ff0e20cb4fe1319ac581ff2fa64a536d8a8842/detections/application/cisco_duo_bulk_policy_deletion.yml">Cisco Duo Bulk Policy Deletion</a> (UUID 983be012-e408-4cb0-b87f-6756bb5f7047, content version 5).</li><li><b>Required data</b><br><code>cisco:duo:administrator</code> activity logs ingested with the Splunk Add-on for Cisco Security Cloud.</li><li><b>ATT&amp;CK</b><br>T1556.</li><li><b>Threshold</b><br>The upstream rule defines bulk deletion as more than three parsed policy names in one event.</li></ul>
search = `index_duo` sourcetype="cisco:duo:administrator" action=policy_bulk_delete\
| rename username as user\
| spath input=description\
| rex field=policies max_match=0 "(?<policy_name>[^:,]+):\s+"\
| eval policy_count=mvcount(policy_name)\
| where policy_count>3\
| stats count, min(_time) as firstTime, max(_time) as lastTime by action, actionlabel, description, user, admin_email, policy_count\
| convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)

[security_nvm_rclone_network_activity]
search_name = Security - NVM - Rclone Network Activity
search_author = Nasreddine Bencherchali, Splunk
updated_author = OpenAI Codex
version = 7.0.0
date_created = 2025-07-01
date_updated = 2026-08-10
category = Security
sub_category = ESCU Detections
tags = Secure Client,Security,Threats,Forensics,Table,ESCU
dispatch_context = CiscoSecurityCloud
dispatch_context_origin = security_content
dispatch_context_force = 0
search_hidden = 0
default_viz = splunk.table
viz_options = {"seriesColors":["#DC2626","#F59E0B","#2563EB","#16A34A"],"legendDisplay":"off"}
description = <p>Detects Rclone execution or characteristic Rclone transfer arguments in Cisco Network Visibility Module flow telemetry while preserving process and network evidence.</p>
explanation = <p>The production Splunk Security Content analytic matches <code>rclone.exe</code> directly or command-line combinations associated with copying to remote, MEGA, or FTP targets. It aggregates parent/child process arguments and hashes, loaded module details, logged-in users, and destination context. Existing NVM searches inventory applications, endpoints, users, and flows, but do not detect Rclone behavior.</p>
solution = <p>Confirm whether Rclone is approved on the endpoint and whether the remote name and destination belong to an authorized backup workflow. For unapproved use, preserve the process tree and hashes, investigate staged data and credentials, and contain the endpoint. Tune known service accounts, folders, remote names, and backup windows rather than suppressing all Rclone use.</p>
related_info = <ul><li><b>Upstream detection</b><br><a href="https://github.com/splunk/security_content/blob/a9ff0e20cb4fe1319ac581ff2fa64a536d8a8842/detections/endpoint/cisco_nvm___rclone_execution_with_network_activity.yml">Cisco NVM - Rclone Execution With Network Activity</a> (UUID 719f8c78-b20d-4bb9-8c33-6d1a762e7a9a, content version 7).</li><li><b>Required data</b><br><code>cisco:nvm:flowdata</code> or <code>cisco:nvm:flowdata:v2</code> from the Splunk Add-on for Cisco Endpoint Security Analytics.</li><li><b>ATT&amp;CK</b><br>T1567.002.</li><li><b>Known tuning need</b><br>Rclone can be legitimate in backup and synchronization workflows.</li></ul>
search = `index_nvm` sourcetype IN ("cisco:nvm:flowdata", "cisco:nvm:flowdata:v2") (process_name="rclone.exe" OR (process_arguments="* copy *" process_arguments="*\\*" process_arguments IN ("*remote:*", "*mega:*", "*ftp:*", "*ftp1:*")) OR (process_arguments IN ("*remote:*", "*mega:*", "*ftp:*", "*ftp1:*") process_arguments="*--transfers" process_arguments="*--ignore-existing*" process_arguments="*--auto-confirm*"))\
| stats count, min(_time) as firstTime, max(_time) as lastTime, values(parent_process_arguments) as parent_process_arguments, values(process_arguments) as process_arguments, values(parent_process_hash) as parent_process_hash, values(process_hash) as process_hash, values(module_name_list) as module_name_list, values(module_hash_list) as module_hash_list, values(dest_port) as dest_port, values(aliul) as additional_logged_in_users_list, values(dest_hostname) as dest_hostname by src, dest, parent_process_path, parent_process_integrity_level, process_path, process_name, process_integrity_level, process_id, transport\
| convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)\
| table parent_process_integrity_level, parent_process_path, parent_process_arguments, parent_process_hash, process_integrity_level, process_path, process_name, process_arguments, process_hash, process_id, additional_logged_in_users_list, module_name_list, module_hash_list, src, dest_hostname, dest, dest_port, transport, firstTime, lastTime

[security_isovalent_potential_escape_to_host]
search_name = Security - Isovalent - Potential Escape to Host
search_author = Bhavin Patel, Splunk
updated_author = OpenAI Codex
version = 6.0.0
date_created = 2026-01-05
date_updated = 2026-08-10
category = Security
sub_category = ESCU Detections
tags = Isovalent,Security,Cloud Security,Threats,Table,ESCU
dispatch_context = splunk-cisco-dashboards
dispatch_context_origin = security_content
dispatch_context_force = 1
search_hidden = 0
default_viz = splunk.table
viz_options = {"seriesColors":["#DC2626","#F59E0B","#2563EB","#16A34A"],"legendDisplay":"off"}
description = <p>Detects a rapid combination of host-oriented commands such as nsenter, mount, ps, and ls inside a Kubernetes pod, which can indicate attempted container escape or host discovery.</p>
explanation = <p>The production Splunk Security Content analytic reads Isovalent <code>processExec</code> telemetry, groups activity into five-minute windows by cluster, node, and pod, and requires at least two distinct command names within 120 seconds. Existing Isovalent searches summarize alerts, policies, and vulnerability categories but do not correlate this process sequence.</p>
solution = <p>Inspect the pod's privileges, hostPID/hostPath settings, image, service account, and initiating user. Correlate the commands with Kubernetes audit and runtime alerts. Authorized node-debugging containers can legitimately use <code>nsenter</code> or <code>mount</code>; tune explicit administrative namespaces, images, and workflows only after validation.</p>
related_info = <ul><li><b>Upstream detection</b><br><a href="https://github.com/splunk/security_content/blob/a9ff0e20cb4fe1319ac581ff2fa64a536d8a8842/detections/endpoint/cisco_isovalent___potential_escape_to_host.yml">Cisco Isovalent - Potential Escape to Host</a> (UUID 2b8a7a21-bec6-4e1f-84c4-7b319f45d2ab, content version 6).</li><li><b>Required data</b><br><code>cisco:isovalent:processExec</code> telemetry from Cisco Isovalent Runtime Security.</li><li><b>ATT&amp;CK</b><br><a href="https://attack.mitre.org/techniques/T1611/">T1611 — Escape to Host</a>.</li><li><b>Known tuning need</b><br>Legitimate privileged debugging and hostPID workflows can produce the same commands.</li></ul>
search = `index_security` sourcetype="cisco:isovalent:processExec" (process_name IN ("nsenter", "mount", "ps", "ls") OR process IN ("*nsenter*", "*mount*", "*ps aux*", "*ps -ef*"))\
| bin _time span=5m\
| stats count as total_events, dc(process_name) as distinct_cmds, min(_time) as firstTime, max(_time) as lastTime, values(process) as process, values(process_name) as process_name by cluster_name, node_name, pod_name, _time\
| eval duration_s=round(lastTime-firstTime, 0)\
| where distinct_cmds>=2 AND duration_s<=120\
| table _time, cluster_name, node_name, pod_name, total_events, distinct_cmds, duration_s, firstTime, lastTime, process, process_name\
| convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)
